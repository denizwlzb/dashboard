<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Dashboard Deniz · Télé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--t1:#fff;--t2:rgba(255,255,255,.66);--t3:rgba(255,255,255,.42);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--pink:#ff375f;--teal:#64d2ff;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;cursor:none}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:24px;font-weight:500;letter-spacing:-.014em;color:var(--t1);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#070b1a}
/* fond façon fond d'écran iOS : grandes taches de couleur floues et douces */
#wall{position:absolute;left:0;top:0;width:1920px;height:1080px;
  background:radial-gradient(1000px 760px at 6% 0%,rgba(10,132,255,.62),transparent 68%),radial-gradient(900px 700px at 100% 6%,rgba(191,90,242,.50),transparent 68%),radial-gradient(1100px 760px at 78% 104%,rgba(48,209,88,.28),transparent 68%),radial-gradient(900px 640px at 0% 100%,rgba(255,55,95,.30),transparent 68%),linear-gradient(180deg,#0a1230,#070a18)}

/* Matière « verre liquide » : reflet en haut à gauche, bords lumineux, ombre profonde */
.t{position:absolute;border-radius:46px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.07));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.10),inset 2px 0 0 rgba(255,255,255,.10),inset -2px 0 0 rgba(255,255,255,.10),0 32px 80px rgba(0,0,0,.38);
  animation:rise 1s var(--ease) both}
.t::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;background:radial-gradient(120% 70% at 0% 0%,rgba(255,255,255,.22),rgba(255,255,255,0) 58%);pointer-events:none;z-index:1}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.965)}to{opacity:1;transform:none}}
#cache{display:none}
.hd2{display:flex;align-items:center;font-size:22px;font-weight:600;color:var(--t2);letter-spacing:-.01em}
.hd2 svg{width:26px;height:26px;margin-right:9px;flex:none}

/* ── Grille : marges 72 px, gouttières 24 px, 12 colonnes de 126 px, 6 rangées de 140 px ── */
#hd{position:absolute;left:72px;top:60px;width:876px;height:304px}
#mw{left:972px;top:60px;width:876px;height:304px;padding:30px 34px;animation-delay:.05s}
#mhour{left:972px;top:388px;width:876px;height:140px;padding:0 20px;animation-delay:.12s}
#spw{left:72px;top:388px;width:876px;height:468px;animation-delay:.18s}
#gym{left:972px;top:552px;width:876px;height:304px;display:grid;grid-template-columns:214px 252px 1fr;grid-column-gap:14px;align-items:stretch;animation-delay:.24s}
#weekw{left:72px;top:880px;width:876px;height:140px;padding:0 28px;display:flex;align-items:center;animation-delay:.3s}
#bb{left:972px;top:880px;width:426px;height:140px;padding:0 24px;display:flex;align-items:center;animation-delay:.36s}
/* emplacement libre pour un futur widget : x 1422, y 880, 426 × 140 */

/* Horloge façon écran verrouillé */
#date{font-size:36px;font-weight:600;color:var(--t2);text-transform:capitalize;letter-spacing:-.01em}
#clock{display:flex;align-items:baseline;font-size:222px;font-weight:200;letter-spacing:-.055em;line-height:.98;margin-left:-8px}
#clock .dg{display:inline-block;min-width:.56em;text-align:center;color:#fff}
#clock .sep{opacity:.5;margin:0 .02em;transform:translateY(-.06em)}
#clock .chg{animation:dgIn .8s var(--ease) both}
#clock .chgH{animation:dgHour 1.1s var(--ease) both}
@supports (-webkit-background-clip:text){#clock .dg,#clock .sep{background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.5));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}}
#hi{font-size:30px;font-weight:600;color:var(--t3);margin-top:4px}
@keyframes dgIn{0%{opacity:0;transform:translateY(.28em)}100%{opacity:1;transform:none}}
@keyframes dgHour{0%{opacity:0;transform:translateY(.45em) scale(.92)}100%{opacity:1;transform:none}}

/* Météo (grand widget) */
#mw .wl{position:absolute;left:34px;top:30px;width:340px}
#wxBigV{font-size:24px;font-weight:600}
#wxBigT{font-size:124px;font-weight:200;letter-spacing:-.06em;line-height:1;margin-top:6px;margin-left:-4px}
#wxBigC{font-size:28px;font-weight:600;margin-top:4px}
#wxHL{font-size:24px;color:var(--t2);margin-top:4px}
.sunrow{font-size:20px;color:var(--t3);margin-top:8px}
.sunrow b{color:var(--t2);font-weight:600}
#wxIco{position:absolute;left:260px;top:62px;font-size:92px;line-height:1}
#fc{position:absolute;left:420px;top:26px;right:34px;bottom:26px;display:flex;flex-direction:column;justify-content:space-between}
.fr{display:flex;align-items:center;flex:1;border-top:1px solid rgba(255,255,255,.14)}
.fr:first-child{border-top:0}
.fj{width:86px;font-size:24px;font-weight:600;text-transform:capitalize}
.fi{width:58px;font-style:normal;font-size:34px;line-height:1}
.fmn{width:52px;text-align:right;font-size:24px;font-weight:500;color:var(--t2)}
.fbar{flex:1;height:9px;margin:0 14px;border-radius:5px;background:rgba(255,255,255,.18);position:relative}
.fbar u{position:absolute;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#5ac8fa,#ffd60a 62%,#ff9f0a)}
.fmx{width:50px;font-size:24px;font-weight:600}
.wi{display:inline-block;width:1em;height:1em;vertical-align:-.12em}

/* Heure par heure */
#wxh{display:flex;height:100%}
.hr{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hr span{font-size:20px;color:var(--t2);font-weight:500}
.hr i{font-style:normal;font-size:40px;line-height:1.25}
.hr b{font-size:27px;font-weight:600}

/* Lecture en cours : fond teinté par la pochette, paroles façon Apple Music */
#npbg{position:absolute;left:-60px;top:-60px;right:-60px;bottom:-60px;background:rgba(255,255,255,.04) center/cover;filter:blur(54px) saturate(1.8) brightness(.55)}
#spw>*{z-index:2}
#spw>#npbg{z-index:0}
#sArt{position:absolute;left:34px;top:34px;width:300px;height:300px;border-radius:32px;background:rgba(255,255,255,.1) center/cover;box-shadow:0 26px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.12)}
.pprog{position:absolute;left:34px;top:362px;width:300px}
.pbar2{height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.pbar2 b{display:block;height:100%;width:0;background:#fff;border-radius:4px}
.ptimes{display:flex;justify-content:space-between;font-size:18px;color:var(--t2);margin-top:8px;font-variant-numeric:tabular-nums}
#pdev{position:absolute;left:34px;top:416px;font-size:21px;font-weight:600;color:var(--t2)}
#pdev:empty{display:none}
#pdev::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--green);margin-right:10px;box-shadow:0 0 10px rgba(48,209,88,.9)}
.nph{position:absolute;left:376px;top:32px}
.mq{position:absolute;left:376px;width:466px;overflow:hidden;white-space:nowrap}
.mq>span{display:inline-block}
#sTitleW{top:66px} #sArtistW{top:122px}
#sTitle{font-size:42px;font-weight:700;letter-spacing:-.03em}
#sArtist{font-size:29px;font-weight:500;color:var(--t2)}
.mq>span.defile{animation:defile var(--t,6s) linear infinite alternate}
@keyframes defile{0%,14%{transform:translateX(0)}86%,100%{transform:translateX(var(--d))}}
#spw.paused .mq,#spw.paused #sArt{opacity:.6}
#spw.paused .mq>span{animation-play-state:paused}
#lyrw{position:absolute;left:376px;right:30px;top:176px;bottom:24px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(180deg,transparent,#000 16%,#000 84%,transparent)}
#lyr{height:100%;overflow:hidden}
.ll{font-size:35px;font-weight:700;line-height:1.22;letter-spacing:-.025em;color:rgba(255,255,255,.3);margin-bottom:16px;transform-origin:0 50%;transition:color .5s,transform .6s var(--ease)}
.ll.cur{color:#fff;transform:scale(1.045)}
.ll.past{color:rgba(255,255,255,.4)}
.ll.pl{font-size:28px;font-weight:600;color:rgba(255,255,255,.82);margin-bottom:12px}
.lmsg{font-size:28px;font-weight:600;color:var(--t3);padding-top:90px}

/* Forme : trois barres qui sortent du sol · anneaux en demi-cercle · empreintes · gourdes */
#gymBody{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;padding:28px 0 0 32px;height:100%;position:relative;z-index:2}
#gym .gt{grid-column:1;grid-row:1;font-size:22px;font-weight:600;color:var(--t2)}
#gym .gn{grid-column:2;grid-row:1;font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1;padding-right:4px;font-variant-numeric:tabular-nums}
#gym .gbar{grid-column:1/3;grid-row:2;display:flex;align-items:flex-end;height:208px;margin-top:10px;align-self:end}
#gym .gbar i{flex:1;max-width:56px;margin-right:12px;height:24%;border-radius:16px 16px 0 0;background:rgba(255,255,255,.17);transition:height 1s cubic-bezier(.34,1.4,.64,1),background .6s}
#gym .gbar i.on{height:100%;background:linear-gradient(180deg,#ffb340,#ff9f0a);box-shadow:0 0 28px rgba(255,159,10,.5)}
#gym .gm,#gym .gs{display:none}
.gauge{align-self:center;position:relative;z-index:2}
#rings{width:252px;height:136px;display:block}
#rings path{fill:none;stroke-width:17;stroke-linecap:round}
#rings .rt{stroke:rgba(255,255,255,.13)}
#rings .rf{stroke-dasharray:0 100;opacity:0;transition:stroke-dasharray 1.2s var(--ease),opacity .3s}
.vis{align-self:center;padding-right:26px;position:relative;z-index:2}
.vrow{display:flex;align-items:center;margin-bottom:26px}
.vrow:last-child{margin-bottom:0}
.vtxt{flex:none;width:122px}
.vtxt b{display:block;font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.04;font-variant-numeric:tabular-nums}
.vtxt span{font-size:18px;color:var(--t2);font-weight:500}
.icons{display:flex;align-items:flex-end}
.ic{position:relative;flex:none;width:19px;height:23px;margin-right:4px}
.ic.v{width:21px;height:42px;margin-right:8px}
.ic svg{display:block;width:19px;height:23px}
.ic.v svg{width:21px;height:42px}
.ib svg{fill:rgba(255,255,255,.2)}
.if{position:absolute;left:0;top:0;height:100%;overflow:hidden}
.if svg{fill:var(--c)}
.ic.v .if{top:auto;bottom:0;width:100%}
.ic.v .if svg{position:absolute;left:0;bottom:0}

/* Semaine */
.wk-h{flex:none;width:176px}
.wk-h b{display:block;font-size:31px;font-weight:700;letter-spacing:-.03em;text-transform:capitalize;line-height:1.1}
.wk-h span{display:block;font-size:20px;font-weight:600;color:var(--t2);margin-top:4px}
#week{flex:1;display:flex}
#week .wd{flex:1;min-width:0;height:94px;margin-left:8px;border-radius:26px;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#week .wd small{font-size:15px;font-weight:700;letter-spacing:.08em;color:var(--t2);margin-bottom:5px}
#week .wd b{font-size:32px;font-weight:600;letter-spacing:-.03em}
#week .wd .dot{width:8px;height:8px;border-radius:50%;background:transparent;margin-top:6px}
#week .wd .dot.on{background:var(--orange);box-shadow:0 0 10px rgba(255,159,10,.9)}
#week .wd.past{opacity:.5}
#week .wd.we small{color:#ff9f6b}
#week .wd.now{background:linear-gradient(160deg,#4aa3ff,#0a6cff);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 10px 28px rgba(10,132,255,.55);opacity:1}
#week .wd.now small{color:rgba(255,255,255,.88)}
#week .wd.now .dot.on{background:#fff;box-shadow:none}

/* Imprimante */
.ringc{position:relative;flex:none;width:100px;height:100px;display:flex;align-items:center;justify-content:center;transition:--p 1s linear}
.ringc::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p,0)*1%),rgba(255,255,255,.17) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 12px),#000 calc(100% - 11.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 12px),#000 calc(100% - 11.5px))}
.rtx{position:relative;text-align:center;line-height:1.08}
#bbPct{display:block;font-size:29px;font-weight:700;letter-spacing:-.03em}
#bbPct.lbl{font-size:16px;font-weight:600}
#bbEta{display:block;font-size:16px;color:var(--t2)}
.bbinfo{flex:1;min-width:0;margin-left:22px;position:relative;height:100px}
.bbinfo .hd2{font-size:18px}
.bbinfo .hd2 svg{width:20px;height:20px}
#bbNameW{position:absolute;left:0;top:30px;width:100%}
#bbNameW{position:absolute;overflow:hidden;white-space:nowrap}
#bbName{font-size:28px;font-weight:700;letter-spacing:-.025em}
#bbTimer{position:absolute;left:0;top:70px;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:4px 12px;font:inherit;font-size:17px;line-height:1.25}
#bbTimer[hidden]{display:none}
#bbTimer small{font-size:17px;color:var(--t2)}
#bbTimer b{font-weight:600;margin-left:6px}
#alarme{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:200;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;text-align:center}
#alarme.on{display:flex}
#alarme b{display:block;font-size:120px;font-weight:200;letter-spacing:-.04em}
#alarme span{display:block;margin-top:20px;font-size:36px;color:var(--t2)}
#erreur{position:absolute;left:560px;top:8px;z-index:300;max-width:800px;background:rgba(255,69,58,.92);color:#fff;padding:10px 18px;border-radius:14px;font-size:20px}
@property --p{syntax:"<number>";inherits:true;initial-value:0}
</style>
</head>
<body>
<div id="stage">
  <div id="wall"></div>
  <div id="hd"><div id="date"></div><div id="clock"></div><div id="hi">Bonjour Deniz</div></div>

  <div class="t" id="mw">
    <div class="wl">
      <div class="hd2"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3.5 11 20 4l-7 16.5-2.2-7.3z"/></svg><span id="wxBigV"></span></div>
      <div id="wxBigT">--°</div><div id="wxBigC"></div><div id="wxHL"></div>
      <div class="sunrow">↑ <b id="sunr">--:--</b>   ↓ <b id="suns">--:--</b></div>
    </div>
    <div id="wxIco"></div>
    <div id="fc"></div>
  </div>

  <div class="t" id="mhour"><div id="wxh"></div></div>

  <div class="t" id="spw">
    <div id="npbg"></div>
    <div id="sArt"></div>
    <div class="pprog"><div class="pbar2"><b id="pFill"></b></div><div class="ptimes"><span id="pCur">0:00</span><span id="pTot">0:00</span></div></div>
    <div id="pdev"></div>
    <div class="nph hd2"><svg viewBox="0 0 24 24" fill="#ff375f"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg><span>Lecture en cours</span></div>
    <div class="mq" id="sTitleW"><span id="sTitle">Spotify</span></div>
    <div class="mq" id="sArtistW"><span id="sArtist">Rien en lecture</span></div>
    <div id="lyrw"><div id="lyr"><div class="lmsg">Les paroles apparaîtront ici</div></div></div>
  </div>

  <div class="t" id="gym">
    <div id="gymBody"></div>
    <div class="gauge"><svg id="rings" viewBox="0 0 200 108" aria-hidden="true">
      <defs>
        <linearGradient id="gK" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2d55"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
        <linearGradient id="gM" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ee83a"/><stop offset="1" stop-color="#30d158"/></linearGradient>
        <linearGradient id="gS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#32d2ff"/><stop offset="1" stop-color="#0a84ff"/></linearGradient>
      </defs>
      <path class="rt" d="M10 100A90 90 0 0 1 190 100"/><path class="rf" id="rK" pathLength="100" d="M10 100A90 90 0 0 1 190 100" stroke="url(#gK)"/>
      <path class="rt" d="M32 100A68 68 0 0 1 168 100"/><path class="rf" id="rM" pathLength="100" d="M32 100A68 68 0 0 1 168 100" stroke="url(#gM)"/>
      <path class="rt" d="M54 100A46 46 0 0 1 146 100"/><path class="rf" id="rS" pathLength="100" d="M54 100A46 46 0 0 1 146 100" stroke="url(#gS)"/>
    </svg></div>
    <div class="vis">
      <div class="vrow" style="--c:#0a84ff"><div class="vtxt"><b id="swPas">--</b><span>pas</span></div><div class="icons" id="icPas"></div></div>
      <div class="vrow" style="--c:#64d2ff"><div class="vtxt"><b id="swEau">--</b><span>eau bue</span></div><div class="icons" id="icEau"></div></div>
    </div>
  </div>

  <div class="t" id="weekw"><div class="wk-h"><b id="wkMois"></b><span id="wkNum"></span></div><div id="week"></div></div>

  <div class="t" id="bb">
    <div class="ringc" id="bbRing"><div class="rtx"><b id="bbPct">…</b><span id="bbEta"></span></div></div>
    <div class="bbinfo"><div class="hd2"><svg viewBox="0 0 24 24" fill="#30d158"><path d="M19 8H5a3 3 0 0 0-3 3v6h4v4h12v-4h4v-6a3 3 0 0 0-3-3zm-3 11H8v-5h8zM18 3H6v4h12z"/></svg><span>Bambu Lab A1</span></div><div class="mq" id="bbNameW"><span id="bbName">Connexion…</span></div><button id="bbTimer" hidden></button></div>
  </div>

  <div id="alarme"><div><b>Pièce refroidie</b><span>Tu peux la retirer du plateau</span></div></div>

  <div id="cache">
    <div id="wxT"></div><div id="wx"></div>
    <div id="moonlit"></div><div id="moonname"></div><div id="moonpct"></div>
    <div id="player"><div id="pbg"></div><div id="pcover"></div><div id="pvideo"><div id="ytp"></div></div><div id="pmsg"></div><div id="pTitle"></div><div id="pArtist"></div><div id="pbar"></div>
      <button id="pPrev"></button><button id="pPlay"></button><button id="pNext"></button><button id="segCover"></button><button id="segVideo"></button></div>
  </div>
</div>
<script>
/* Si une erreur survient, elle s'affiche à l'écran (touche pour fermer) : plus facile à diagnostiquer */
function afficherErreur(m){
  let b = document.getElementById("erreur");
  if (!b){ b = document.createElement("div"); b.id = "erreur"; b.onclick = () => { b.remove(); }; document.body.appendChild(b); }
  b.textContent = "Erreur : " + m + " (touche pour fermer)";
}
addEventListener("error", e => afficherErreur(e.message || "inconnue"));
addEventListener("unhandledrejection", e => afficherErreur((e.reason && e.reason.message) || e.reason || "inconnue"));

/* ═══════════════ CONFIGURATION ═══════════════
   Les intégrations externes (réseau) fonctionnent quand ce fichier est ouvert
   depuis votre propre serveur / appareil. Sans configuration, le mode démo s’affiche.
   Ajoutez #demo à l’adresse pour forcer l’affichage des widgets Bambu et Spotify. */
const CONFIG = {
  prenom: "Deniz",
  meteo: { lat: 45.19, lon: 5.72, ville: "Grenoble" },             // coordonnées (Open-Meteo, sans clé)
  icsWorker: "https://cal-k7x92mqp4v.deniz-walzberg.workers.dev/", // Worker Cloudflare qui lit tes calendriers iCloud
  bambuUrl: "",     // JSON local : {state,progress,remaining_min,nozzle,bed,name} (pont MQTT → HTTP)
  spotifyToken: "", // jeton OAuth Spotify (scope user-read-currently-playing)
  intervalle: { meteo: 600, calendrier: 300, bambu: 10, spotify: 5 } // secondes
};
const DEMO = location.hash.replace("#","") === "demo";
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

/* ── Horloge ── */
var semaineJour = "";
var salleJours = [];
function numSemaine(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7)); const a = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - a) / 864e5 + 1) / 7); }
function majSemaine(d){
  const j = d.toDateString(); if (j === semaineJour) return; semaineJour = j;
  const lundi = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7)), auj0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const NOMS = ["LUN", "MAR", "MER", "JEU", "VEN", "SAM", "DIM"];
  $("wkMois").textContent = d.toLocaleDateString("fr-FR", { month: "long" }) + " " + d.getFullYear();
  $("wkNum").textContent = "Semaine " + numSemaine(d);
  $("week").innerHTML = Array.from({ length: 7 }, (_, i) => {
    const x = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + i), auj = x.toDateString() === j;
    return `<span class="wd${auj ? " now" : ""}${x < auj0 ? " past" : ""}${i > 4 ? " we" : ""}"><small>${NOMS[i]}</small><b>${x.getDate()}</b><i class="dot${salleJours[i] ? " on" : ""}"></i></span>`;
  }).join("");
}
/* ── Horloge : chaque chiffre s’anime quand il change ── */
function tick(){
  const d = new Date(), t = pad(d.getHours()) + ":" + pad(d.getMinutes()), el = $("clock");
  if (!el.querySelector(".sep")) el.innerHTML = [...t].map(c => c === ":" ? '<span class="sep">:</span>' : '<span class="dg"></span>').join("");
  [...el.children].forEach((s, i) => {
    if (s.className === "sep" || s.textContent === t[i]) return;
    const premier = s.textContent === "";
    s.textContent = t[i];
    if (!premier){ s.classList.remove("chg", "chgH"); void s.offsetWidth; s.classList.add(i < 2 ? "chgH" : "chg"); }
  });
  $("date").textContent = d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  majSemaine(d);
}

  if (!g){ $("gymBody").innerHTML = `<span class="gt">Salle</span><span class="gm">Salle non connectée</span>`; return; }
  salleJours = g.jours || []; semaineJour = ""; majSemaine(new Date());

  const s = n => n > 1 ? "s" : "";

    : `Plus que ${reste} séance${s(reste)} cette semaine`;

    const j = Math.round((new Date(new Date().toLocaleDateString("fr-CA")) - new Date(g.derniere)) / 864e5);
    der = "dernière séance " + (j <= 0 ? "aujourd’hui" : j === 1 ? "hier" : "il y a " + j + " jours");

/* ── Lune ── */
function lune(t){
  const ref = Date.UTC(2000, 0, 6, 18, 14), cycle = 29.530588853 * 864e5;
  const p = (((t - ref) / cycle) % 1 + 1) % 1, illum = (1 - Math.cos(2 * Math.PI * p)) / 2;
  const noms = ["Nouvelle lune", "Premier croissant", "Premier quartier", "Gibbeuse croissante", "Pleine lune", "Gibbeuse décroissante", "Dernier quartier", "Dernier croissant"];
  return { p, illum, nom: noms[Math.floor(p * 8 + .5) % 8] };
}
function majLune(){
  const L = lune(Date.now()), r = 36, c = 40, rx = Math.abs(Math.cos(2 * Math.PI * L.p)) * r;
  const croit = L.p < .5, limbe = croit ? 1 : 0, term = croit ? (L.p < .25 ? 0 : 1) : (L.p < .75 ? 0 : 1);
  $("moonlit").setAttribute("d", `M ${c} ${c - r} A ${r} ${r} 0 0 ${limbe} ${c} ${c + r} A ${rx.toFixed(2)} ${r} 0 0 ${term} ${c} ${c - r} Z`);
  $("moonname").textContent = L.nom; $("moonpct").textContent = Math.round(L.illum * 100) + " % éclairée";
}
majLune(); setInterval(majLune, 3600000);

async function chargerVideo(){
  const it = sp && sp.item; if (!it) return;
  if (ytPour === it.id && ytp){ syncVideo(true); return; }
  ytPour = it.id; ytIds = []; ytIdx = 0;

function lancerVideo(){

    events: { onReady: e => { e.target.mute(); e.target.playVideo(); $("pmsg").textContent = ""; },
              onError: () => { ytIdx++; if (ytIdx < ytIds.length) lancerVideo(); else videoIndisponible(); } } });

function syncVideo(force){
  if (!ytp || !ytp.getCurrentTime || spMode !== "video") return;

    if (sp && sp.is_playing) ytp.playVideo(); else ytp.pauseVideo();
  } catch(_){}
}

/* ── Paroles synchronisées (LRCLIB, via le Worker) ── */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let lyr = { cle: "", lignes: [], sync: false, idx: -1 };
function parseLrc(s){
  return s.split("\n").map(l => { const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/); return m ? { t: (+m[1]) * 60 + parseFloat(m[2]), texte: m[3] } : null; }).filter(x => x && x.texte.trim() !== "");
}
function dessinerParoles(){
  $("lyr").innerHTML = lyr.lignes.map((l, i) => `<div class="ll${lyr.sync ? "" : " pl"}">${esc(l.texte)}</div>`).join("");
  lyr.idx = -1; majParoles();
}
async function chargerParoles(){
  const it = sp && sp.item; if (!it || !WK) return;
  if (lyr.cle === it.id) return;
  lyr = { cle: it.id, lignes: [], sync: false, idx: -1 };
  $("lyr").innerHTML = '<div class="lmsg">Recherche des paroles…</div>';
  try {
    const q = new URLSearchParams({ artist: it.artists[0].name, track: it.name, dur: Math.round(it.duration_ms / 1000) });
    const r = await (await fetch(WK + "/paroles?" + q)).json();
    if (lyr.cle !== it.id) return;
    if (r.synced){ lyr.sync = true; lyr.lignes = parseLrc(r.synced); dessinerParoles(); }
    else if (r.plain){ lyr.lignes = r.plain.split("\n").filter(t => t.trim()).map(t => ({ t: -1, texte: t })); dessinerParoles(); }
    else $("lyr").innerHTML = '<div class="lmsg">' + (r.instrumental ? "Morceau instrumental" : "Pas de paroles trouvées pour ce titre") + '</div>';
  } catch(e){ $("lyr").innerHTML = '<div class="lmsg">Paroles indisponibles</div>'; }
}
function majParoles(){
  if (!lyr.sync || !lyr.lignes.length) return;
  const pos = positionSpotify() / 1000; let i = -1;
  for (let k = 0; k < lyr.lignes.length; k++){ if (lyr.lignes[k].t <= pos) i = k; else break; }
  if (i === lyr.idx) return;
  lyr.idx = i;
  const zone = $("lyr"), lignes = zone.children;
  for (let k = 0; k < lignes.length; k++) lignes[k].className = "ll" + (k === i ? " cur" : k < i ? " past" : "");
  if (i >= 0 && lignes[i]) zone.scrollTo({ top: Math.max(0, lignes[i].offsetTop - zone.clientHeight / 2 + lignes[i].offsetHeight / 2), behavior: "smooth" });
}

function etatBambu(d){ const st = d && d.state ? String(d.state).toUpperCase() : ""; return { st, actif: ["RUNNING", "PREPARE", "PAUSE"].includes(st) && typeof d.progress === "number", fini: st === "FINISH" }; }
function boutonMinuteur(){
  const b = $("bbTimer"), { actif, fini } = etatBambu(bbDernier);
  if (minuteur){
    b.hidden = false; b.classList.add("on");
    b.innerHTML = armeAnnul ? "<small>Annuler ?</small><b>Appuie encore</b>" : "<small>Sonne dans</small><b>" + fmtReste(minuteur.fin - Date.now()) + "</b>";
    return;
  }
  b.classList.remove("on");
  if (actif){ b.hidden = false; b.innerHTML = "<small>Minuteur</small><b>Fin + " + REFROID + " min</b>"; }
  else if (fini){ b.hidden = false; b.innerHTML = "<small>Minuteur</small><b>" + REFROID + " min</b>"; }
  else b.hidden = true;
}
function majMinuteur(d){
  bbDernier = d; const { st, actif } = etatBambu(d);
  if (!minuteur && actif){ minuteur = { fin: Date.now() + ((d.remaining_min || 0) + REFROID) * 60000, suivi: true, termine: 0 }; sauveMinuteur(); }
  if (minuteur && minuteur.suivi){
    if (actif){ minuteur.fin = Date.now() + ((d.remaining_min || 0) + REFROID) * 60000; sauveMinuteur(); }
    else if (["FINISH", "FAILED", "IDLE"].includes(st)){ minuteur.termine = Date.now(); minuteur.fin = Date.now() + REFROID * 60000; minuteur.suivi = false; sauveMinuteur(); }
  }
  boutonMinuteur();
}
function deverrouillerSon(){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch(_){} }
function bip(n){
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  for (let i = 0; i < n; i++){
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + i * .3;
    o.type = "sine"; o.frequency.value = 880; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.4, t + .02); g.gain.linearRampToValueAtTime(0, t + .22);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + .25);
  }
}
function sonner(){
  $("alarme").classList.add("on"); deverrouillerSon(); bip(3);
  let n = 0; alarmeTimer = setInterval(() => { bip(3); if (++n > 50) arreterAlarme(); }, 1500);
}
function arreterAlarme(){ clearInterval(alarmeTimer); $("alarme").classList.remove("on"); minuteur = null; sauveMinuteur(); boutonMinuteur(); }
$("alarme").onclick = arreterAlarme;
$("bbTimer").onclick = () => {
  if (minuteur){
    if (armeAnnul){ clearTimeout(armeAnnul); armeAnnul = 0; minuteur = null; sauveMinuteur(); }
    else armeAnnul = setTimeout(() => { armeAnnul = 0; boutonMinuteur(); }, 3000);
    boutonMinuteur(); return;
  }
  const { actif, fini } = etatBambu(bbDernier); if (!actif && !fini) return;
  deverrouillerSon();
  minuteur = { fin: Date.now() + ((actif ? (bbDernier.remaining_min || 0) : 0) + REFROID) * 60000, suivi: actif, termine: fini ? Date.now() : 0 };
  sauveMinuteur(); bip(1); boutonMinuteur();
};
setInterval(() => { if (!minuteur) return; if (Date.now() >= minuteur.fin && !$("alarme").classList.contains("on")) sonner(); else boutonMinuteur(); }, 1000);
boutonMinuteur();

/* ── Forme : anneaux d’activité + pas + eau (Raccourci iPhone → Worker) ── */
const fmtN = (n, d = 0) => Number(n).toLocaleString("fr-FR", { maximumFractionDigits: d });
function anneau(id, p){ const c = $(id), v = Math.max(0, Math.min(1, p)); c.style.strokeDasharray = (v * 100) + " 100"; c.style.opacity = v > .003 ? 1 : 0; }
const PIED = '<svg viewBox="0 0 24 28"><ellipse cx="12" cy="19" rx="6.2" ry="8"/><circle cx="6" cy="8.5" r="2.2"/><circle cx="10.8" cy="5.6" r="2.4"/><circle cx="15.8" cy="6.4" r="2.1"/><circle cx="19.8" cy="10" r="1.7"/></svg>';
const GOURDE = '<svg viewBox="0 0 20 40"><rect x="7" y="1" width="6" height="4" rx="1.2"/><path d="M7 6h6v3l1.5 2.5A3 3 0 0 1 17 14v21a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V14a3 3 0 0 1 2.5-3L7 9z"/></svg>';
function icones(el, valeur, objectif, n, svg, vertical){
  const par = objectif / n;
  el.innerHTML = Array.from({ length: n }, (_, i) => {
    const p = Math.max(0, Math.min(1, (valeur - i * par) / par)) * 100;
    return `<span class="ic${vertical ? " v" : ""}"><span class="ib">${svg}</span><span class="if" style="${vertical ? "height" : "width"}:${p}%">${svg}</span></span>`;
  }).join("");
}
function renderSante(s){
  if (!s || !s.aujourdhui) return;
  const a = s.aujourdhui, o = s.objectifs;
  anneau("rK", a.kcal / o.kcal); anneau("rM", a.minutes / o.minutes); anneau("rS", a.debout / o.debout);
  $("swPas").textContent = fmtN(a.pas); $("swEau").textContent = fmtN(a.eau / 1000, 1) + " L";
  icones($("icPas"), a.pas, o.pas, Math.max(1, Math.round(o.pas / 1000)), PIED, false);
  icones($("icEau"), a.eau, o.eau, Math.max(1, Math.round(o.eau / 500)), GOURDE, true);
}
async function loadSante(){ if (!WK) return; try { renderSante(await (await fetch(WK + "/sante")).json()); } catch(e){} }
loadSante(); setInterval(loadSante, 60000);

/* ═══════════════ MODE TÉLÉ : scène fixe 1920×1080, mise à l'échelle, positions qui ne bougent jamais ═══════════════ */
function allerPage(){}   // pas de pages sur la télé : tout est affiché en même temps
function ajuster(){
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $("stage").style.transform = "translate(" + ((innerWidth - 1920 * s) / 2) + "px," + ((innerHeight - 1080 * s) / 2) + "px) scale(" + s + ")";
}
addEventListener("resize", ajuster); ajuster();

/* Icônes météo dessinées (les émojis couleur ne s'affichent pas sur toutes les télés) */
const NUA = '<circle cx="17" cy="29" r="7.5" fill="#dfe6f0"/><circle cx="27" cy="25" r="9.5" fill="#dfe6f0"/><circle cx="36" cy="31" r="6" fill="#dfe6f0"/><rect x="13" y="29" width="28" height="9" rx="4.5" fill="#dfe6f0"/>';
const SOL = (cx, cy, r) => '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffcc33"/>' + Array.from({ length: 8 }, (_, k) => { const a = k * Math.PI / 4; return '<line x1="' + (cx + Math.cos(a) * (r + 3)).toFixed(1) + '" y1="' + (cy + Math.sin(a) * (r + 3)).toFixed(1) + '" x2="' + (cx + Math.cos(a) * (r + 6.5)).toFixed(1) + '" y2="' + (cy + Math.sin(a) * (r + 6.5)).toFixed(1) + '" stroke="#ffcc33" stroke-width="3" stroke-linecap="round"/>'; }).join("");
const svgW = inner => '<svg class="wi" viewBox="0 0 48 52" aria-hidden="true">' + inner + '</svg>';
const ICONES = {
  sun: svgW(SOL(24, 26, 9)),
  partly: svgW(SOL(17, 17, 7) + NUA),
  cloud: svgW(NUA),
  rain: svgW(NUA + '<g stroke="#5ac8fa" stroke-width="3" stroke-linecap="round"><line x1="19" y1="42" x2="17" y2="48"/><line x1="27" y1="42" x2="25" y2="48"/><line x1="35" y1="42" x2="33" y2="48"/></g>'),
  snow: svgW(NUA + '<g fill="#fff"><circle cx="19" cy="44" r="2.4"/><circle cx="27" cy="47" r="2.4"/><circle cx="35" cy="44" r="2.4"/></g>'),
  storm: svgW(NUA.replace(/#dfe6f0/g, "#aab4c4") + '<polygon points="27,31 19,42 25,42 22,51 33,37 27,37" fill="#ffd60a"/>'),
  fog: svgW('<circle cx="24" cy="26" r="19" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/><g stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="13" y1="21" x2="35" y2="21"/><line x1="11" y1="27" x2="37" y2="27"/><line x1="15" y1="33" x2="33" y2="33"/></g>')
};
const cleIcone = c => c === 0 || c === 1 ? "sun" : c === 2 ? "partly" : c === 3 ? "cloud" : (c === 45 || c === 48) ? "fog" : ((c >= 71 && c <= 77) || c === 85 || c === 86) ? "snow" : c >= 95 ? "storm" : "rain";
Object.keys(WX).forEach(k => { WX[k][0] = ICONES[cleIcone(+k)]; });

/* La page tourne 24 h/24 : elle se recharge toute seule toutes les 6 heures (nouvelle version, mémoire propre) */
var demarre = Date.now();
setInterval(() => { if (Date.now() - demarre > 6 * 36e5) location.reload(); }, 60000);
