<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Dashboard Deniz · Télé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--t2:rgba(255,255,255,.7);--t3:rgba(255,255,255,.45);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;cursor:none}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:24px;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(900px 600px at 8% 4%,rgba(10,132,255,.30),transparent 70%),radial-gradient(800px 560px at 96% 8%,rgba(191,90,242,.22),transparent 70%),radial-gradient(900px 600px at 80% 100%,rgba(48,209,88,.14),transparent 70%),linear-gradient(180deg,#0b0c12,#050507)}
.t{position:absolute;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.14);border-radius:34px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 30px rgba(0,0,0,.35);padding:24px 28px;overflow:hidden}
.t::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,0) 40%);pointer-events:none}
.t>*{position:relative}
.gl{font-size:20px;font-weight:600;color:var(--t2);margin-bottom:8px}
#cache{display:none}

/* Positions fixes (rien ne bouge, rien ne se réorganise) */
#hd{position:absolute;left:64px;top:26px;width:640px}
#weekw{left:720px;top:44px;width:700px;height:204px}
#mw{left:1450px;top:44px;width:406px;height:204px}
#mhour{left:64px;top:272px;width:1030px;height:200px}
#fcw{left:64px;top:492px;width:640px;height:200px}
#spw{left:1126px;top:272px;width:730px;height:480px}
#bb{left:1126px;top:772px;width:730px;height:264px;display:flex;align-items:center}
#gym{left:64px;top:712px;width:1030px;height:324px;padding:0;display:grid;grid-template-columns:240px 300px 1fr;grid-column-gap:20px;align-items:stretch}
/* emplacement libre pour un futur widget : x 724–1094, y 492–692 */

/* Horloge */
#clock{display:flex;align-items:baseline;font-size:150px;font-weight:300;letter-spacing:-.03em;line-height:1}
#clock .dg{display:inline-block;min-width:.58em;text-align:center}
#clock .sep{opacity:.5;margin:0 .03em}
#clock .chg{animation:dgIn .7s var(--ease) both}
#clock .chgH{animation:dgHour 1s var(--ease) both}
#date{font-size:36px;font-weight:500;color:var(--t2);margin-top:6px;text-transform:capitalize}
#hi{font-size:28px;font-weight:600;color:var(--t3);margin-top:6px}
@keyframes dgIn{0%{opacity:0;transform:translateY(.32em)}100%{opacity:1;transform:none}}
@keyframes dgHour{0%{opacity:0;transform:translateY(.5em) scale(.9)}100%{opacity:1;transform:none}}

/* Semaine */
.wk-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.wk-h b{font-size:28px;font-weight:700;letter-spacing:-.02em;text-transform:capitalize}
.wk-h span{font-size:20px;font-weight:600;color:var(--t2)}
#week{display:flex}
#week .wd{flex:1;min-width:0;height:108px;margin-right:8px;border-radius:26px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#week .wd:last-child{margin-right:0}
#week .wd small{font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--t2);margin-bottom:6px}
#week .wd b{font-size:38px;font-weight:600}
#week .wd .dot{width:10px;height:10px;border-radius:50%;background:transparent;margin-top:8px}
#week .wd .dot.on{background:var(--orange);box-shadow:0 0 10px rgba(255,159,10,.8)}
#week .wd.past{opacity:.55}
#week .wd.we small{color:#ff9f6b}
#week .wd.now{background:linear-gradient(160deg,#3d9bff,#0a6cff);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px rgba(10,132,255,.45);opacity:1}
#week .wd.now small{color:rgba(255,255,255,.85)}
#week .wd.now .dot.on{background:#fff;box-shadow:none}

/* Météo */
.mwrow{display:flex;align-items:center}
#wxBigT{font-size:88px;font-weight:300;letter-spacing:-.04em;line-height:1}
.mwtx{margin-left:20px;min-width:0}
#wxBigC{font-size:26px;font-weight:600}
#wxBigV{font-size:20px;color:var(--t3);margin-top:2px}
.sunrow{margin-top:14px;font-size:22px;color:var(--t2)}
.sunrow b{color:#fff;font-weight:600}
#wxh{display:flex}
.hr{flex:1;min-width:0;margin-right:8px;display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.08);border-radius:22px;padding:8px 0}
.hr:last-child{margin-right:0}
.hr span{font-size:20px;color:var(--t2)}
.hr i{font-style:normal;font-size:40px;line-height:1.15}
.hr b{font-size:28px;font-weight:600}
#fc{display:flex}
.fd{flex:1;min-width:0;margin-right:8px;text-align:center;background:rgba(255,255,255,.08);border-radius:22px;padding:8px 0}
.fd:last-child{margin-right:0}
.fd span{display:block;font-size:18px;font-weight:600;letter-spacing:.06em;color:var(--t2)}
.fd.now span{color:var(--blue)}
.fd i{display:block;font-style:normal;font-size:42px;line-height:1.2}
.fd b{font-size:26px;font-weight:600}
.fd small{font-size:22px;color:var(--t2);margin-left:8px}
.wi{display:inline-block;width:1em;height:1em;vertical-align:-.12em}

/* Spotify : pochette, titre et artiste qui défilent, progression, paroles */
.sprow{display:flex;align-items:center}
#sArt{width:200px;height:200px;flex:none;border-radius:24px;background:rgba(255,255,255,.1) center/cover}
.stx{flex:1;min-width:0;margin-left:26px}
.mq{overflow:hidden;white-space:nowrap}
.mq>span{display:inline-block}
#sTitle{font-size:38px;font-weight:700;letter-spacing:-.02em}
#sArtist{font-size:26px;color:var(--t2)}
.mq>span.defile{animation:defile var(--t,6s) linear infinite alternate}
@keyframes defile{0%,14%{transform:translateX(0)}86%,100%{transform:translateX(var(--d))}}
#spw.paused .stx{opacity:.6}
#spw.paused .mq>span{animation-play-state:paused}
.pprog{margin-top:22px}
.pbar2{height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.pbar2 b{display:block;height:100%;width:0;background:#fff;border-radius:4px}
.ptimes{display:flex;justify-content:space-between;font-size:18px;color:var(--t2);margin-top:8px}
#lyrw{position:absolute;left:28px;right:28px;top:262px;bottom:20px;overflow:hidden}
#lyr{height:100%;overflow:hidden}
.ll{font-size:30px;font-weight:700;line-height:1.28;color:rgba(255,255,255,.3);margin-bottom:12px}
.ll.cur{color:#fff}
.ll.past{color:rgba(255,255,255,.48)}
.ll.pl{font-size:26px;font-weight:600;color:rgba(255,255,255,.8)}
.lmsg{font-size:24px;color:var(--t3)}

/* Imprimante : un rond, le pourcentage et le temps au centre, le nom qui défile */
.ringc{position:relative;flex:none;width:200px;height:200px;display:flex;align-items:center;justify-content:center;transition:--p 1s linear}
.ringc::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p,0)*1%),rgba(255,255,255,.16) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 18px),#000 calc(100% - 17.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 18px),#000 calc(100% - 17.5px))}
.rtx{position:relative;text-align:center;line-height:1.1}
#bbPct{display:block;font-size:52px;font-weight:600;letter-spacing:-.02em}
#bbPct.lbl{font-size:26px}
#bbEta{display:block;font-size:24px;color:var(--t2)}
.bbinfo{flex:1;min-width:0;margin-left:34px}
#bbName{font-size:34px;font-weight:600}
#bbTimer{margin-top:14px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:18px;padding:8px 18px;font:inherit;font-size:22px;line-height:1.2}
#bbTimer[hidden]{display:none}
#bbTimer small{font-size:22px;color:var(--t2)}
#bbTimer b{font-weight:600;margin-left:8px}
#alarme{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:200;background:#000;display:none;align-items:center;justify-content:center;text-align:center}
#alarme.on{display:flex}
#alarme b{display:block;font-size:110px;font-weight:300}
#alarme span{display:block;margin-top:20px;font-size:34px;color:var(--t2)}

/* Salle : trois barres qui sortent du sol · jauges en demi-cercle · pas en empreintes · eau en gourdes */
#gymBody{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;padding:24px 0 0 28px;height:100%}
#gym .gt{grid-column:1;grid-row:1;font-size:20px;font-weight:600;color:var(--t2)}
#gym .gn{grid-column:2;grid-row:1;font-size:34px;font-weight:600;padding-right:6px}
#gym .gbar{grid-column:1/3;grid-row:2;display:flex;align-items:flex-end;height:220px;margin-top:10px;align-self:end}
#gym .gbar i{flex:1;max-width:62px;margin-right:12px;height:26%;border-radius:14px 14px 0 0;background:rgba(255,255,255,.16);transition:height .9s cubic-bezier(.34,1.35,.64,1),background .6s}
#gym .gbar i.on{height:100%;background:var(--orange)}
#gym .gm,#gym .gs{display:none}
.gauge{align-self:center}
#rings{width:300px;height:162px;display:block}
#rings path{fill:none;stroke-width:16;stroke-linecap:round}
#rings .rt{stroke:rgba(255,255,255,.12)}
#rings .rf{stroke-dasharray:0 100;opacity:0;transition:stroke-dasharray 1s var(--ease),opacity .3s}
.vis{align-self:center;padding-right:26px}
.vrow{display:flex;align-items:center;margin-bottom:24px}
.vrow:last-child{margin-bottom:0}
.vtxt{flex:none;width:150px}
.vtxt b{display:block;font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.vtxt span{font-size:18px;color:var(--t2)}
.icons{display:flex;align-items:flex-end}
.ic{position:relative;flex:none;width:22px;height:26px;margin-right:5px}
.ic.v{width:24px;height:46px;margin-right:9px}
.ic svg{display:block;width:22px;height:26px}
.ic.v svg{width:24px;height:46px}
.ib svg{fill:rgba(255,255,255,.2)}
.if{position:absolute;left:0;top:0;height:100%;overflow:hidden}
.if svg{fill:var(--c)}
.ic.v .if{top:auto;bottom:0;width:100%}
.ic.v .if svg{position:absolute;left:0;bottom:0}
#erreur{position:absolute;left:560px;top:8px;z-index:300;max-width:800px;background:rgba(255,69,58,.92);color:#fff;padding:10px 18px;border-radius:14px;font-size:20px}
@property --p{syntax:"<number>";inherits:true;initial-value:0}
</style>
</head>
<body>
<div id="stage">
  <div id="hd"><div id="clock"></div><div id="date"></div><div id="hi">Bonjour Deniz</div></div>

  <div class="t" id="weekw"><div class="wk-h"><b id="wkMois"></b><span id="wkNum"></span></div><div id="week"></div></div>

  <div class="t" id="mw">
    <div class="mwrow"><div id="wxBigT">--°</div><div class="mwtx"><div id="wxBigC"></div><div id="wxBigV"></div></div></div>
    <div class="sunrow">Lever <b id="sunr">--:--</b> · Coucher <b id="suns">--:--</b></div>
  </div>

  <div class="t" id="mhour"><div class="gl">Heure par heure</div><div id="wxh"></div></div>
  <div class="t" id="fcw"><div class="gl">Prévisions</div><div id="fc"></div></div>

  <div class="t" id="spw">
    <div class="sprow"><div id="sArt"></div>
      <div class="stx"><div class="gl">Spotify</div><div class="mq"><span id="sTitle">Spotify</span></div><div class="mq"><span id="sArtist">Rien en lecture</span></div>
        <div class="pprog"><div class="pbar2"><b id="pFill"></b></div><div class="ptimes"><span id="pCur">0:00</span><span id="pTot">0:00</span></div></div></div></div>
    <div id="lyrw"><div id="lyr"><div class="lmsg">Les paroles apparaîtront ici</div></div></div>
  </div>

  <div class="t" id="bb">
    <div class="ringc" id="bbRing"><div class="rtx"><b id="bbPct">…</b><span id="bbEta"></span></div></div>
    <div class="bbinfo"><div class="gl">Bambu Lab A1</div><div class="mq"><span id="bbName">Connexion…</span></div><button id="bbTimer" hidden></button></div>
  </div>

  <div class="t" id="gym">
    <div id="gymBody"></div>
    <div class="gauge"><svg id="rings" viewBox="0 0 200 108" aria-hidden="true">
      <path class="rt" d="M10 100A90 90 0 0 1 190 100"/><path class="rf" id="rK" pathLength="100" d="M10 100A90 90 0 0 1 190 100" stroke="#ff375f"/>
      <path class="rt" d="M32 100A68 68 0 0 1 168 100"/><path class="rf" id="rM" pathLength="100" d="M32 100A68 68 0 0 1 168 100" stroke="#30d158"/>
      <path class="rt" d="M54 100A46 46 0 0 1 146 100"/><path class="rf" id="rS" pathLength="100" d="M54 100A46 46 0 0 1 146 100" stroke="#64d2ff"/>
    </svg></div>
    <div class="vis">
      <div class="vrow" style="--c:#0a84ff"><div class="vtxt"><b id="swPas">--</b><span>pas</span></div><div class="icons" id="icPas"></div></div>
      <div class="vrow" style="--c:#64d2ff"><div class="vtxt"><b id="swEau">--</b><span>eau bue</span></div><div class="icons" id="icEau"></div></div>
    </div>
  </div>

  <div id="alarme"><div><b>Pièce refroidie</b><span>Tu peux la retirer du plateau</span></div></div>

  <!-- éléments internes (non affichés) dont le script a besoin -->
  <div id="cache">
    <div id="wxT"></div><div id="wx"></div>
    <div id="moonlit"></div><div id="moonname"></div><div id="moonpct"></div>
    <div id="player"><div id="pbg"></div><div id="pcover"></div><div id="pvideo"><div id="ytp"></div></div><div id="pmsg"></div><div id="pdev"></div><div id="pTitle"></div><div id="pArtist"></div><div id="pbar"></div>
      <button id="pPrev"></button><button id="pPlay"></button><button id="pNext"></button><button id="segCover"></button><button id="segVideo"></button></div>
  </div>
</div>
<script>
/* Si une erreur survient, elle s'affiche à l'écran (touche pour fermer) : plus facile à diagnostiquer */
function afficherErreur(m){
  let b = document.getElementById("erreur");
  if (!b){ b = document.createElement("div"); b.id = "erreur"; b.onclick = () => { b.remove(); }; document.body.appendChild(b); }
  b.textContent = "Erreur : " + m + " (touche pour fermer)";
}
addEventListener("error", e => afficherErreur(e.message || "inconnue"));
addEventListener("unhandledrejection", e => afficherErreur((e.reason && e.reason.message) || e.reason || "inconnue"));

/* ═══════════════ CONFIGURATION ═══════════════
   Les intégrations externes (réseau) fonctionnent quand ce fichier est ouvert
   depuis votre propre serveur / appareil. Sans configuration, le mode démo s’affiche.
   Ajoutez #demo à l’adresse pour forcer l’affichage des widgets Bambu et Spotify. */
const CONFIG = {
  prenom: "Deniz",
  meteo: { lat: 45.19, lon: 5.72, ville: "Grenoble" },             // coordonnées (Open-Meteo, sans clé)
  icsWorker: "https://cal-k7x92mqp4v.deniz-walzberg.workers.dev/", // Worker Cloudflare qui lit tes calendriers iCloud
  bambuUrl: "",     // JSON local : {state,progress,remaining_min,nozzle,bed,name} (pont MQTT → HTTP)
  spotifyToken: "", // jeton OAuth Spotify (scope user-read-currently-playing)
  intervalle: { meteo: 600, calendrier: 300, bambu: 10, spotify: 5 } // secondes
};
const DEMO = location.hash.replace("#","") === "demo";
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

/* ── Horloge ── */
var semaineJour = "";
var salleJours = [];
function numSemaine(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7)); const a = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - a) / 864e5 + 1) / 7); }
function majSemaine(d){
  const j = d.toDateString(); if (j === semaineJour) return; semaineJour = j;
  const lundi = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7)), auj0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const NOMS = ["LUN", "MAR", "MER", "JEU", "VEN", "SAM", "DIM"];
  $("wkMois").textContent = d.toLocaleDateString("fr-FR", { month: "long" }) + " " + d.getFullYear();
  $("wkNum").textContent = "Semaine " + numSemaine(d);
  $("week").innerHTML = Array.from({ length: 7 }, (_, i) => {
    const x = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + i), auj = x.toDateString() === j;
    return `<span class="wd${auj ? " now" : ""}${x < auj0 ? " past" : ""}${i > 4 ? " we" : ""}"><small>${NOMS[i]}</small><b>${x.getDate()}</b><i class="dot${salleJours[i] ? " on" : ""}"></i></span>`;
  }).join("");
}
/* ── Horloge : chaque chiffre s’anime quand il change ── */
function tick(){
  const d = new Date(), t = pad(d.getHours()) + ":" + pad(d.getMinutes()), el = $("clock");
  if (!el.querySelector(".sep")) el.innerHTML = [...t].map(c => c === ":" ? '<span class="sep">:</span>' : '<span class="dg"></span>').join("");
  [...el.children].forEach((s, i) => {
    if (s.className === "sep" || s.textContent === t[i]) return;
    const premier = s.textContent === "";
    s.textContent = t[i];
    if (!premier){ s.classList.remove("chg", "chgH"); void s.offsetWidth; s.classList.add(i < 2 ? "chgH" : "chg"); }
  });
  $("date").textContent = d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  majSemaine(d);
}
tick(); setInterval(tick, 1000);


/* ── Salutation (texte uniquement) ── */
function majSalut(){
  const h = new Date().getHours();
  $("hi").textContent = (h >= 5 && h < 18 ? "Bonjour" : h >= 18 && h < 22 ? "Bonsoir" : "Bonne nuit") + " " + CONFIG.prenom;
}
majSalut(); setInterval(majSalut, 60000);

/* ── Salle (séances envoyées par le Raccourci iPhone → Worker) ── */
function renderGym(g){
  if (!g){ $("gymBody").innerHTML = `<span class="gt">Salle</span><span class="gm">Salle non connectée</span>`; return; }
  salleJours = g.jours || []; semaineJour = ""; majSemaine(new Date());
  const reste = g.objectif - g.count, dispo = 6 - g.today + (g.jours[g.today] ? 0 : 1);
  const s = n => n > 1 ? "s" : "";
  const msg = reste <= 0 ? "Objectif atteint"
    : dispo < reste ? "Objectif difficile cette semaine"
    : dispo === reste ? "Chaque jour compte : il faut y aller !"
    : `Plus que ${reste} séance${s(reste)} cette semaine`;
  let der = "aucune séance enregistrée";
  if (g.derniere){
    const j = Math.round((new Date(new Date().toLocaleDateString("fr-CA")) - new Date(g.derniere)) / 864e5);
    der = "dernière séance " + (j <= 0 ? "aujourd’hui" : j === 1 ? "hier" : "il y a " + j + " jours");
  }
  const segs = Array.from({length: g.objectif}, (_, i) => `<i class="${i < g.count ? "on" : ""}"></i>`).join("");
  $("gymBody").innerHTML =
    `<span class="gt">Salle</span><div class="gbar">${segs}</div><span class="gn">${g.count}/${g.objectif}</span>` +
    `<span class="gm">${msg}</span>` +
    `<span class="gs">${g.streak > 0 ? `${g.streak} semaine${s(g.streak)} d’affilée · ` : ""}${der}</span>`;
}
async function loadGym(){
  if (!CONFIG.icsWorker) return renderGym(null);
  try {
    const g = await (await fetch(CONFIG.icsWorker.replace(/\/?$/, "/salle"))).json();
    renderGym(g && typeof g.objectif === "number" && Array.isArray(g.jours) ? g : null);
  } catch(e){ console.warn("Salle indisponible :", e); }
}
renderGym(null); loadGym(); setInterval(loadGym, 60000);

/* ── Lune ── */
function lune(t){
  const ref = Date.UTC(2000, 0, 6, 18, 14), cycle = 29.530588853 * 864e5;
  const p = (((t - ref) / cycle) % 1 + 1) % 1, illum = (1 - Math.cos(2 * Math.PI * p)) / 2;
  const noms = ["Nouvelle lune", "Premier croissant", "Premier quartier", "Gibbeuse croissante", "Pleine lune", "Gibbeuse décroissante", "Dernier quartier", "Dernier croissant"];
  return { p, illum, nom: noms[Math.floor(p * 8 + .5) % 8] };
}
function majLune(){
  const L = lune(Date.now()), r = 36, c = 40, rx = Math.abs(Math.cos(2 * Math.PI * L.p)) * r;
  const croit = L.p < .5, limbe = croit ? 1 : 0, term = croit ? (L.p < .25 ? 0 : 1) : (L.p < .75 ? 0 : 1);
  $("moonlit").setAttribute("d", `M ${c} ${c - r} A ${r} ${r} 0 0 ${limbe} ${c} ${c + r} A ${rx.toFixed(2)} ${r} 0 0 ${term} ${c} ${c - r} Z`);
  $("moonname").textContent = L.nom; $("moonpct").textContent = Math.round(L.illum * 100) + " % éclairée";
}
majLune(); setInterval(majLune, 3600000);

function chargerYT(){

function videoIndisponible(){ $("pmsg").textContent = "Pas de vidéo disponible pour ce titre"; setTimeout(() => { if (spMode === "video") setMode("cover"); }, 2500); }
async function chargerVideo(){
  const it = sp && sp.item; if (!it) return;
  if (ytPour === it.id && ytp){ syncVideo(true); return; }
  ytPour = it.id; ytIds = []; ytIdx = 0;
  $("pmsg").textContent = "Recherche de la vidéo…";

    ytIds = (await (await fetch(WK + "/video?q=" + encodeURIComponent(q))).json()).ids || [];

function lancerVideo(){

    events: { onReady: e => { e.target.mute(); e.target.playVideo(); $("pmsg").textContent = ""; },
              onError: () => { ytIdx++; if (ytIdx < ytIds.length) lancerVideo(); else videoIndisponible(); } } });

}
function syncVideo(force){
  if (!ytp || !ytp.getCurrentTime || spMode !== "video") return;
  try {

    if ((force || Date.now() - spSync > 20000) && Math.abs(ytp.getCurrentTime() - pos) > 4){ ytp.seekTo(pos, true); spSync = Date.now(); }
    if (sp && sp.is_playing) ytp.playVideo(); else ytp.pauseVideo();
  } catch(_){}
}

/* ── Paroles synchronisées (LRCLIB, via le Worker) ── */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let lyr = { cle: "", lignes: [], sync: false, idx: -1 };
function parseLrc(s){
  return s.split("\n").map(l => { const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/); return m ? { t: (+m[1]) * 60 + parseFloat(m[2]), texte: m[3] } : null; }).filter(x => x && x.texte.trim() !== "");
}
function dessinerParoles(){
  $("lyr").innerHTML = lyr.lignes.map((l, i) => `<div class="ll${lyr.sync ? "" : " pl"}">${esc(l.texte)}</div>`).join("");
  lyr.idx = -1; majParoles();
}
async function chargerParoles(){
  const it = sp && sp.item; if (!it || !WK) return;
  if (lyr.cle === it.id) return;
  lyr = { cle: it.id, lignes: [], sync: false, idx: -1 };
  $("lyr").innerHTML = '<div class="lmsg">Recherche des paroles…</div>';
  try {
    const q = new URLSearchParams({ artist: it.artists[0].name, track: it.name, dur: Math.round(it.duration_ms / 1000) });
    const r = await (await fetch(WK + "/paroles?" + q)).json();
    if (lyr.cle !== it.id) return;
    if (r.synced){ lyr.sync = true; lyr.lignes = parseLrc(r.synced); dessinerParoles(); }
    else if (r.plain){ lyr.lignes = r.plain.split("\n").filter(t => t.trim()).map(t => ({ t: -1, texte: t })); dessinerParoles(); }
    else $("lyr").innerHTML = '<div class="lmsg">' + (r.instrumental ? "Morceau instrumental" : "Pas de paroles trouvées pour ce titre") + '</div>';
  } catch(e){ $("lyr").innerHTML = '<div class="lmsg">Paroles indisponibles</div>'; }
}
function majParoles(){
  if (!lyr.sync || !lyr.lignes.length) return;
  const pos = positionSpotify() / 1000; let i = -1;
  for (let k = 0; k < lyr.lignes.length; k++){ if (lyr.lignes[k].t <= pos) i = k; else break; }
  if (i === lyr.idx) return;
  lyr.idx = i;
  const zone = $("lyr"), lignes = zone.children;
  for (let k = 0; k < lignes.length; k++) lignes[k].className = "ll" + (k === i ? " cur" : k < i ? " past" : "");
  if (i >= 0 && lignes[i]) zone.scrollTo({ top: Math.max(0, lignes[i].offsetTop - zone.clientHeight / 2 + lignes[i].offsetHeight / 2), behavior: "smooth" });
}

/* ── Minuteur de refroidissement : fin d’impression + 15 min, avec sonnerie ── */
const REFROID = 15;
var bbDernier = null, minuteur = null, audioCtx = null, alarmeTimer = 0, armeAnnul = 0;
try { minuteur = JSON.parse(localStorage.getItem("minuteurBambu") || "null"); } catch(_){}
const sauveMinuteur = () => { try { minuteur ? localStorage.setItem("minuteurBambu", JSON.stringify(minuteur)) : localStorage.removeItem("minuteurBambu"); } catch(_){} };
const fmtReste = ms => { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + " h " + pad(m) + " min" : m + ":" + pad(s % 60); };
function etatBambu(d){ const st = d && d.state ? String(d.state).toUpperCase() : ""; return { st, actif: ["RUNNING", "PREPARE", "PAUSE"].includes(st) && typeof d.progress === "number", fini: st === "FINISH" }; }
function boutonMinuteur(){
  const b = $("bbTimer"), { actif, fini } = etatBambu(bbDernier);
  if (minuteur){
    b.hidden = false; b.classList.add("on");
    b.innerHTML = armeAnnul ? "<small>Annuler ?</small><b>Appuie encore</b>" : "<small>Sonne dans</small><b>" + fmtReste(minuteur.fin - Date.now()) + "</b>";
    return;
  }
  b.classList.remove("on");
  if (actif){ b.hidden = false; b.innerHTML = "<small>Minuteur</small><b>Fin + " + REFROID + " min</b>"; }
  else if (fini){ b.hidden = false; b.innerHTML = "<small>Minuteur</small><b>" + REFROID + " min</b>"; }
  else b.hidden = true;
}
function majMinuteur(d){
  bbDernier = d; const { st, actif } = etatBambu(d);
  if (!minuteur && actif){ minuteur = { fin: Date.now() + ((d.remaining_min || 0) + REFROID) * 60000, suivi: true, termine: 0 }; sauveMinuteur(); }
  if (minuteur && minuteur.suivi){
    if (actif){ minuteur.fin = Date.now() + ((d.remaining_min || 0) + REFROID) * 60000; sauveMinuteur(); }
    else if (["FINISH", "FAILED", "IDLE"].includes(st)){ minuteur.termine = Date.now(); minuteur.fin = Date.now() + REFROID * 60000; minuteur.suivi = false; sauveMinuteur(); }
  }
  boutonMinuteur();
}
function deverrouillerSon(){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch(_){} }
function bip(n){
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  for (let i = 0; i < n; i++){
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + i * .3;
    o.type = "sine"; o.frequency.value = 880; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.4, t + .02); g.gain.linearRampToValueAtTime(0, t + .22);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + .25);
  }
}
function sonner(){
  $("alarme").classList.add("on"); deverrouillerSon(); bip(3);
  let n = 0; alarmeTimer = setInterval(() => { bip(3); if (++n > 50) arreterAlarme(); }, 1500);
}
function arreterAlarme(){ clearInterval(alarmeTimer); $("alarme").classList.remove("on"); minuteur = null; sauveMinuteur(); boutonMinuteur(); }
$("alarme").onclick = arreterAlarme;
$("bbTimer").onclick = () => {
  if (minuteur){
    if (armeAnnul){ clearTimeout(armeAnnul); armeAnnul = 0; minuteur = null; sauveMinuteur(); }
    else armeAnnul = setTimeout(() => { armeAnnul = 0; boutonMinuteur(); }, 3000);
    boutonMinuteur(); return;
  }
  const { actif, fini } = etatBambu(bbDernier); if (!actif && !fini) return;
  deverrouillerSon();
  minuteur = { fin: Date.now() + ((actif ? (bbDernier.remaining_min || 0) : 0) + REFROID) * 60000, suivi: actif, termine: fini ? Date.now() : 0 };
  sauveMinuteur(); bip(1); boutonMinuteur();
};
setInterval(() => { if (!minuteur) return; if (Date.now() >= minuteur.fin && !$("alarme").classList.contains("on")) sonner(); else boutonMinuteur(); }, 1000);
boutonMinuteur();

/* ── Forme : anneaux d’activité + pas + eau (Raccourci iPhone → Worker) ── */
const fmtN = (n, d = 0) => Number(n).toLocaleString("fr-FR", { maximumFractionDigits: d });
function anneau(id, p){ const c = $(id), v = Math.max(0, Math.min(1, p)); c.style.strokeDasharray = (v * 100) + " 100"; c.style.opacity = v > .003 ? 1 : 0; }
const PIED = '<svg viewBox="0 0 24 28"><ellipse cx="12" cy="19" rx="6.2" ry="8"/><circle cx="6" cy="8.5" r="2.2"/><circle cx="10.8" cy="5.6" r="2.4"/><circle cx="15.8" cy="6.4" r="2.1"/><circle cx="19.8" cy="10" r="1.7"/></svg>';
const GOURDE = '<svg viewBox="0 0 20 40"><rect x="7" y="1" width="6" height="4" rx="1.2"/><path d="M7 6h6v3l1.5 2.5A3 3 0 0 1 17 14v21a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V14a3 3 0 0 1 2.5-3L7 9z"/></svg>';
function icones(el, valeur, objectif, n, svg, vertical){
  const par = objectif / n;
  el.innerHTML = Array.from({ length: n }, (_, i) => {
    const p = Math.max(0, Math.min(1, (valeur - i * par) / par)) * 100;
    return `<span class="ic${vertical ? " v" : ""}"><span class="ib">${svg}</span><span class="if" style="${vertical ? "height" : "width"}:${p}%">${svg}</span></span>`;
  }).join("");
}
function renderSante(s){
  if (!s || !s.aujourdhui) return;
  const a = s.aujourdhui, o = s.objectifs;
  anneau("rK", a.kcal / o.kcal); anneau("rM", a.minutes / o.minutes); anneau("rS", a.debout / o.debout);
  $("swPas").textContent = fmtN(a.pas); $("swEau").textContent = fmtN(a.eau / 1000, 1) + " L";
  icones($("icPas"), a.pas, o.pas, Math.max(1, Math.round(o.pas / 1000)), PIED, false);
  icones($("icEau"), a.eau, o.eau, Math.max(1, Math.round(o.eau / 500)), GOURDE, true);
}
async function loadSante(){ if (!WK) return; try { renderSante(await (await fetch(WK + "/sante")).json()); } catch(e){} }
loadSante(); setInterval(loadSante, 60000);

/* Garde l’écran allumé quand c’est possible */
try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch(_){}

/* ═══════════════ MODE TÉLÉ : scène fixe 1920×1080, mise à l'échelle, positions qui ne bougent jamais ═══════════════ */
function allerPage(){}   // pas de pages sur la télé : tout est affiché en même temps
function ajuster(){
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $("stage").style.transform = "translate(" + ((innerWidth - 1920 * s) / 2) + "px," + ((innerHeight - 1080 * s) / 2) + "px) scale(" + s + ")";
}
addEventListener("resize", ajuster); ajuster();

/* Icônes météo dessinées (les émojis couleur ne s'affichent pas sur toutes les télés) */
const NUA = '<circle cx="17" cy="29" r="7.5" fill="#dfe6f0"/><circle cx="27" cy="25" r="9.5" fill="#dfe6f0"/><circle cx="36" cy="31" r="6" fill="#dfe6f0"/><rect x="13" y="29" width="28" height="9" rx="4.5" fill="#dfe6f0"/>';
const SOL = (cx, cy, r) => '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffcc33"/>' + Array.from({ length: 8 }, (_, k) => { const a = k * Math.PI / 4; return '<line x1="' + (cx + Math.cos(a) * (r + 3)).toFixed(1) + '" y1="' + (cy + Math.sin(a) * (r + 3)).toFixed(1) + '" x2="' + (cx + Math.cos(a) * (r + 6.5)).toFixed(1) + '" y2="' + (cy + Math.sin(a) * (r + 6.5)).toFixed(1) + '" stroke="#ffcc33" stroke-width="3" stroke-linecap="round"/>'; }).join("");
const svgW = inner => '<svg class="wi" viewBox="0 0 48 52" aria-hidden="true">' + inner + '</svg>';
const ICONES = {
  sun: svgW(SOL(24, 26, 9)),
  partly: svgW(SOL(17, 17, 7) + NUA),
  cloud: svgW(NUA),
  rain: svgW(NUA + '<g stroke="#5ac8fa" stroke-width="3" stroke-linecap="round"><line x1="19" y1="42" x2="17" y2="48"/><line x1="27" y1="42" x2="25" y2="48"/><line x1="35" y1="42" x2="33" y2="48"/></g>'),
  snow: svgW(NUA + '<g fill="#fff"><circle cx="19" cy="44" r="2.4"/><circle cx="27" cy="47" r="2.4"/><circle cx="35" cy="44" r="2.4"/></g>'),
  storm: svgW(NUA.replace(/#dfe6f0/g, "#aab4c4") + '<polygon points="27,31 19,42 25,42 22,51 33,37 27,37" fill="#ffd60a"/>'),
  fog: svgW('<circle cx="24" cy="26" r="19" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/><g stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="13" y1="21" x2="35" y2="21"/><line x1="11" y1="27" x2="37" y2="27"/><line x1="15" y1="33" x2="33" y2="33"/></g>')
};
const cleIcone = c => c === 0 || c === 1 ? "sun" : c === 2 ? "partly" : c === 3 ? "cloud" : (c === 45 || c === 48) ? "fog" : ((c >= 71 && c <= 77) || c === 85 || c === 86) ? "snow" : c >= 95 ? "storm" : "rain";
Object.keys(WX).forEach(k => { WX[k][0] = ICONES[cleIcone(+k)]; });

/* La page tourne 24 h/24 : elle se recharge toute seule toutes les 6 heures (nouvelle version, mémoire propre) */
var demarre = Date.now();
setInterval(() => { if (Date.now() - demarre > 6 * 36e5) location.reload(); }, 60000);
