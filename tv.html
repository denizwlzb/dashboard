<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Dashboard Deniz · Télé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--ink:#f1efe8;--dim:rgba(241,239,232,.54);--faint:rgba(241,239,232,.2);--line:rgba(241,239,232,.15);--acc:#2d62ff;--hot:#ff5a1f;--ice:#7ad7ff;
  --disp:"Big Shoulders Display","Bebas Neue",Impact,"Arial Narrow",sans-serif;--txt:"Space Grotesk","Inter",-apple-system,"Segoe UI",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;cursor:none}
body{font-family:var(--txt);color:var(--ink);-webkit-font-smoothing:antialiased;animation:ouverture 1.6s ease both}
@keyframes ouverture{from{opacity:0}to{opacity:1}}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
#stage>*{position:absolute}
.mono{font-family:var(--mono);font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:400;white-space:nowrap}

/* ───── Fond : noir, lueurs qui dérivent, teinte de la pochette, grain de pellicule ───── */
#wall{left:0;top:0;width:1920px;height:1080px;overflow:hidden}
#wall i{position:absolute;display:block;border-radius:50%;will-change:transform}
#wall .b1{left:-420px;top:-380px;width:1500px;height:1300px;background:radial-gradient(closest-side,rgba(45,98,255,.17),rgba(45,98,255,0));animation:d1 96s ease-in-out infinite alternate}
#wall .b2{left:980px;top:420px;width:1400px;height:1100px;background:radial-gradient(closest-side,rgba(20,50,170,.22),rgba(20,50,170,0));animation:d2 124s ease-in-out infinite alternate}
#wall .b3{left:560px;top:-260px;width:1500px;height:900px;background:radial-gradient(closest-side,rgba(241,239,232,.06),rgba(241,239,232,0));animation:d3 150s ease-in-out infinite alternate}
@keyframes d1{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(560px,300px,0) scale(1.3)}}
@keyframes d2{0%{transform:translate3d(0,0,0) scale(1.1)}100%{transform:translate3d(-700px,-260px,0) scale(.85)}}
@keyframes d3{0%{transform:translate3d(0,0,0) scale(.9)}100%{transform:translate3d(-420px,420px,0) scale(1.25)}}
#amb{left:0;top:0;width:1920px;height:1080px;opacity:0;transition:opacity 2s ease;image-rendering:auto}
#grain{left:-160px;top:-160px;width:2240px;height:1400px;opacity:.05;animation:gr 1.2s steps(1,end) infinite}
@keyframes gr{0%{transform:translate(0,0)}20%{transform:translate(-37px,23px)}40%{transform:translate(19px,-41px)}60%{transform:translate(-63px,-12px)}80%{transform:translate(44px,35px)}100%{transform:translate(0,0)}}
#vg{left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse 80% 80% at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.65) 100%)}

/* ───── Quadrillage : traits fins et croix de repérage ───── */
.hl{height:1px;background:var(--line)}
.vl{width:1px;background:var(--line)}
.pl{width:17px;height:17px}
.pl::before,.pl::after{content:"";position:absolute;background:var(--faint)}
.pl::before{left:8px;top:0;width:1px;height:17px}
.pl::after{left:0;top:8px;width:17px;height:1px}

/* ───── Horloge : heures pleines, minutes en contour, règle des secondes ───── */
#hello{left:64px;top:60px}
#dateTxt{left:64px;top:60px;width:656px;text-align:right;color:var(--ink)}
#hh,#mm{left:50px;font-family:var(--disp);font-weight:900;font-size:416px;line-height:.78;letter-spacing:-.01em;white-space:nowrap}
#hh{top:92px;color:var(--ink)}
#mm{top:402px;color:transparent;-webkit-text-stroke:3px var(--ink)}
#hh span,#mm span{display:inline-block}
.roll{animation:roll .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes roll{from{opacity:0;transform:translateY(.1em)}to{opacity:1;transform:none}}
#secs{left:560px;top:724px;width:160px;text-align:right;font-size:26px;letter-spacing:.12em;color:var(--ink)}
#ruler{left:560px;top:96px;width:160px;height:620px}
#ruler i{position:absolute;right:0;height:2px;width:34px;background:rgba(241,239,232,.22)}
#ruler i.m{width:58px;background:rgba(241,239,232,.45)}
#ruler i.past{background:rgba(45,98,255,.4)}
#ruler i.now{width:124px;height:5px;margin-top:-2px;background:var(--acc);box-shadow:0 0 22px rgba(45,98,255,.95)}

/* Semaine façon règle */
#wkLbl{left:64px;top:742px}
#week{left:64px;top:774px;width:656px;height:96px;display:flex}
.wk{flex:1;min-width:0;margin-right:8px;border-top:2px solid var(--faint);padding-top:8px;position:relative}
.wk:last-child{margin-right:0}
.wk small{display:block;font-family:var(--mono);font-size:17px;letter-spacing:.12em;color:var(--dim)}
.wk b{display:block;font-family:var(--disp);font-weight:700;font-size:58px;line-height:1.02}
.wk .dot{position:absolute;right:4px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px rgba(45,98,255,.9)}
.wk.past{opacity:.42}
.wk.now{border-top:6px solid var(--acc);padding-top:4px;opacity:1}
.wk.now b{color:var(--acc)}
.wk.now small{color:var(--ink)}

/* Imprimante : bandeau de progression */
#bbHL{left:64px;top:888px;width:656px}
#bbL{left:64px;top:906px}
#bbE{left:300px;top:906px;width:420px;text-align:right}
#bbE .hot{color:var(--hot);margin-left:14px}
#bbNW{left:64px;top:938px;width:450px;height:54px;overflow:hidden;white-space:nowrap}
#bbN{display:inline-block;font-family:var(--txt);font-weight:600;font-size:38px;line-height:1.35}
#bbP{left:500px;top:920px;width:220px;text-align:right;font-family:var(--disp);font-weight:800;font-size:92px;line-height:1}
#bbP.lbl{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.14em;color:var(--dim);padding-top:34px}
#bbTr{left:64px;top:1010px;width:656px;height:6px;background:var(--faint)}
#bbF{position:absolute;left:0;top:0;height:100%;width:0;background:var(--acc);box-shadow:0 0 16px rgba(45,98,255,.7);transition:width 1s linear}

/* ───── Météo ───── */
#wxLbl{left:784px;top:64px}
#wxT{left:772px;top:90px;font-family:var(--disp);font-weight:800;font-size:238px;line-height:.8;letter-spacing:-.02em;white-space:nowrap}
#wxC{left:784px;top:292px;width:410px;font-weight:500;font-size:37px;line-height:1.15;white-space:nowrap;overflow:hidden}
#wxHL{left:784px;top:342px}
#wxSun{left:784px;top:368px}
#wxHL,#wxSun{font-size:18px;letter-spacing:.1em}
#hrs{left:1232px;top:64px;width:624px;height:320px}
.hi{position:absolute;top:0;width:34px;height:34px;margin-left:-17px}
.wi{display:block;width:100%;height:100%}
#hrs svg.ch{position:absolute;left:0;top:58px;width:624px;height:240px;overflow:visible}

/* ───── Lecture en cours ───── */
#cov{left:784px;top:416px;width:296px;height:296px;background:rgba(241,239,232,.05)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;background:center/cover}
#cov .k{position:absolute;width:26px;height:26px;border:0 solid var(--acc)}
#cov .k1{left:-12px;top:-12px;border-top-width:3px;border-left-width:3px}
#cov .k2{right:-12px;top:-12px;border-top-width:3px;border-right-width:3px}
#cov .k3{left:-12px;bottom:-12px;border-bottom-width:3px;border-left-width:3px}
#cov .k4{right:-12px;bottom:-12px;border-bottom-width:3px;border-right-width:3px}
#pT{left:784px;top:736px;width:296px;height:3px;background:var(--faint)}
#pF{position:absolute;left:0;top:0;height:100%;width:0;background:var(--acc)}
#pC{left:784px;top:748px;font-size:17px}
#pD{left:880px;top:748px;width:200px;text-align:right;font-size:17px}
#npL{left:1124px;top:418px}
#npL i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--acc);margin-right:12px;box-shadow:0 0 14px rgba(45,98,255,.95);animation:batt 1.8s ease-in-out infinite}
@keyframes batt{50%{opacity:.35}}
.paused #npL i{animation:none;background:var(--dim);box-shadow:none}
#tW{left:1124px;top:446px;width:732px;height:104px;overflow:hidden;white-space:nowrap}
#tT{display:inline-block;font-family:var(--disp);font-weight:800;font-size:98px;line-height:1.06;text-transform:uppercase;letter-spacing:-.005em}
#aW{left:1124px;top:552px;width:732px;height:48px;overflow:hidden;white-space:nowrap}
#aT{display:inline-block;font-weight:500;font-size:35px;line-height:1.35;color:var(--dim)}
.defile{animation:defile var(--t,8s) linear infinite alternate}
@keyframes defile{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--d))}}
.paused #tT,.paused #aT{animation-play-state:paused}
#ly1{left:1124px;top:622px;width:732px;height:116px;overflow:hidden;font-weight:600;font-size:50px;line-height:1.14;letter-spacing:-.02em}
#ly2{left:1124px;top:744px;width:732px;height:38px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;font-size:30px;line-height:1.25;color:rgba(241,239,232,.34)}
#ly1.in{animation:sub .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes sub{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#lyS{left:1124px;top:626px}

/* ───── Salle : trois barres qui sortent du sol ───── */
#gLbl{left:784px;top:818px}
#gymN{left:776px;top:846px;font-family:var(--disp);font-weight:800;font-size:170px;line-height:.8;letter-spacing:-.02em;white-space:nowrap}
#gymB{left:1060px;top:830px;width:330px;height:186px;display:flex;align-items:flex-end}
#gymB i{display:block;width:96px;margin-right:21px;height:18%;background:rgba(241,239,232,.14);transition:height 1.2s cubic-bezier(.2,1.3,.4,1),background .6s}
#gymB i.on{height:100%;background:var(--acc);box-shadow:0 0 40px rgba(45,98,255,.6)}
#gymM{left:1438px;top:834px;width:418px}
#gymM div{margin-bottom:16px;white-space:normal}
#gymM .a1{font-family:var(--txt);font-weight:600;font-size:36px;line-height:1.15;color:var(--ink);text-transform:none;letter-spacing:-.015em}
#gymM .mono{font-size:19px;line-height:1.5}

/* ───── Alarme de refroidissement ───── */
#alarme{left:0;top:0;width:1920px;height:1080px;z-index:50;background:#000;display:none;align-items:center;justify-content:center;text-align:center}
#alarme.on{display:flex}
#alarme b{display:block;font-family:var(--disp);font-weight:900;font-size:330px;line-height:.85;color:var(--acc);animation:batt 1.4s ease-in-out infinite;text-transform:uppercase}
#alarme span{display:block;margin-top:30px}
#erreur{position:absolute;left:560px;top:8px;z-index:60;max-width:800px;background:var(--hot);color:#000;padding:10px 18px;font-family:var(--mono);font-size:18px}
</style>
</head>
<body>
<div id="stage">
  <div id="wall"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
  <canvas id="amb" width="32" height="18"></canvas>
  <div id="grain"></div>
  <div id="vg"></div>
  <canvas id="gr" width="160" height="160" style="display:none"></canvas>

  <!-- quadrillage -->
  <div class="vl" style="left:752px;top:64px;height:952px"></div>
  <div class="hl" style="left:784px;top:400px;width:1072px"></div>
  <div class="hl" style="left:784px;top:792px;width:1072px"></div>
  <div class="vl" style="left:1208px;top:84px;height:292px"></div>
  <div class="pl" style="left:744px;top:392px"></div><div class="pl" style="left:744px;top:784px"></div><div class="pl" style="left:1848px;top:392px"></div><div class="pl" style="left:1848px;top:784px"></div>

  <!-- gauche : heure -->
  <div id="hello" class="mono">Bonjour, Deniz</div><div id="dateTxt" class="mono"></div>
  <div id="hh"></div><div id="mm"></div><div id="ruler"></div><div id="secs" class="mono"></div>
  <div id="wkLbl" class="mono"></div><div id="week"></div>

  <!-- gauche : imprimante -->
  <div id="bbHL" class="hl"></div>
  <div id="bbL" class="mono">Bambu A1</div><div id="bbE" class="mono"><span id="bbE1"></span><span id="bbT" class="hot"></span></div>
  <div id="bbNW"><span id="bbN">Connexion…</span></div><div id="bbP" class="lbl">…</div>
  <div id="bbTr"><div id="bbF"></div></div>

  <!-- droite : météo -->
  <div id="wxLbl" class="mono"></div><div id="wxT">--°</div><div id="wxC"></div>
  <div id="wxHL" class="mono"></div><div id="wxSun" class="mono"></div>
  <div id="hrs"></div>

  <!-- droite : lecture en cours -->
  <div id="cov"><div id="cv"></div><i class="k k1"></i><i class="k k2"></i><i class="k k3"></i><i class="k k4"></i></div>
  <div id="pT"><div id="pF"></div></div><div id="pC" class="mono">0:00</div><div id="pD" class="mono">0:00</div>
  <div id="npL" class="mono"><i></i><span id="npDev">Rien en lecture</span></div>
  <div id="tW"><span id="tT">Rien en lecture</span></div>
  <div id="aW"><span id="aT"></span></div>
  <div id="ly1"></div><div id="ly2"></div><div id="lyS" class="mono"></div>

  <!-- droite : salle -->
  <div class="hl" style="left:784px;top:1016px;width:1072px"></div>
  <div id="gLbl" class="mono">Salle</div><div id="gymN">-/-</div><div id="gymB"></div><div id="gymM"></div>

  <div id="alarme"><div><b>Pièce<br>refroidie</b><span class="mono">Tu peux la retirer du plateau</span></div></div>
</div>
<script>
function afficherErreur(m){ let b = document.getElementById("erreur"); if (!b){ b = document.createElement("div"); b.id = "erreur"; b.onclick = () => { b.remove(); }; document.body.appendChild(b); } b.textContent = "Erreur : " + m; }
addEventListener("error", e => afficherErreur(e.message || "inconnue"));
addEventListener("unhandledrejection", e => afficherErreur((e.reason && e.reason.message) || e.reason || "inconnue"));

const CFG = { lat: 45.19, lon: 5.72, ville: "Grenoble", wk: "https://cal-k7x92mqp4v.deniz-walzberg.workers.dev" };
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const fmtN = (n, d = 0) => Number(n).toLocaleString("fr-FR", { maximumFractionDigits: d });
const fmtT = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + pad(s % 60); };
const fmtReste = ms => { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + "H" + pad(m) : m + ":" + pad(s % 60); };

/* Scène fixe 1920×1080, mise à l'échelle : les positions ne bougent jamais */
function ajuster(){ const s = Math.min(innerWidth / 1920, innerHeight / 1080); $("stage").style.transform = "translate(" + ((innerWidth - 1920 * s) / 2) + "px," + ((innerHeight - 1080 * s) / 2) + "px) scale(" + s + ")"; }
addEventListener("resize", ajuster); ajuster();

/* Grain de pellicule (généré une fois, puis déplacé par saccades) */
(function(){ try {
  const c = $("gr"), x = c.getContext("2d"), im = x.createImageData(160, 160), d = im.data;
  for (let i = 0; i < d.length; i += 4){ const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  x.putImageData(im, 0, 0); $("grain").style.backgroundImage = "url(" + c.toDataURL("image/png") + ")";
} catch(_){} })();

/* Texte qui défile quand il est trop long */
function marquee(el){
  const c = el.parentNode; if (!c) return;
  el.classList.remove("defile");
  const trop = el.scrollWidth - c.clientWidth;
  if (trop > 2){ el.style.setProperty("--d", -trop + "px"); el.style.setProperty("--t", (trop / 40 + 4).toFixed(1) + "s"); void el.offsetWidth; el.classList.add("defile"); }
}
function texteDefilant(id, txt){ const el = $(id); if (el.dataset.t === txt) return; el.textContent = txt; el.dataset.t = txt; marquee(el); }

/* ───── Horloge ───── */
const JOURS = ["DIM.", "LUN.", "MAR.", "MER.", "JEU.", "VEN.", "SAM."], MOIS = ["JANV.", "FÉVR.", "MARS", "AVR.", "MAI", "JUIN", "JUIL.", "AOÛT", "SEPT.", "OCT.", "NOV.", "DÉC."];
const MOIS_L = ["JANVIER", "FÉVRIER", "MARS", "AVRIL", "MAI", "JUIN", "JUILLET", "AOÛT", "SEPTEMBRE", "OCTOBRE", "NOVEMBRE", "DÉCEMBRE"];
function numSemaine(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7)); const a = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - a) / 864e5 + 1) / 7); }
$("ruler").innerHTML = Array.from({ length: 60 }, (_, k) => '<i style="top:' + (k * 10.3).toFixed(1) + 'px"></i>').join("");
function chiffres(id, txt){
  const el = $(id); if (!el.children.length) el.innerHTML = "<span></span><span></span>";
  [...txt].forEach((c, i) => { const s = el.children[i]; if (s.textContent === c) return; const premier = s.textContent === ""; s.textContent = c; if (!premier){ s.classList.remove("roll"); void s.offsetWidth; s.classList.add("roll"); } });
}
var semaineJour = "", salleJours = [];
function majSemaine(d){
  const j = d.toDateString(); if (j === semaineJour) return; semaineJour = j;
  const lundi = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7)), auj0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const N = ["LUN", "MAR", "MER", "JEU", "VEN", "SAM", "DIM"];
  $("wkLbl").textContent = "Semaine " + numSemaine(d) + " — " + MOIS_L[d.getMonth()];
  $("week").innerHTML = Array.from({ length: 7 }, (_, i) => {
    const x = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + i);
    return '<div class="wk' + (x.toDateString() === j ? " now" : "") + (x < auj0 ? " past" : "") + '"><small>' + N[i] + '</small><b>' + x.getDate() + '</b>' + (salleJours[i] ? '<i class="dot"></i>' : "") + '</div>';
  }).join("");
}
function tick(){
  const d = new Date(), s = d.getSeconds();
  chiffres("hh", pad(d.getHours())); chiffres("mm", pad(d.getMinutes()));
  $("secs").textContent = ":" + pad(s);
  const t = $("ruler").children; for (let k = 0; k < 60; k++) t[k].className = (k % 5 === 0 ? "m " : "") + (k === s ? "now" : k < s ? "past" : "");
  $("dateTxt").textContent = JOURS[d.getDay()] + " " + d.getDate() + " " + MOIS[d.getMonth()] + " · SEM. " + numSemaine(d);
  majSemaine(d);
}
tick(); setInterval(tick, 1000);

/* ───── Météo ───── */
const WXL = { 0: "Ensoleillé", 1: "Plutôt dégagé", 2: "Partiellement nuageux", 3: "Couvert", 45: "Brouillard", 48: "Brouillard", 51: "Bruine", 53: "Bruine", 55: "Bruine", 61: "Pluie", 63: "Pluie", 65: "Forte pluie", 71: "Neige", 73: "Neige", 75: "Forte neige", 80: "Averses", 81: "Averses", 82: "Fortes averses", 95: "Orage", 96: "Orage", 99: "Orage" };
const NUA = '<circle cx="17" cy="29" r="7.5" fill="#f1efe8"/><circle cx="27" cy="25" r="9.5" fill="#f1efe8"/><circle cx="36" cy="31" r="6" fill="#f1efe8"/><rect x="13" y="29" width="28" height="9" rx="4.5" fill="#f1efe8"/>';
const SOL = (cx, cy, r) => '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffc83d"/>' + Array.from({ length: 8 }, (_, k) => { const a = k * Math.PI / 4; return '<line x1="' + (cx + Math.cos(a) * (r + 3)).toFixed(1) + '" y1="' + (cy + Math.sin(a) * (r + 3)).toFixed(1) + '" x2="' + (cx + Math.cos(a) * (r + 6.5)).toFixed(1) + '" y2="' + (cy + Math.sin(a) * (r + 6.5)).toFixed(1) + '" stroke="#ffc83d" stroke-width="3" stroke-linecap="round"/>'; }).join("");
const svgW = inner => '<svg class="wi" viewBox="0 0 48 52" aria-hidden="true">' + inner + '</svg>';
const ICONES = {
  sun: svgW(SOL(24, 26, 9)), partly: svgW(SOL(17, 17, 7) + NUA), cloud: svgW(NUA),
  rain: svgW(NUA + '<g stroke="#7ad7ff" stroke-width="3" stroke-linecap="round"><line x1="19" y1="42" x2="17" y2="48"/><line x1="27" y1="42" x2="25" y2="48"/><line x1="35" y1="42" x2="33" y2="48"/></g>'),
  snow: svgW(NUA + '<g fill="#f1efe8"><circle cx="19" cy="44" r="2.4"/><circle cx="27" cy="47" r="2.4"/><circle cx="35" cy="44" r="2.4"/></g>'),
  storm: svgW(NUA.replace(/#f1efe8/g, "#9a978f") + '<polygon points="27,31 19,42 25,42 22,51 33,37 27,37" fill="#ff5a1f"/>'),
  fog: svgW('<g stroke="#f1efe8" stroke-width="3.5" stroke-linecap="round"><line x1="10" y1="20" x2="38" y2="20"/><line x1="8" y1="28" x2="40" y2="28"/><line x1="12" y1="36" x2="36" y2="36"/></g>')
};
const cleIcone = c => c === 0 || c === 1 ? "sun" : c === 2 ? "partly" : c === 3 ? "cloud" : (c === 45 || c === 48) ? "fog" : ((c >= 71 && c <= 77) || c === 85 || c === 86) ? "snow" : c >= 95 ? "storm" : "rain";
const icone = c => ICONES[cleIcone(+c)];
function courbe(vals, W, H){
  const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), ec = Math.max(1, mx - mn);
  const pts = vals.map((v, i) => [i * (W / (vals.length - 1)), 28 + (H - 56) * (1 - (v - mn) / ec)]);
  let d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += " C" + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + " " + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + "," + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + " " + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + "," + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
  }
  return { d, pts };
}
function renderWx(r){
  const c = r.current.weather_code, t = Math.round(r.current.temperature_2m);
  $("wxLbl").textContent = CFG.ville + " · maintenant";
  $("wxT").textContent = t + "°"; $("wxC").textContent = WXL[c] || "—";
  const h = r.hourly, now = new Date();
  const cle = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + "T" + pad(now.getHours()) + ":00";
  let i = h.time.indexOf(cle); if (i < 0) i = 0; i += 1;
  const n = Math.min(12, h.time.length - i);
  if (n >= 3){
    const vals = h.temperature_2m.slice(i, i + n), W = 600, H = 240, cb = courbe(vals, W, H);
    let svg = '<svg class="ch" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d62ff" stop-opacity=".28"/><stop offset="1" stop-color="#2d62ff" stop-opacity="0"/></linearGradient></defs>';
    svg += '<path d="' + cb.d + ' L' + W + ' ' + H + ' L0 ' + H + ' Z" fill="url(#gA)"/><path d="' + cb.d + '" fill="none" stroke="#2d62ff" stroke-width="3.5" stroke-linejoin="round"/>';
    cb.pts.forEach((p, k) => {
      svg += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (k === 0 ? 7 : 4.5) + '" fill="' + (k === 0 ? "#2d62ff" : "#050505") + '" stroke="#2d62ff" stroke-width="2.5"/>';
      if (k % 2 === 0) svg += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] - 16).toFixed(1) + '" fill="#f1efe8" font-family="JetBrains Mono,monospace" font-size="19" font-weight="600" text-anchor="middle">' + Math.round(vals[k]) + '°</text><text x="' + p[0].toFixed(1) + '" y="' + (H + 2) + '" fill="rgba(241,239,232,.5)" font-family="JetBrains Mono,monospace" font-size="15" text-anchor="middle">' + h.time[i + k].slice(11, 13) + 'H</text>';
    });
    svg += '</svg>';
    let ic = ""; cb.pts.forEach((p, k) => { if (k % 3 === 0) ic += '<span class="hi" style="left:' + (p[0] + 0).toFixed(1) + 'px">' + icone(h.weather_code[i + k]) + '</span>'; });
    $("hrs").innerHTML = ic + svg;
  }
  const dj = r.daily;
  if (dj){
    $("wxHL").textContent = "Max " + Math.round(dj.temperature_2m_max[0]) + "°  Min " + Math.round(dj.temperature_2m_min[0]) + "°";
    $("wxSun").textContent = "↑ " + dj.sunrise[0].slice(11, 16) + "  ↓ " + dj.sunset[0].slice(11, 16);
  }
}
async function loadWx(){
  try { renderWx(await (await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + CFG.lat + "&longitude=" + CFG.lon + "&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&forecast_days=5&timezone=auto")).json()); }
  catch(e){ console.warn("Météo indisponible", e); }
}
loadWx(); setInterval(loadWx, 600000);

/* ───── Salle ───── */
function renderGym(g){
  salleJours = g.jours || []; semaineJour = ""; majSemaine(new Date());
  $("gymN").textContent = g.count + "/" + g.objectif;
  $("gymB").innerHTML = Array.from({ length: g.objectif }, (_, i) => '<i class="' + (i < g.count ? "on" : "") + '"></i>').join("");
  const reste = g.objectif - g.count, dispo = 6 - g.today + (g.jours[g.today] ? 0 : 1);
  const msg = reste <= 0 ? "Objectif atteint" : dispo < reste ? "Objectif difficile cette semaine" : dispo === reste ? "Chaque jour compte : il faut y aller" : "Plus que " + reste + " séance" + (reste > 1 ? "s" : "") + " cette semaine";
  let der = "Aucune séance enregistrée";
  if (g.derniere){ const j = Math.round((new Date(new Date().toLocaleDateString("fr-CA")) - new Date(g.derniere)) / 864e5); der = "Dernière séance " + (j <= 0 ? "aujourd’hui" : j === 1 ? "hier" : "il y a " + j + " jours"); }
  $("gymM").innerHTML = '<div class="a1">' + msg + '</div><div class="mono">' + der + '</div>' + (g.streak > 0 ? '<div class="mono">' + g.streak + ' semaine' + (g.streak > 1 ? "s" : "") + ' d’affilée</div>' : "");
}
async function loadGym(){ try { const g = await (await fetch(CFG.wk + "/salle")).json(); if (g && typeof g.objectif === "number" && Array.isArray(g.jours)) renderGym(g); } catch(e){} }
loadGym(); setInterval(loadGym, 120000);

/* ───── Lecture en cours + paroles en sous-titres ───── */
let sp = null, spVu = 0, spBase = null, ambUrl = "";
const positionSpotify = () => spBase ? spBase.ms + (sp && sp.is_playing ? Date.now() - spBase.t : 0) : 0;
const imgDe = it => (it && it.album && it.album.images && it.album.images[0] && it.album.images[0].url) || "";
const musiqueActive = () => !!(sp && sp.item && (sp.is_playing || Date.now() - spVu < 300000));
function ambiance(url){
  if (url === ambUrl) return; ambUrl = url; const c = $("amb");
  if (!url){ c.style.opacity = 0; return; }
  const im = new Image(); im.onload = () => { try { c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); c.style.opacity = ".5"; } catch(_){} }; im.src = url;
}
var lyr = { cle: "", lignes: [], sync: false, idx: -2 };
function parseLrc(s){ return s.split("\n").map(l => { const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/); return m ? { t: (+m[1]) * 60 + parseFloat(m[2]), texte: m[3] } : null; }).filter(x => x && x.texte.trim() !== ""); }
function statutParoles(t){ $("lyS").textContent = t; $("ly1").textContent = ""; $("ly2").textContent = ""; }
async function chargerParoles(){
  const it = sp && sp.item; if (!it) return;
  if (lyr.cle === it.id) return;
  lyr = { cle: it.id, lignes: [], sync: false, idx: -2 }; statutParoles("Recherche des paroles…");
  try {
    const q = new URLSearchParams({ artist: it.artists[0].name, track: it.name, dur: Math.round(it.duration_ms / 1000) });
    const r = await (await fetch(CFG.wk + "/paroles?" + q)).json();
    if (lyr.cle !== it.id) return;
    if (r.synced){ lyr.sync = true; lyr.lignes = parseLrc(r.synced); $("lyS").textContent = ""; majParoles(); }
    else statutParoles(r.instrumental ? "Instrumental" : r.plain ? "Paroles non synchronisées" : "Pas de paroles pour ce titre");
  } catch(e){ statutParoles("Paroles indisponibles"); }
}
function majParoles(){
  if (!lyr.sync || !lyr.lignes.length) return;
  const pos = positionSpotify() / 1000; let i = -1;
  for (let k = 0; k < lyr.lignes.length; k++){ if (lyr.lignes[k].t <= pos) i = k; else break; }
  if (i === lyr.idx) return; lyr.idx = i;
  const a = $("ly1"); a.textContent = i >= 0 ? lyr.lignes[i].texte : "♪"; $("ly2").textContent = lyr.lignes[i + 1] ? lyr.lignes[i + 1].texte : "";
  a.classList.remove("in"); void a.offsetWidth; a.classList.add("in");
}
function majMusique(){
  const m = musiqueActive(), st = $("stage");
  st.classList.toggle("paused", !!(m && !sp.is_playing));
  if (m){
    const u = imgDe(sp.item);
    texteDefilant("tT", sp.item.name); texteDefilant("aT", sp.item.artists.map(a => a.name).join(", "));
    $("cv").style.backgroundImage = u ? "url(" + u + ")" : ""; ambiance(u);
    $("npDev").textContent = (sp.is_playing ? "En lecture" : "En pause") + (sp.device ? " · " + sp.device.name : "");
    chargerParoles();
  } else {
    texteDefilant("tT", "Rien en lecture"); texteDefilant("aT", ""); $("cv").style.backgroundImage = ""; ambiance("");
    $("npDev").textContent = "Rien en lecture"; $("pF").style.width = "0%"; $("pC").textContent = "0:00"; $("pD").textContent = "0:00";
    lyr = { cle: "", lignes: [], sync: false, idx: -2 }; $("ly1").textContent = ""; $("ly2").textContent = ""; $("lyS").textContent = "";
  }
}
function renderSpotify(d){
  if (d && d.item){ sp = d; if (d.is_playing) spVu = Date.now(); spBase = { ms: d.progress_ms || 0, t: Date.now() }; } else sp = null;
  majMusique();
}
async function loadSpotify(){ try { renderSpotify(await (await fetch(CFG.wk + "/spotify")).json()); } catch(e){} }
function tickMusique(){
  if (!musiqueActive()) return;
  const dur = sp.item.duration_ms, cur = Math.min(dur, positionSpotify());
  $("pF").style.width = (dur ? cur / dur * 100 : 0) + "%"; $("pC").textContent = fmtT(cur); $("pD").textContent = fmtT(dur);
  majParoles();
}
loadSpotify(); setInterval(loadSpotify, 3000); setInterval(tickMusique, 500);

/* ───── Imprimante + minuteur de refroidissement (armé tout seul, 15 min après la fin) ───── */
const REFROID = 15;
var bbDernier = null, minuteur = null, alarmeTimer = 0;
try { minuteur = JSON.parse(localStorage.getItem("minuteurBambu") || "null"); } catch(_){}
const sauveMinuteur = () => { try { minuteur ? localStorage.setItem("minuteurBambu", JSON.stringify(minuteur)) : localStorage.removeItem("minuteurBambu"); } catch(_){} };
function etatBambu(d){ const st = d && d.state ? String(d.state).toUpperCase() : ""; return { st, actif: ["RUNNING", "PREPARE", "PAUSE"].includes(st) && typeof d.progress === "number", fini: st === "FINISH" }; }
function texteMinuteur(){ $("bbT").textContent = minuteur ? "Refroid. " + fmtReste(minuteur.fin - Date.now()) : ""; }
function majMinuteur(d){
  bbDernier = d; const { st, actif } = etatBambu(d);
  if (!minuteur && actif){ minuteur = { fin: Date.now() + ((d.remaining_min || 0) + REFROID) * 60000, suivi: true, termine: 0 }; sauveMinuteur(); }
  if (minuteur && minuteur.suivi){
    if (actif){ minuteur.fin = Date.now() + ((d.remaining_min || 0) + REFROID) * 60000; sauveMinuteur(); }
    else if (["FINISH", "FAILED", "IDLE"].includes(st)){ minuteur.termine = Date.now(); minuteur.fin = Date.now() + REFROID * 60000; minuteur.suivi = false; sauveMinuteur(); }
  }
  texteMinuteur();
}
function sonner(){ $("alarme").classList.add("on"); alarmeTimer = setTimeout(arreterAlarme, 120000); }
function arreterAlarme(){ clearTimeout(alarmeTimer); $("alarme").classList.remove("on"); minuteur = null; sauveMinuteur(); texteMinuteur(); }
setInterval(() => { if (!minuteur) return; if (Date.now() >= minuteur.fin && !$("alarme").classList.contains("on")) sonner(); else texteMinuteur(); }, 1000);
function renderBambu(d){
  const { st, actif, fini } = etatBambu(d);
  const libelles = { PREPARE: "Préparation", SLICING: "Préparation", PAUSE: "En pause", FINISH: "Terminée", FAILED: "Échec", IDLE: "Au repos" };
  const joignable = !!d && st !== "" && !["OFFLINE", "ERROR", "AUTH_ERROR"].includes(st);
  const prog = actif ? Math.min(100, Math.max(0, d.progress)) : (joignable && fini ? 100 : 0);
  $("bbF").style.width = prog + "%";
  const P = $("bbP"); P.textContent = actif ? Math.round(prog) + "%" : (joignable ? (libelles[st] || "Au repos") : "Hors ligne"); P.className = actif ? "" : "lbl";
  const m = d && d.remaining_min;
  $("bbE1").textContent = actif ? (m > 0 ? "Reste " + (m >= 60 ? Math.floor(m / 60) + "H" + pad(m % 60) : m + " min") : "Bientôt fini") : "";
  texteDefilant("bbN", joignable ? (d.name || (actif ? "Impression en cours" : "Aucune impression")) : "Imprimante injoignable");
  majMinuteur(d);
}
async function loadBambu(){ try { renderBambu(await (await fetch(CFG.wk + "/bambu")).json()); } catch(e){ renderBambu(null); } }
loadBambu(); setInterval(loadBambu, 10000);

try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch(_){}
/* La page tourne 24 h/24 : elle se recharge toute seule toutes les 6 heures */
var demarre = Date.now();
setInterval(() => { if (Date.now() - demarre > 6 * 36e5) location.reload(); }, 60000);
</script>
