<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dashboard Deniz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{
  --t1:#fff; --t2:rgba(255,255,255,.62); --t3:rgba(255,255,255,.38); --line:rgba(255,255,255,.14);
  --acc:#ff8a1f; --red:#ff8a1f; --orange:#ff8a1f; --green:#ff8a1f;
  --ease:cubic-bezier(.32,.72,0,1);
  --disp:"Cormorant Garamond","Playfair Display",Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:"Jost",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  font-weight:400;font-size:17px;letter-spacing:-.005em;color:var(--t1);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;background:#000}

/* Thème : noir 60 % · blanc 30 % · orange 10 % */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:minmax(0,3fr) minmax(0,2fr) auto;gap:14px;padding:26px 28px}
.widget{background:#000;border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:16px 22px;min-height:0;overflow:hidden;display:flex;flex-direction:column}
h2{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--t2);margin-bottom:12px}

/* Heure + semaine */
#clockw{grid-column:1/7;grid-row:1;justify-content:center;gap:26px;padding:24px 34px}
#clock{display:flex;align-items:baseline;font-size:128px;font-weight:200;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
#clock .dg{display:inline-block;min-width:.58em;text-align:center}
#clock .sep{color:var(--acc);margin:0 .03em;transform:translateY(-.05em)}
#clock .chg{animation:dgIn .7s var(--ease) both}
#clock .chgH{animation:dgHour 1s var(--ease) both}
#date{font-size:14px;font-weight:500;letter-spacing:.16em;color:var(--t2);text-transform:uppercase}
#week{display:flex;gap:12px}
#week .wd{width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;align-content:center;line-height:1}
#week .wd small{font-size:11px;color:var(--t2)}
#week .wd b{font-size:18px;font-weight:500}
#week .wd.now{background:var(--acc);border-color:var(--acc);color:#000}
#week .wd.now small{color:#000}

/* Salutation + météo heure par heure */
#hello{grid-column:7/13;grid-row:1;text-align:right;justify-content:space-between;padding:26px 30px}
#hi{font-size:38px;font-weight:300;letter-spacing:-.01em}
#wx{font-size:19px;font-weight:400;color:var(--t2);margin-top:6px}
#wxh{display:flex;gap:8px;margin-top:auto}
.hr{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px 0}
.hr span{font-size:13px;color:var(--t2)}
.hr i{font-style:normal;font-size:26px;line-height:1.2}
.hr b{font-size:18px;font-weight:500}

/* Prévisions 5 jours + ciel */
#fcw{grid-column:1/6;grid-row:2}
#fc{display:flex;gap:10px;flex:1;min-height:0}
.fd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid rgba(255,255,255,.14);border-radius:16px}
.fd span{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--t2)}
.fd.now span{color:var(--acc)}
.fd i{font-style:normal;font-size:30px;line-height:1.1}
.fd b{font-size:18px;font-weight:500}
.fd small{font-size:14px;color:var(--t2)}
#sky{grid-column:6/9;grid-row:2}
.skyb{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;flex:1;align-content:center}
.sk{display:flex;flex-direction:column;gap:2px}
.sk small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--t2)}
.sk b{font-size:24px;font-weight:300;font-variant-numeric:tabular-nums}
.mn{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.mn svg{width:56px;height:56px;flex:none}
.mn b{display:block;font-size:16px;font-weight:500}
.mn small{font-size:13px;color:var(--t2)}

/* Lecteur Spotify (tuile) + visualiseur de basses */
#spw{grid-column:9/13;grid-row:2;cursor:pointer;gap:10px}
.sprow{display:flex;align-items:center;gap:12px}
#sArt{width:56px;height:56px;border-radius:12px;flex:none;background:rgba(255,255,255,.08) center/cover}
.stx{flex:1;min-width:0}
#sTitle{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sArtist{display:block;font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vizMic{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;display:grid;place-items:center;cursor:pointer;-webkit-appearance:none;appearance:none}
#vizMic svg{width:16px;height:16px;fill:var(--t2)}
#vizMic.on{border-color:var(--acc)}
#vizMic.on svg{fill:var(--acc)}
#viz{width:100%;flex:1;min-height:56px;display:block}
#vizHint{font-size:11px;color:var(--t3);min-height:13px;text-align:center}
#spw.paused .stx{opacity:.6}

/* Salle (tuile fine) */
#gym{grid-column:1/7;grid-row:3;min-height:96px;padding:12px 26px;justify-content:center}
#gymBody{display:flex;align-items:center;gap:14px;width:100%}
#gym .gt{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--t2);white-space:nowrap}
#gym .gbar{display:flex;gap:8px}
#gym .gbar i{width:34px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);transition:background .7s var(--ease)}
#gym .gbar i.on{background:var(--acc)}
#gym .gn{font-size:20px;font-weight:300;font-variant-numeric:tabular-nums}
#gym .gm{font-size:14px;flex:1;min-width:0;line-height:1.2}
#gym .gs{display:none}

/* Imprimante Bambu Lab (tuile fine) */
#bb{grid-column:7/13;grid-row:3;min-height:96px;padding:12px 26px;flex-direction:row;align-items:center;gap:16px}
.ring{position:relative;width:120px;flex:none;display:flex;flex-direction:column;transition:--p 1s linear}
.ring span{order:1;font-size:24px;font-weight:300;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring::before,.ring::after{content:"";height:4px;border-radius:2px}
.ring::before{order:2;background:rgba(255,255,255,.2)}
.ring::after{position:absolute;left:0;bottom:0;width:calc(var(--p,0)*1%);background:var(--acc)}
#bb .info{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
#bb h2{display:none}
#bb .tt{flex:1;min-width:0;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bb .sub{font-size:13px;color:var(--t2);white-space:nowrap}
.temps{display:flex;gap:6px;margin:0}
.temps div{border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:3px 9px;font-size:10px;color:var(--t2)}
.temps b{display:block;font-size:14px;color:var(--t1);font-weight:500}

/* Minuteur de refroidissement (Bambu) */
#bb .info{flex-wrap:wrap;row-gap:6px}
#bb .tt{flex:1 1 100%}
#bbTimer{flex:none;font:inherit;color:var(--t1);background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:8px 14px;text-align:center;cursor:pointer;-webkit-appearance:none;appearance:none;line-height:1.15;min-width:112px}
#bbTimer[hidden]{display:none}
#bbTimer small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--t2)}
#bbTimer b{display:block;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
#bbTimer.on{border-color:var(--acc)}
#bbTimer.on small{color:var(--acc)}
#alarme{position:fixed;inset:0;z-index:200;background:#000;display:none;align-items:center;justify-content:center;text-align:center;cursor:pointer}
#alarme.on{display:flex;animation:alarme 1.2s ease-in-out infinite}
#alarme b{display:block;font-size:56px;font-weight:200;letter-spacing:-.02em}
#alarme span{display:block;margin-top:14px;font-size:18px;color:var(--t2)}
@keyframes alarme{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,138,31,0)}50%{box-shadow:inset 0 0 140px 10px rgba(255,138,31,.35)}}

/* Lecteur Spotify plein écran */
#player{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;
  transform:scale(.28) translateY(-38vh);transform-origin:50% 0;border-radius:60px;overflow:hidden;
  transition:transform .6s cubic-bezier(.32,.72,0,1),opacity .35s ease,border-radius .6s cubic-bezier(.32,.72,0,1)}
#player.open{opacity:1;pointer-events:auto;transform:none;border-radius:0}
#pbg{position:absolute;inset:-80px;background:center/cover;filter:blur(70px) brightness(.22) saturate(0)}
#player:not(.open) #pbg{display:none}
#pclose{position:absolute;top:26px;right:30px;z-index:2;width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:24px;line-height:1;cursor:pointer}
.pmain{position:relative;display:flex;align-items:center;gap:56px;width:100%;max-width:1040px;padding:40px}
.pmedia{position:relative;flex:none;width:440px;height:440px;border-radius:28px;overflow:hidden;background:#111;box-shadow:0 30px 80px rgba(0,0,0,.6);transition:width .5s var(--ease),height .5s var(--ease)}
#player.vid .pmedia{width:560px;height:315px}
#pcover{position:absolute;inset:0;background:center/cover}
#player.vid #pcover{display:none}
#pvideo{position:absolute;inset:0;display:none}
#player.vid #pvideo{display:block}
#pvideo iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#pmsg{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:15px;color:var(--t2)}
.pinfo{flex:1;min-width:0}
.pdev{font-size:16px;color:var(--t2);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.pdev:empty{display:none}
.pdev::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
#pTitle{font-size:38px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
#pArtist{font-size:24px;color:var(--t2);margin-top:6px}
.pprog{margin-top:30px}
.pbar{height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;cursor:pointer}
.pbar b{display:block;height:100%;width:0;background:#fff;border-radius:4px}
.ptimes{display:flex;justify-content:space-between;font-size:14px;color:var(--t2);margin-top:8px;font-variant-numeric:tabular-nums}
.pctl{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:26px}
.pctl button{border:0;background:transparent;color:#fff;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.pctl button svg{width:34px;height:34px;fill:currentColor}
#pPlay{background:#fff!important;color:#000!important;width:88px!important;height:88px!important}
#pPlay svg{width:40px;height:40px}
#pPlay .i-pause{display:none}#pPlay.on .i-play{display:none}#pPlay.on .i-pause{display:block}
.pseg{display:flex;gap:6px;background:rgba(255,255,255,.14);border-radius:99px;padding:5px;width:max-content;margin:28px auto 0}
.pseg button{border:0;background:transparent;color:var(--t2);font:inherit;font-size:16px;font-weight:600;padding:8px 22px;border-radius:99px;cursor:pointer}
.pseg button.on{background:#fff;color:#000}

/* Typographie élégante : Cormorant Garamond (chiffres et titres) + Jost (textes) */
#clock,#hi,.hr b,.fd b,.sk b,.mn b,#gym .gn,.ring span,#week .wd b,#pTitle,#alarme b{font-family:var(--disp);font-feature-settings:"lnum" 1}
#clock{font-size:150px;font-weight:300;letter-spacing:-.02em}
#hi{font-size:46px;font-weight:300;letter-spacing:0}
.hr b{font-size:22px;font-weight:500}
.fd b{font-size:24px;font-weight:500}
.sk b{font-size:30px;font-weight:400}
.mn b{font-size:20px;font-weight:500}
#gym .gn{font-size:26px;font-weight:400}
.ring span{font-size:30px;font-weight:400}
#week .wd b{font-size:20px;font-weight:500}
#pTitle{font-weight:500;letter-spacing:0}
#alarme b{font-weight:300}
h2,#date,.next-label{font-weight:500}

/* Adaptation automatique à la place disponible : tailles liées à la largeur de chaque tuile, rien n'est coupé */
.app{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;grid-template-rows:minmax(min-content,3fr) minmax(min-content,2fr) auto}
.app::-webkit-scrollbar{display:none}
.widget{container-type:inline-size}
.app #clock{font-size:clamp(54px,34cqw,150px)}
.app #date{font-size:clamp(10px,3.2cqw,14px);letter-spacing:.14em}
.app #week{gap:clamp(3px,1.5cqw,12px);width:100%}
.app #week .wd{flex:1;width:auto;height:auto;max-width:50px;aspect-ratio:1}
.app #week .wd small{font-size:clamp(8px,2.4cqw,11px)}
.app #week .wd b{font-size:clamp(12px,4cqw,20px)}
.app #hi{font-size:clamp(24px,9cqw,46px)}
.app #wx{font-size:clamp(13px,3.6cqw,19px)}
.app .hr{min-width:0;padding:clamp(6px,2cqw,10px) 0}
.app .hr span{font-size:clamp(10px,2.6cqw,13px)}
.app .hr i{font-size:clamp(18px,5cqw,26px)}
.app .hr b{font-size:clamp(15px,4.2cqw,22px)}
.app #fc{gap:clamp(4px,1.6cqw,10px)}
.app .fd{min-width:0}
.app .fd span{font-size:clamp(8px,2.6cqw,11px);letter-spacing:.1em}
.app .fd i{font-size:clamp(18px,7cqw,30px)}
.app .fd b{font-size:clamp(15px,5.4cqw,24px)}
.app .fd small{font-size:clamp(11px,3.6cqw,14px)}
.app .sk b{font-size:clamp(20px,9cqw,30px)}
.app .mn svg{width:clamp(40px,12cqw,56px);height:clamp(40px,12cqw,56px)}
.app .mn b{font-size:clamp(15px,5cqw,20px)}
.app .mn small{font-size:clamp(11px,3.4cqw,13px)}
@container (max-width:230px){ .skyb{grid-template-columns:1fr} }
.app #sTitle,.app #sArtist{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.app #sArt{width:clamp(44px,14cqw,56px);height:clamp(44px,14cqw,56px)}
.app .ring{width:clamp(100px,34cqw,150px)}
.app .ring span{font-size:clamp(16px,5.2cqw,30px)}
.app #bb .info{flex-wrap:wrap}
.app #bb .tt{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.app #gym .gn{font-size:clamp(20px,5.4cqw,26px)}
.app #gym .gbar i{width:clamp(22px,7cqw,34px)}
#alarme b{font-size:clamp(34px,8vw,56px)}

/* Largeur moyenne (par exemple écran partagé 2/3) : on réorganise les tuiles */
@media (max-width:999px){
  .app{grid-template-rows:minmax(min-content,1.4fr) minmax(min-content,1fr) minmax(min-content,1.1fr) auto;gap:12px;padding:18px}
  #clockw{grid-column:1/7;grid-row:1} #hello{grid-column:7/13;grid-row:1}
  #fcw{grid-column:1/13;grid-row:2}
  #sky{grid-column:1/6;grid-row:3} #spw{grid-column:6/13;grid-row:3}
  #gym{grid-column:1/7;grid-row:4} #bb{grid-column:7/13;grid-row:4}
  #player{overflow-y:auto}
  .pmain{flex-direction:column;gap:22px;padding:70px 24px 24px;max-height:100%}
  .pmedia{width:min(56vw,320px);height:min(56vw,320px)}
  #player.vid .pmedia{width:min(88vw,520px);height:calc(min(88vw,520px)*9/16)}
  .pinfo{width:100%}
  #pTitle{font-size:28px} #pArtist{font-size:18px}
  .pprog{margin-top:18px} .pctl{margin-top:14px;gap:26px} .pseg{margin-top:14px}
}
/* Petite largeur : tout en une colonne, la page défile */
@media (max-width:639px){
  .app{grid-template-rows:none;grid-auto-rows:auto}
  #clockw,#hello,#fcw,#sky,#spw,#gym,#bb{grid-column:1/13;grid-row:auto}
}

.fog{display:inline-block;width:1em;height:1em;vertical-align:-.12em}
/* Effets occasionnels */
#sweep{position:fixed;top:0;bottom:0;left:0;width:34vw;z-index:2;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
body.fx-sweep #sweep{animation:sweep 2.8s var(--ease)}
body.fx-lift .widget{animation:lift 1.6s var(--ease)}
@keyframes sweep{0%{opacity:0;transform:translateX(-40vw)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(110vw)}}
@keyframes lift{0%,100%{transform:none}40%{transform:translateY(-6px)}}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes eq{0%,100%{height:4px}50%{height:20px}}
@keyframes dgIn{0%{opacity:0;transform:translateY(.32em);filter:blur(6px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes dgHour{0%{opacity:0;transform:translateY(.5em) scale(.9);filter:blur(10px)}100%{opacity:1;transform:none;filter:blur(0)}}
@property --p{syntax:"<number>";inherits:true;initial-value:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="sweep"></div>
<div id="alarme"><div><b id="alarmeTitre">Pièce refroidie</b><span>Appuie pour arrêter</span></div></div>
<div id="player" aria-hidden="true">
  <div id="pbg"></div>
  <button id="pclose" aria-label="Fermer">✕</button>
  <div class="pmain">
    <div class="pmedia"><div id="pcover"></div><div id="pvideo"><div id="ytp"></div></div><div id="pmsg"></div></div>
    <div class="pinfo">
      <div class="pdev" id="pdev"></div>
      <div id="pTitle">—</div><div id="pArtist"></div>
      <div class="pprog"><div class="pbar" id="pbar"><b id="pFill"></b></div><div class="ptimes"><span id="pCur">0:00</span><span id="pTot">0:00</span></div></div>
      <div class="pctl">
        <button id="pPrev" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M18 6l-9 6 9 6zM5 6h2v12H5z"/></svg></button>
        <button id="pPlay" aria-label="Lecture / pause"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
        <button id="pNext" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zM17 6h2v12h-2z"/></svg></button>
      </div>
      <div class="pseg"><button id="segCover" class="on">Pochette</button><button id="segVideo">Vidéo</button></div>
    </div>
  </div>
</div>
<div class="app">
  <div class="widget" id="clockw"><div id="clock"></div><div id="date"></div><div id="week"></div></div>
  <div class="widget" id="hello"><div id="hi">Bonjour Deniz</div><div id="wx"></div><div id="wxh"></div></div>
  <section class="widget" id="fcw"><h2>Prévisions</h2><div id="fc"></div></section>
  <section class="widget" id="sky"><h2>Ciel</h2><div class="skyb">
    <div class="sk"><small>Lever</small><b id="sunr">--:--</b></div>
    <div class="sk"><small>Coucher</small><b id="suns">--:--</b></div>
    <div class="mn"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36" fill="#000" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/><path id="moonlit" fill="#fff"/></svg><div><b id="moonname"></b><small id="moonpct"></small></div></div>
  </div></section>
  <section class="widget" id="spw">
    <div class="sprow"><div id="sArt"></div><div class="stx"><b id="sTitle">Spotify</b><span id="sArtist">Rien en lecture</span></div>

      <div class="ring" id="bbRing"><span id="bbPct">0%</span></div>
      <div class="info">
        <h2 style="margin-bottom:6px">Bambu Lab A1</h2>
        <div class="tt" id="bbName">—</div>
        <div class="sub" id="bbEta">—</div>
        <div class="temps"><div><b id="bbNozzle">—</b>Buse</div><div><b id="bbBed">—</b>Plateau</div></div>
      </div>
    
    <button id="bbTimer" hidden></button>

</div>
<script>
/* ═══════════════ CONFIGURATION ═══════════════
   Les intégrations externes (réseau) fonctionnent quand ce fichier est ouvert
   depuis votre propre serveur / appareil. Sans configuration, le mode démo s’affiche.
   Ajoutez #demo à l’adresse pour forcer l’affichage des widgets Bambu et Spotify. */
const CONFIG = {
  prenom: "Deniz",
  meteo: { lat: 45.19, lon: 5.72, ville: "Grenoble" },             // coordonnées (Open-Meteo, sans clé)
  icsWorker: "https://cal-k7x92mqp4v.deniz-walzberg.workers.dev/", // Worker Cloudflare qui lit tes calendriers iCloud
  bambuUrl: "",     // JSON local : {state,progress,remaining_min,nozzle,bed,name} (pont MQTT → HTTP)
  spotifyToken: "", // jeton OAuth Spotify (scope user-read-currently-playing)
  intervalle: { meteo: 600, calendrier: 300, bambu: 10, spotify: 5 } // secondes
};
const DEMO = location.hash.replace("#","") === "demo";
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

/* ── Horloge ── */
var semaineJour = "";
function majSemaine(d){
  const j = d.toDateString(); if (j === semaineJour) return; semaineJour = j;
  const lundi = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
  $("week").innerHTML = Array.from({ length: 7 }, (_, i) => { const x = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + i);
    return `<span class="wd${x.toDateString() === j ? " now" : ""}"><small>${"LMMJVSD"[i]}</small><b>${x.getDate()}</b></span>`; }).join("");
}
/* ── Horloge : chaque chiffre s’anime quand il change ── */
function tick(){
  const d = new Date(), t = pad(d.getHours()) + ":" + pad(d.getMinutes()), el = $("clock");
  if (!el.querySelector(".sep")) el.innerHTML = [...t].map(c => c === ":" ? '<span class="sep">:</span>' : '<span class="dg"></span>').join("");
  [...el.children].forEach((s, i) => {
    if (s.className === "sep" || s.textContent === t[i]) return;
    const premier = s.textContent === "";
    s.textContent = t[i];
    if (!premier){ s.classList.remove("chg", "chgH"); void s.offsetWidth; s.classList.add(i < 2 ? "chgH" : "chg"); }
  });
  $("date").textContent = d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  majSemaine(d);
}
tick(); setInterval(tick, 1000);

/* Petits effets occasionnels */
const EFFETS = [["sweep", 2800], ["lift", 1700]];
function effetAuHasard(){
  const [nom, ms] = EFFETS[Math.floor(Math.random() * EFFETS.length)];
  document.body.classList.add("fx-" + nom);
  setTimeout(() => document.body.classList.remove("fx-" + nom), ms);
  setTimeout(effetAuHasard, 25000 + Math.random() * 35000);
}
setTimeout(effetAuHasard, 12000);

/* ── Salutation (texte uniquement) ── */
function majSalut(){
  const h = new Date().getHours();
  $("hi").textContent = (h >= 5 && h < 18 ? "Bonjour" : h >= 18 && h < 22 ? "Bonsoir" : "Bonne nuit") + " " + CONFIG.prenom;
}
majSalut(); setInterval(majSalut, 60000);

/* ── Salle (séances envoyées par le Raccourci iPhone → Worker) ── */
function renderGym(g){
  if (!g){ $("gymBody").innerHTML = `<span class="gt">Salle</span><span class="gm">Salle non connectée</span>`; return; }
  const reste = g.objectif - g.count, dispo = 6 - g.today + (g.jours[g.today] ? 0 : 1);
  const s = n => n > 1 ? "s" : "";
  const msg = reste <= 0 ? "Objectif atteint"
    : dispo < reste ? "Objectif difficile cette semaine"
    : dispo === reste ? "Chaque jour compte : il faut y aller !"
    : `Plus que ${reste} séance${s(reste)} cette semaine`;
  let der = "aucune séance enregistrée";
  if (g.derniere){
    const j = Math.round((new Date(new Date().toLocaleDateString("fr-CA")) - new Date(g.derniere)) / 864e5);
    der = "dernière séance " + (j <= 0 ? "aujourd’hui" : j === 1 ? "hier" : "il y a " + j + " jours");
  }
  const segs = Array.from({length: g.objectif}, (_, i) => `<i class="${i < g.count ? "on" : ""}"></i>`).join("");
  $("gymBody").innerHTML =
    `<span class="gt">Salle</span><div class="gbar">${segs}</div><span class="gn">${g.count}/${g.objectif}</span>` +
    `<span class="gm">${msg}</span>` +
    `<span class="gs">${g.streak > 0 ? `${g.streak} semaine${s(g.streak)} d’affilée · ` : ""}${der}</span>`;
}
async function loadGym(){
  if (!CONFIG.icsWorker) return renderGym(null);
  try {
    const g = await (await fetch(CONFIG.icsWorker.replace(/\/?$/, "/salle"))).json();
    renderGym(g && typeof g.objectif === "number" && Array.isArray(g.jours) ? g : null);
  } catch(e){ console.warn("Salle indisponible :", e); }
}
renderGym(null); loadGym(); setInterval(loadGym, 60000);

/* ── Lune ── */
function lune(t){
  const ref = Date.UTC(2000, 0, 6, 18, 14), cycle = 29.530588853 * 864e5;
  const p = (((t - ref) / cycle) % 1 + 1) % 1, illum = (1 - Math.cos(2 * Math.PI * p)) / 2;
  const noms = ["Nouvelle lune", "Premier croissant", "Premier quartier", "Gibbeuse croissante", "Pleine lune", "Gibbeuse décroissante", "Dernier quartier", "Dernier croissant"];
  return { p, illum, nom: noms[Math.floor(p * 8 + .5) % 8] };
}
function majLune(){
  const L = lune(Date.now()), r = 36, c = 40, rx = Math.abs(Math.cos(2 * Math.PI * L.p)) * r;
  const croit = L.p < .5, limbe = croit ? 1 : 0, term = croit ? (L.p < .25 ? 0 : 1) : (L.p < .75 ? 0 : 1);
  $("moonlit").setAttribute("d", `M ${c} ${c - r} A ${r} ${r} 0 0 ${limbe} ${c} ${c + r} A ${rx.toFixed(2)} ${r} 0 0 ${term} ${c} ${c - r} Z`);
  $("moonname").textContent = L.nom; $("moonpct").textContent = Math.round(L.illum * 100) + " % éclairée";
}
majLune(); setInterval(majLune, 3600000);

/* ── Météo ── */
const FOG = '<svg class="fog" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.55)" stroke-width="1.4"/><path d="M8 12.5h16M6.5 17h19M9 21.5h14" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
const WX = {0:["☀️","Ensoleillé"],1:["🌤️","Plutôt dégagé"],2:["⛅","Partiellement nuageux"],3:["☁️","Couvert"],45:[FOG,"Brouillard"],48:[FOG,"Brouillard"],
  51:["🌦️","Bruine"],53:["🌦️","Bruine"],55:["🌦️","Bruine"],61:["🌧️","Pluie"],63:["🌧️","Pluie"],65:["🌧️","Forte pluie"],
  71:["🌨️","Neige"],73:["🌨️","Neige"],75:["❄️","Forte neige"],80:["🌦️","Averses"],81:["🌦️","Averses"],82:["⛈️","Fortes averses"],95:["⛈️","Orage"],96:["⛈️","Orage"],99:["⛈️","Orage"]};
var wxHeures = null;
function rendreHeures(){
  if (!wxHeures) return;
  const { h, i } = wxHeures, w = $("wxh").clientWidth || 480, n = Math.max(3, Math.min(8, Math.floor((w + 8) / 60)));
  $("wxh").innerHTML = Array.from({ length: n }, (_, k) => i + k).filter(k => k < h.time.length).map(k =>
    `<div class="hr"><span>${h.time[k].slice(11, 13)} h</span><i>${(WX[h.weather_code[k]] || ["·"])[0]}</i><b>${Math.round(h.temperature_2m[k])}°</b></div>`).join("");
}
addEventListener("resize", rendreHeures);
function renderWx(r){
  const txt = (WX[r.current.weather_code] || ["", "—"])[1];
  $("wx").textContent = Math.round(r.current.temperature_2m) + "° · " + txt + " · " + CONFIG.meteo.ville;
  const h = r.hourly, now = new Date();
  const cle = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + "T" + pad(now.getHours()) + ":00";
  let i = h.time.indexOf(cle); if (i < 0) i = 0; i += 1;
  wxHeures = { h, i }; rendreHeures();
  const dj = r.daily;
  if (dj){
    $("fc").innerHTML = dj.time.slice(0, 5).map((t, i) => {
      const jour = new Date(t + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "short" }).replace(".", "").toUpperCase();
      return `<div class="fd${i === 0 ? " now" : ""}"><span>${i === 0 ? "AUJ." : jour}</span><i>${(WX[dj.weather_code[i]] || ["·"])[0]}</i><b>${Math.round(dj.temperature_2m_max[i])}°</b><small>${Math.round(dj.temperature_2m_min[i])}°</small></div>`;
    }).join("");
    $("sunr").textContent = dj.sunrise[0].slice(11, 16); $("suns").textContent = dj.sunset[0].slice(11, 16);
  }
}
async function loadWx(){
  try {
    const { lat, lon } = CONFIG.meteo;
    const r = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&forecast_days=5&timezone=auto`)).json();
    renderWx(r);
  } catch(e){ console.warn("Météo indisponible :", e); }
}
loadWx(); setInterval(loadWx, CONFIG.intervalle.meteo*1000);

/* ── Visualiseur : le micro de l’iPad écoute la pièce, les basses font monter la gauche de la barre ── */
const viz = (() => {
  const N = 32, FMIN = 40, FMAX = 12000, lisse = new Float32Array(N);
  let ac = null, an = null, data = null, flux = null, raf = 0, actif = false, joue = false, pic = .25, dernier = 0, ctx2 = null, W = 0, H = 0;
  function bandes(d, fe, fft){
    const out = new Float32Array(N), bin = fe / fft;
    for (let i = 0; i < N; i++){
      const lo = Math.max(1, Math.floor(FMIN * Math.pow(FMAX / FMIN, i / N) / bin)), hi = Math.max(lo + 1, Math.ceil(FMIN * Math.pow(FMAX / FMIN, (i + 1) / N) / bin));
      let m = 0; for (let k = lo; k < hi && k < d.length; k++) if (d[k] > m) m = d[k];
      out[i] = m / 255;
    }
    return out;
  }
  function adoucir(v){
    let max = 0; for (let i = 0; i < N; i++) if (v[i] > max) max = v[i];
    pic = Math.max(pic * .995, max, .25);
    for (let i = 0; i < N; i++){ const x = Math.min(1, v[i] / pic); lisse[i] = x > lisse[i] ? lisse[i] + (x - lisse[i]) * .6 : lisse[i] * .86; }
  }
  function taille(){
    const c = $("viz"), r = c.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height; c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    ctx2 = c.getContext("2d"); ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function dessiner(repos){
    if (!ctx2) taille();
    ctx2.clearRect(0, 0, W, H);
    const gap = 3, w = (W - gap * (N - 1)) / N;
    for (let i = 0; i < N; i++){
      const h = repos ? 3 : Math.max(3, lisse[i] * H);
      ctx2.fillStyle = repos ? "rgba(255,255,255,.22)" : (i < 8 ? "#ff8a1f" : "#fff");
      ctx2.fillRect(i * (w + gap), H - h, w, h);
    }
  }
  function boucle(t){
    raf = 0; if (!actif || !joue) return;
    raf = requestAnimationFrame(boucle);
    if (t - dernier < 33) return; dernier = t;
    an.getByteFrequencyData(data); adoucir(bandes(data, ac.sampleRate, an.fftSize)); dessiner(false);
  }
  function maj(){
    $("vizMic").classList.toggle("on", actif);
    $("vizHint").textContent = joue && !actif ? "Touche le micro pour animer" : "";
    if (actif && joue){ if (!raf) raf = requestAnimationFrame(boucle); }
    else { lisse.fill(0); dessiner(true); }
  }
  async function activer(){
    try {
      flux = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") await ac.resume();
      an = ac.createAnalyser(); an.fftSize = 2048; an.minDecibels = -90; an.maxDecibels = -20; an.smoothingTimeConstant = .5;
      ac.createMediaStreamSource(flux).connect(an); data = new Uint8Array(an.frequencyBinCount); actif = true;
      try { localStorage.setItem("vizMicro", "1"); } catch(_){}
    } catch(e){ $("vizHint").textContent = "Micro refusé ou indisponible"; actif = false; return; }
    maj();
  }
  function desactiver(){
    try { flux && flux.getTracks().forEach(t => t.stop()); ac && ac.close(); } catch(_){}
    flux = ac = an = null; actif = false; try { localStorage.removeItem("vizMicro"); } catch(_){} maj();
  }
  $("vizMic").onclick = e => { e.stopPropagation(); actif ? desactiver() : activer(); };
  addEventListener("resize", () => { taille(); if (!(actif && joue)) dessiner(true); });
  return { jouer(v){ joue = !!v; maj(); }, bandes, adoucir, lisse, N };
})();

/* ── Spotify : tuile + lecteur plein écran (commande tous les appareils : iPhone, Echo…) ── */
const WK = CONFIG.icsWorker ? CONFIG.icsWorker.replace(/\/?$/, "") : "";
let sp = null, spVu = 0, spBase = null, spMode = "cover", spOuvert = false, spTick = 0, spSync = 0;
let ytp = null, ytPour = "", ytIds = [], ytIdx = 0;
const fmtT = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + pad(s % 60); };
const musiqueActive = () => !!(sp && sp.item && (sp.is_playing || Date.now() - spVu < 300000));
const imgDe = it => (it && it.album && it.album.images && it.album.images[0] && it.album.images[0].url) || "";
const positionSpotify = () => spBase ? spBase.ms + (sp && sp.is_playing ? Date.now() - spBase.t : 0) : 0;

function majIle(){
  const m = musiqueActive();
  $("spw").classList.toggle("paused", !!(m && !sp.is_playing));
  if (m){
    $("sTitle").textContent = sp.item.name; $("sArtist").textContent = sp.item.artists.map(a => a.name).join(", ");
    const u = imgDe(sp.item); $("sArt").style.backgroundImage = u ? `url(${u})` : "";
  } else { $("sTitle").textContent = "Spotify"; $("sArtist").textContent = "Rien en lecture"; $("sArt").style.backgroundImage = ""; }
  viz.jouer(m && sp.is_playing);
}
function tickPlayer(){
  if (!sp || !spBase) return;
  const dur = sp.item.duration_ms, cur = Math.min(dur, positionSpotify());
  $("pFill").style.width = (dur ? cur / dur * 100 : 0) + "%"; $("pCur").textContent = fmtT(cur); $("pTot").textContent = fmtT(dur);
}
function majPlayer(){
  if (!sp) return;
  const it = sp.item, u = imgDe(it);
  $("pTitle").textContent = it.name; $("pArtist").textContent = it.artists.map(a => a.name).join(", ");
  $("pcover").style.backgroundImage = u ? `url(${u})` : ""; $("pbg").style.backgroundImage = u ? `url(${u})` : "";
  $("pdev").textContent = sp.device ? "Lecture sur " + sp.device.name : "";
  $("pPlay").classList.toggle("on", !!sp.is_playing);
  tickPlayer();
  if (spMode === "video"){ if (it.id !== ytPour) chargerVideo(); else syncVideo(false); }
}
function renderSpotify(d){
  if (d && d.item){ sp = d; if (d.is_playing) spVu = Date.now(); spBase = { ms: d.progress_ms || 0, t: Date.now() }; }
  else sp = null;
  majIle();
  if (spOuvert){ if (sp) majPlayer(); else fermerPlayer(); }
}
async function loadSpotify(){
  if (DEMO) return renderSpotify({ is_playing: true, progress_ms: 95000, device: { name: "Echo de Deniz" }, item: { id: "demo", name: "Midnight City", artists: [{ name: "M83" }], duration_ms: 243000, album: { images: [] } } });
  if (!WK) return renderSpotify(null);
  try { renderSpotify(await (await fetch(WK + "/spotify")).json()); } catch(e){}
}
function ouvrirPlayer(){ if (!sp) return; spOuvert = true; $("player").classList.add("open"); $("player").setAttribute("aria-hidden", "false"); majPlayer(); loadSpotify(); }
function fermerPlayer(){ spOuvert = false; $("player").classList.remove("open"); $("player").setAttribute("aria-hidden", "true"); try { ytp && ytp.pauseVideo(); } catch(_){} }
function setMode(m){
  spMode = m; $("player").classList.toggle("vid", m === "video");
  $("segCover").classList.toggle("on", m === "cover"); $("segVideo").classList.toggle("on", m === "video");
  if (m === "video") chargerVideo(); else { try { ytp && ytp.pauseVideo(); } catch(_){} $("pmsg").textContent = ""; }
}
function chargerYT(){
  return new Promise(ok => {
    if (window.YT && YT.Player) return ok();
    window.onYouTubeIframeAPIReady = ok;
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
  });
}
function videoIndisponible(){ $("pmsg").textContent = "Pas de vidéo disponible pour ce titre"; setTimeout(() => { if (spMode === "video") setMode("cover"); }, 2500); }
async function chargerVideo(){
  const it = sp && sp.item; if (!it) return;
  if (ytPour === it.id && ytp){ syncVideo(true); return; }
  ytPour = it.id; ytIds = []; ytIdx = 0;
  $("pmsg").textContent = "Recherche de la vidéo…";
  try {
    const q = it.name + " " + it.artists[0].name + " clip officiel";
    ytIds = (await (await fetch(WK + "/video?q=" + encodeURIComponent(q))).json()).ids || [];
    if (!ytIds.length) throw 0;
    await chargerYT(); lancerVideo();
  } catch(e){ videoIndisponible(); }
}
function lancerVideo(){
  const pos = Math.floor(positionSpotify() / 1000);
  if (ytp && ytp.loadVideoById) ytp.loadVideoById({ videoId: ytIds[ytIdx], startSeconds: pos });
  else ytp = new YT.Player("ytp", { videoId: ytIds[ytIdx], playerVars: { autoplay: 1, mute: 1, controls: 0, playsinline: 1, rel: 0, modestbranding: 1, disablekb: 1, iv_load_policy: 3, start: pos },
    events: { onReady: e => { e.target.mute(); e.target.playVideo(); $("pmsg").textContent = ""; },
              onError: () => { ytIdx++; if (ytIdx < ytIds.length) lancerVideo(); else videoIndisponible(); } } });
  spSync = Date.now(); $("pmsg").textContent = "";
}
function syncVideo(force){
  if (!ytp || !ytp.getCurrentTime || spMode !== "video") return;
  try {
    const pos = positionSpotify() / 1000;
    if ((force || Date.now() - spSync > 20000) && Math.abs(ytp.getCurrentTime() - pos) > 4){ ytp.seekTo(pos, true); spSync = Date.now(); }
    if (sp && sp.is_playing) ytp.playVideo(); else ytp.pauseVideo();
  } catch(_){}
}
async function controle(action, extra){
  try { await fetch(WK + "/spotify/control", { method: "POST", body: JSON.stringify(Object.assign({ action }, extra || {})) }); } catch(_){}
  setTimeout(loadSpotify, 700);
}
$("spw").onclick = () => { if (musiqueActive()) ouvrirPlayer(); };
$("pclose").onclick = fermerPlayer;
$("segCover").onclick = () => setMode("cover");
$("segVideo").onclick = () => setMode("video");
$("pPrev").onclick = () => controle("previous");
$("pNext").onclick = () => controle("next");
$("pPlay").onclick = () => {
  if (!sp) return;
  const veut = !sp.is_playing, pos = positionSpotify();
  sp.is_playing = veut; spBase = { ms: pos, t: Date.now() }; if (veut) spVu = Date.now();
  majPlayer(); majIle(); controle(veut ? "play" : "pause");
};
$("pbar").onclick = e => {
  if (!sp) return;
  const r = e.currentTarget.getBoundingClientRect(), ms = Math.round((e.clientX - r.left) / r.width * sp.item.duration_ms);
  spBase = { ms, t: Date.now() }; tickPlayer(); controle("seek", { ms });
};
document.addEventListener("keydown", e => { if (e.key === "Escape") fermerPlayer(); });
setInterval(() => { if (spOuvert || ++spTick % 3 === 0) loadSpotify(); }, 2000);
setInterval(() => { if (spOuvert) tickPlayer(); }, 500);

majIle();

/* ── Zone dynamique : Bambu & Spotify ── */
const show = (id,on) => $(id).classList.toggle("show", on);
function renderBambu(d){
  const st = d && d.state ? String(d.state).toUpperCase() : "";
  const libelles = { RUNNING: "En cours", PREPARE: "Préparation", SLICING: "Préparation", PAUSE: "En pause", FINISH: "Terminée", FAILED: "Échec", IDLE: "Au repos" };
  const joignable = !!d && st !== "" && !["OFFLINE", "ERROR", "AUTH_ERROR"].includes(st);
  const actif = joignable && ["RUNNING", "PREPARE", "PAUSE"].includes(st) && typeof d.progress === "number";
  const prog = actif ? Math.min(100, Math.max(0, d.progress)) : (joignable && st === "FINISH" ? 100 : 0);
  $("bbRing").style.setProperty("--p", prog);
  $("bbPct").textContent = actif ? Math.round(prog) + "%" : (joignable ? (libelles[st] || "Au repos") : "Hors ligne");
  $("bbName").textContent = joignable && d.name ? d.name : "—";
  const m = d && d.remaining_min;
  const reste = m > 0 ? "Reste " + (m >= 60 ? Math.floor(m / 60) + " h " + pad(m % 60) + " min" : m + " min") : "Presque fini";
  $("bbEta").textContent = !joignable ? "Imprimante injoignable"
    : actif ? (st === "PAUSE" ? "En pause · " : "") + reste
    : st === "FINISH" ? "Dernière impression terminée"
    : st === "FAILED" ? "Dernière impression échouée" : "Prête à imprimer";
  $("bbNozzle").textContent = joignable && typeof d.nozzle === "number" ? Math.round(d.nozzle) + "°" : "—";
  $("bbBed").textContent = joignable && typeof d.bed === "number" ? Math.round(d.bed) + "°" : "—";
}
async function loadBambu(){
  if (DEMO) return renderBambu({state:"RUNNING",progress:64,remaining_min:87,nozzle:220,bed:60,name:"Support_casque_v3.3mf"});
  const u = CONFIG.bambuUrl || (CONFIG.icsWorker && CONFIG.icsWorker.replace(/\/?$/, "/bambu"));
  if (!u) return renderBambu(null);
  try { renderBambu(await (await fetch(u)).json()); } catch(e){ renderBambu(null); }
}
loadBambu(); loadSpotify();
setInterval(loadBambu, CONFIG.intervalle.bambu*1000);

addEventListener("hashchange", () => { loadBambu(); loadSpotify(); });

/* ── Minuteur de refroidissement : fin d’impression + 15 min, avec sonnerie ── */
const REFROID = 15;
let bbDernier = null, minuteur = null, audioCtx = null, alarmeTimer = 0, armeAnnul = 0;
try { minuteur = JSON.parse(localStorage.getItem("minuteurBambu") || "null"); } catch(_){}
const sauveMinuteur = () => { try { minuteur ? localStorage.setItem("minuteurBambu", JSON.stringify(minuteur)) : localStorage.removeItem("minuteurBambu"); } catch(_){} };
const fmtReste = ms => { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + " h " + pad(m) + " min" : m + ":" + pad(s % 60); };
function etatBambu(d){ const st = d && d.state ? String(d.state).toUpperCase() : ""; return { st, actif: ["RUNNING", "PREPARE", "PAUSE"].includes(st) && typeof d.progress === "number", fini: st === "FINISH" }; }
function boutonMinuteur(){
  const b = $("bbTimer"), { actif, fini } = etatBambu(bbDernier);
  if (minuteur){
    b.hidden = false; b.classList.add("on");
    b.innerHTML = armeAnnul ? "<small>Annuler ?</small><b>Appuie encore</b>" : "<small>Sonne dans</small><b>" + fmtReste(minuteur.fin - Date.now()) + "</b>";
    return;
  }
  b.classList.remove("on");
  if (actif){ b.hidden = false; b.innerHTML = "<small>Minuteur</small><b>Fin + " + REFROID + " min</b>"; }
  else if (fini){ b.hidden = false; b.innerHTML = "<small>Minuteur</small><b>" + REFROID + " min</b>"; }
  else b.hidden = true;
}
function majMinuteur(d){
  bbDernier = d; const { st, actif } = etatBambu(d);
  if (minuteur && minuteur.suivi){
    if (actif){ minuteur.fin = Date.now() + ((d.remaining_min || 0) + REFROID) * 60000; sauveMinuteur(); }
    else if (["FINISH", "FAILED", "IDLE"].includes(st)){ minuteur.termine = Date.now(); minuteur.fin = Date.now() + REFROID * 60000; minuteur.suivi = false; sauveMinuteur(); }
  }
  boutonMinuteur();
}
function deverrouillerSon(){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch(_){} }
function bip(n){
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  for (let i = 0; i < n; i++){
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + i * .3;
    o.type = "sine"; o.frequency.value = 880; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.4, t + .02); g.gain.linearRampToValueAtTime(0, t + .22);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + .25);
  }
}
function sonner(){
  $("alarme").classList.add("on"); deverrouillerSon(); bip(3);
  let n = 0; alarmeTimer = setInterval(() => { bip(3); if (++n > 50) arreterAlarme(); }, 1500);
}
function arreterAlarme(){ clearInterval(alarmeTimer); $("alarme").classList.remove("on"); minuteur = null; sauveMinuteur(); boutonMinuteur(); }
$("alarme").onclick = arreterAlarme;
$("bbTimer").onclick = () => {
  if (minuteur){
    if (armeAnnul){ clearTimeout(armeAnnul); armeAnnul = 0; minuteur = null; sauveMinuteur(); }
    else armeAnnul = setTimeout(() => { armeAnnul = 0; boutonMinuteur(); }, 3000);
    boutonMinuteur(); return;
  }
  const { actif, fini } = etatBambu(bbDernier); if (!actif && !fini) return;
  deverrouillerSon();
  minuteur = { fin: Date.now() + ((actif ? (bbDernier.remaining_min || 0) : 0) + REFROID) * 60000, suivi: actif, termine: fini ? Date.now() : 0 };
  sauveMinuteur(); bip(1); boutonMinuteur();
};
setInterval(() => { if (!minuteur) return; if (Date.now() >= minuteur.fin && !$("alarme").classList.contains("on")) sonner(); else boutonMinuteur(); }, 1000);
const _renderBambu = renderBambu;
renderBambu = function(d){ _renderBambu(d); majMinuteur(d); };
boutonMinuteur();

/* Plein écran : au premier toucher dans Safari (inutile une fois ajouté à l’écran d’accueil) */
document.addEventListener("pointerdown", () => {
  try {
    const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f && !navigator.standalone && !document.fullscreenElement && !document.webkitFullscreenElement){ const p = f.call(el); if (p && p.catch) p.catch(() => {}); }
  } catch(_){}
}, { once: true });

/* Garde l’écran allumé quand c’est possible */
try { navigator.wakeLock && navigator.wakeLock.request("screen"); } catch(_){}
