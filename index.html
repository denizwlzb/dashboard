<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dashboard Deniz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --line:#2c2c2c; --t1:#fff; --t2:#a3a3a3; --t3:#5c5c5c;
  --red:#ff3b2f; --orange:#ff9f0a; --green:#34d27b; --blue:#fff;
  --ease:cubic-bezier(.32,.72,0,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000}
body{background:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1.4px) 0 0/22px 22px,#000}
body{font-family:"Doto","DotGothic16",ui-monospace,Menlo,monospace;font-weight:600;font-size:15px;letter-spacing:.02em;
  color:var(--t1);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.app{position:relative;z-index:1;height:100%;display:grid;gap:30px;padding:34px 48px;grid-template-columns:1.25fr 1fr;grid-template-rows:auto 1fr auto auto;
  grid-template-areas:"head head" "cal rem" "gym gym" "dyn dyn"}

/* Cartes style Nothing : noir, fin contour, trame de points */
.widget{background-color:rgba(6,6,6,.80);background-image:radial-gradient(rgba(255,255,255,.075) 1px,transparent 1.4px);background-size:16px 16px;
  border:1.5px solid rgba(255,255,255,.13);border-radius:32px;padding:26px 30px;min-height:0;overflow:hidden;display:flex;flex-direction:column}
h2{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--t2);margin-bottom:18px;display:flex;align-items:center;gap:12px}
h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}

/* En-tête */
header{grid-area:head;display:flex;justify-content:space-between;align-items:flex-end;padding:0 8px}
#clock{font-size:96px;font-weight:300;letter-spacing:.03em;line-height:.85;font-variant-numeric:tabular-nums}
#date{font-size:14px;font-weight:700;color:var(--t2);margin-top:14px;letter-spacing:.2em;text-transform:uppercase}
#hello{text-align:right}
#hi{font-size:22px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
#wx{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);margin-top:10px}
#skin{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
#skin:empty{display:none}
#skin .st{font-weight:700;color:var(--t2)}
#skin .sdots{display:flex;gap:7px}
#skin .sdots i{width:10px;height:10px;border-radius:50%;border:1.5px solid #3a3a3a;transition:background .6s var(--ease),border-color .6s var(--ease)}
#skin .sdots i.on{background:var(--green);border-color:var(--green);box-shadow:0 0 8px rgba(52,210,123,.55)}
#skin .sdots i.miss{background:var(--red);border-color:var(--red)}
#skin .sdots i.now{border-color:#fff}
#skin .sx{color:var(--t2);white-space:nowrap}
#skin .sx.warn{color:var(--red);font-weight:700}
#skin .sx.ok{color:var(--green);font-weight:700}

/* Calendrier */
#cal{grid-area:cal}
#calBody{flex:1;min-height:0;overflow-y:auto}
.ev{display:flex;gap:16px;padding:13px 0;border-top:2px dotted var(--line);animation:in .6s var(--ease) both}
.ev:first-child{border-top:0;padding-top:0}
.ev .bar{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:none;margin-top:6px}
.ev .t{font-size:12px;color:var(--t2);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.ev .n{font-size:17px;font-weight:700;margin-top:3px;line-height:1.2}
.ev.past{opacity:.35}
.dense .ev{padding:7px 0}.dense .ev .n{font-size:15px}.dense .ev .t{font-size:11px}
.next-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:12px}
.empty{color:var(--t3);font-size:15px;margin:auto 0}

/* Rappels */
#rem{grid-area:rem}
.rm{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:2px dotted var(--line)}
.rm:first-child{border-top:0;padding-top:0}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--orange);flex:none}
.rm .l{font-size:17px;font-weight:700}

/* Salle (barre de points) */
#gym{grid-area:gym;padding:18px 30px}
#gymBody{display:flex;align-items:center;gap:30px;width:100%}
#gym .gt{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--t2);white-space:nowrap;display:flex;align-items:center;gap:12px}
#gym .gt::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red)}
#gym .gbar{display:flex;gap:10px;flex:none}
#gym .gbar i{width:16px;height:16px;border-radius:50%;border:2px solid #4a4a4a;transition:background .7s var(--ease),border-color .7s var(--ease)}
#gym .gbar i.on{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(52,210,123,.55)}
#gym .gn{font-size:21px;font-weight:800;white-space:nowrap}
#gym .gm{font-size:14px;color:var(--t1);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gym .gs{font-size:11px;color:var(--t2);white-space:nowrap;letter-spacing:.06em}

/* Zone dynamique */
#dyn{grid-area:dyn;display:flex;gap:30px;align-items:stretch;justify-content:center}
.dynw{flex:1 1 0;max-width:100%;opacity:0;transform:scale(.92) translateY(30px);max-height:0;padding-top:0;padding-bottom:0;border-width:0;
  pointer-events:none;transition:opacity .6s var(--ease),transform .7s var(--ease),max-height .7s var(--ease),padding .7s var(--ease)}
.dynw.show{opacity:1;transform:none;max-height:140px;padding:20px 30px;border-width:1.5px;pointer-events:auto}
#bb{flex-direction:row;align-items:center;gap:34px}
.ring{position:relative;width:190px;flex:none;display:flex;flex-direction:column}
.ring span{order:1;font-size:36px;font-weight:800;line-height:1;margin-bottom:10px}
.ring::before,.ring::after{content:"";height:10px;background:radial-gradient(circle at 5px 5px,#3a3a3a 2.4px,transparent 3px) 0 0/10px 10px repeat-x}
.ring::before{order:2}
.ring::after{position:absolute;left:0;right:0;bottom:0;background:radial-gradient(circle at 5px 5px,var(--red) 2.8px,transparent 3.4px) 0 0/10px 10px repeat-x;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(var(--p,0)*1%),transparent 0);mask-image:linear-gradient(90deg,#000 calc(var(--p,0)*1%),transparent 0)}
#bb .info{flex:1;min-width:0}
#bb .tt{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bb .sub{font-size:12px;color:var(--t2);margin-top:4px;letter-spacing:.08em}
.temps{display:flex;gap:10px;margin-top:10px}
.temps div{border:1.5px dotted #444;border-radius:16px;padding:5px 13px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--t2)}
.temps b{display:block;font-size:17px;color:var(--orange);font-weight:800;letter-spacing:.02em}
#sp{flex-direction:row;align-items:center;gap:26px}
#sp .art{position:relative;width:76px;height:76px;border-radius:18px;flex:none;background:#222 center/cover;filter:grayscale(1) contrast(1.15)}
#sp .art::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(rgba(0,0,0,.6) 1.4px,transparent 1.8px) 0 0/5px 5px}
#sp .info{flex:1;min-width:0}
#sp .tt{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sp .ar{font-size:13px;color:var(--t2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.06em}
.prog{height:8px;margin-top:14px;background:radial-gradient(circle at 4px 4px,#3a3a3a 2.4px,transparent 3px) 0 0/10px 8px repeat-x}
.prog b{display:block;height:100%;width:0;background:radial-gradient(circle at 4px 4px,var(--green) 2.8px,transparent 3.4px) 0 0/10px 8px repeat-x;transition:width 1s linear}
.eq{display:flex;gap:5px;align-items:flex-end;height:26px}
.eq span{width:5px;background:var(--green);border-radius:3px;animation:eq 1s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:.2s}.eq span:nth-child(3){animation-delay:.4s}.eq span:nth-child(4){animation-delay:.1s}

/* Halos de couleur (rouge dominant, orange et vert en touches) */
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(820px 560px at 90% -10%,rgba(255,106,0,.42),transparent 65%),
             radial-gradient(700px 520px at 4% 108%,rgba(255,159,10,.34),transparent 65%),
             radial-gradient(540px 420px at 56% 114%,rgba(255,87,34,.28),transparent 70%),
             radial-gradient(460px 360px at 2% 6%,rgba(255,193,77,.20),transparent 70%),
             radial-gradient(400px 320px at 98% 72%,rgba(204,85,0,.30),transparent 70%)}
@keyframes breathe{from{opacity:.78;transform:scale(1)}to{opacity:1;transform:scale(1.06)}}
#sweep{position:fixed;top:0;bottom:0;left:0;width:32vw;z-index:2;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(255,59,47,.16),rgba(255,159,10,.10),transparent)}

/* Horloge : animation à chaque changement de chiffre */
#clock .dg{display:inline-block}
#clock .sep{display:inline-block;color:var(--red);margin:0 .02em;animation:blink 2s steps(1) infinite}
#clock .chg{animation:dgIn .9s var(--ease) both}
#clock .chgH{animation:dgHour 1.3s var(--ease) both}
@keyframes dgIn{0%{opacity:0;transform:translateY(-.22em);filter:blur(5px);color:var(--red)}55%{color:var(--red)}100%{opacity:1;transform:none;filter:blur(0);color:#fff}}
@keyframes dgHour{0%{opacity:0;transform:scale(.7);filter:blur(8px);color:var(--orange)}50%{color:var(--orange)}100%{opacity:1;transform:none;filter:blur(0);color:#fff}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* Effets occasionnels (déclenchés au hasard toutes les 25 à 60 s) */
body.fx-sweep #sweep{animation:sweep 2.6s var(--ease)}
@keyframes sweep{0%{opacity:0;transform:translateX(-40vw)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(110vw)}}
body.fx-glitch #clock{animation:glitch .9s steps(1)}
@keyframes glitch{0%{transform:none;opacity:1}10%{transform:translateX(-6px);opacity:.6}20%{transform:translateX(5px);opacity:1}30%{opacity:.3}40%{transform:translateX(-3px);opacity:1}55%{opacity:.5}70%{transform:translateX(2px);opacity:1}100%{transform:none;opacity:1}}
body.fx-pulse h2::before,body.fx-pulse #gym .gt::before{animation:pulse 1.4s ease-out}
@keyframes pulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,59,47,.8)}60%{transform:scale(1.7);box-shadow:0 0 0 12px rgba(255,59,47,0)}100%{transform:none;box-shadow:0 0 0 0 rgba(255,59,47,0)}}

@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes eq{0%,100%{height:6px}50%{height:24px}}
@property --p{syntax:"<number>";inherits:true;initial-value:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="glow"></div><div id="sweep"></div>
<div class="app">
  <header>
    <div><div id="clock"></div><div id="date"></div></div>
    <div id="hello"><div id="hi">Bonjour Deniz</div><div id="wx"></div><div id="skin"></div></div>
  </header>

  <section class="widget" id="cal"><h2>Calendrier</h2><div id="calBody"></div></section>
  <section class="widget" id="rem"><h2>Rappels</h2><div id="remBody"></div></section>
  <section class="widget" id="gym"><div id="gymBody"></div></section>


  <div id="dyn">
    <section class="widget dynw" id="bb">
      <div class="ring" id="bbRing"><span id="bbPct">0%</span></div>
      <div class="info">
        <h2 style="margin-bottom:6px">Bambu Lab A1</h2>
        <div class="tt" id="bbName">—</div>
        <div class="sub" id="bbEta">—</div>
        <div class="temps"><div><b id="bbNozzle">—</b>Buse</div><div><b id="bbBed">—</b>Plateau</div></div>
      </div>
    </section>
    <section class="widget dynw" id="sp">
      <div class="art" id="spArt"></div>
      <div class="info">
        <div class="tt" id="spTitle">—</div><div class="ar" id="spArtist">—</div>
        <div class="prog"><b id="spBar"></b></div>
      </div>
      <div class="eq"><span></span><span></span><span></span><span></span></div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
<script>
/* ═══════════════ CONFIGURATION ═══════════════
   Les intégrations externes (réseau) fonctionnent quand ce fichier est ouvert
   depuis votre propre serveur / appareil. Sans configuration, le mode démo s’affiche.
   Ajoutez #demo à l’adresse pour forcer l’affichage des widgets Bambu et Spotify. */
const CONFIG = {
  prenom: "Deniz",
  meteo: { lat: 45.19, lon: 5.72, ville: "Grenoble" },             // coordonnées (Open-Meteo, sans clé)
  icsWorker: "https://cal-k7x92mqp4v.deniz-walzberg.workers.dev/", // Worker Cloudflare qui lit tes calendriers iCloud
  bambuUrl: "",     // JSON local : {state,progress,remaining_min,nozzle,bed,name} (pont MQTT → HTTP)
  spotifyToken: "", // jeton OAuth Spotify (scope user-read-currently-playing)
  intervalle: { meteo: 600, calendrier: 300, bambu: 10, spotify: 5 } // secondes
};
const DEMO = location.hash.replace("#","") === "demo";
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

/* ── Horloge ── */
/* ── Horloge en points fins (canvas) : seul le changement de chiffre est animé ── */
const CLK = { fs: 104, H: 88, base: 80, dw: 66, cw: 26, gap: 6, p: 3, r: 1.2, dur: 1200 };
const clock = { cv: null, ctx: null, off: null, W: 0, slots: [], text: "", raf: 0, dpr: 1 };
const ROUGE = [255, 59, 47], ORANGE = [255, 159, 10];
const melange = (c, m) => `rgb(${Math.round(255 + (c[0] - 255) * m)},${Math.round(255 + (c[1] - 255) * m)},${Math.round(255 + (c[2] - 255) * m)})`;

function clockInit(){
  const { H, dw, cw, gap, p } = CLK;
  let x = 0;
  clock.slots = [dw, dw, cw, dw, dw].map(w => { const s = { x, w, cols: Math.ceil(w / p), rows: Math.ceil(H / p), ch: "", from: null, to: null, start: 0, accent: ROUGE, delay: null }; x += w + gap; return s; });
  clock.W = x - gap;
  clock.dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cv = document.createElement("canvas");
  cv.width = Math.round(clock.W * clock.dpr); cv.height = Math.round(H * clock.dpr);
  cv.style.width = clock.W + "px"; cv.style.height = H + "px"; cv.style.display = "block";
  $("clock").appendChild(cv);
  clock.cv = cv; clock.ctx = cv.getContext("2d"); clock.ctx.scale(clock.dpr, clock.dpr);
  clock.off = document.createElement("canvas");
}
function glyphGrid(ch, w){
  const { H, base, fs, p } = CLK, S = 2, off = clock.off;
  off.width = w * S; off.height = H * S;
  const c = off.getContext("2d", { willReadFrequently: true });
  c.scale(S, S);
  c.font = `700 ${fs}px -apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif`;
  c.textAlign = "center"; c.textBaseline = "alphabetic"; c.fillStyle = "#000";
  c.fillText(ch, w / 2, base);
  const data = c.getImageData(0, 0, off.width, off.height).data, cols = Math.ceil(w / p), rows = Math.ceil(H / p), g = new Uint8Array(cols * rows);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++){
    const px = Math.min(off.width - 1, Math.round((i * p + p / 2) * S)), py = Math.min(off.height - 1, Math.round((j * p + p / 2) * S));
    if (data[(py * off.width + px) * 4 + 3] > 110) g[j * cols + i] = 1;
  }
  return g;
}
function clockDraw(now){
  const ctx = clock.ctx, { H, p, r, dur } = CLK;
  ctx.clearRect(0, 0, clock.W, H);
  let busy = false;
  clock.slots.forEach((s, k) => {
    let anim = false, t = 1;
    if (s.to){
      if (now - s.start < dur){ anim = true; busy = true; t = (now - s.start) / dur; }
      else { s.from = s.to; s.to = null; }
    }
    for (let j = 0; j < s.rows; j++) for (let i = 0; i < s.cols; i++){
      const n = j * s.cols + i, a = s.from[n], b = anim ? s.to[n] : a;
      let alpha = 0, mix = 0;
      if (!anim) alpha = a;
      else if (a && b) alpha = 1;
      else if (a) alpha = 1 - Math.min(1, Math.max(0, (t - s.delay[n] * .45) / .45));
      else if (b){ alpha = Math.min(1, Math.max(0, (t - .2 - s.delay[n] * .4) / .35)); mix = 1 - Math.min(1, Math.max(0, (t - .55) / .45)); }
      if (alpha <= .02) continue;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = k === 2 ? melange(ROUGE, 1) : mix > .02 ? melange(s.accent, mix) : "#fff";
      ctx.beginPath(); ctx.arc(s.x + i * p + p / 2, j * p + p / 2, r, 0, 6.2832); ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
  clock.raf = busy ? requestAnimationFrame(clockDraw) : 0;
}
function clockSet(t){
  if (!clock.cv) clockInit();
  const now = performance.now();
  clock.slots.forEach((s, k) => {
    if (s.ch === t[k]) return;
    const grid = glyphGrid(t[k], s.w);
    if (!s.from) s.from = grid;
    else { if (s.to) s.from = s.to; s.to = grid; s.start = now; s.delay = Float32Array.from({ length: s.cols * s.rows }, Math.random); s.accent = k < 2 ? ORANGE : ROUGE; }
    s.ch = t[k];
  });
  clock.text = t;
  if (!clock.raf) clock.raf = requestAnimationFrame(clockDraw);
}
function tick(){
  const d = new Date(), t = pad(d.getHours()) + ":" + pad(d.getMinutes());
  if (t !== clock.text) clockSet(t);
  $("date").textContent = d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}
tick(); setInterval(tick, 1000);

/* Petits effets occasionnels */
const EFFETS = [["sweep", 2700], ["glitch", 950], ["pulse", 1500]];
function effetAuHasard(){
  const [nom, ms] = EFFETS[Math.floor(Math.random() * EFFETS.length)];
  document.body.classList.add("fx-" + nom);
  setTimeout(() => document.body.classList.remove("fx-" + nom), ms);
  setTimeout(effetAuHasard, 25000 + Math.random() * 35000);
}
setTimeout(effetAuHasard, 12000);

/* ── Salutation (texte uniquement) ── */
function majSalut(){
  const h = new Date().getHours();
  $("hi").textContent = (h >= 5 && h < 18 ? "Bonjour" : h >= 18 && h < 22 ? "Bonsoir" : "Bonne nuit") + " " + CONFIG.prenom;
}
majSalut(); setInterval(majSalut, 60000);

/* ── Calendrier ── */
let events = [];
function demoEvents(){
  const n = new Date(), at = (dd,h,m) => { const d = new Date(n); d.setDate(d.getDate()+dd); d.setHours(h,m,0,0); return d; };
  return [
    {n:"Point équipe", s:at(0,9,30),  e:at(0,10,15)},
    {n:"Déjeuner avec Léa", s:at(0,12,30), e:at(0,14,0)},
    {n:"Impression pièce V2", s:at(0,17,0), e:at(0,17,30)},
    {n:"Cinéma", s:at(1,20,45), e:at(1,23,0)}
  ];
}
let calErr = false;
function expandICS(txt, from, to){
  const out = [], comp = new ICAL.Component(ICAL.parse(txt));
  comp.getAllSubcomponents("vtimezone").forEach(tz => { try { ICAL.TimezoneService.register(tz); } catch(_){} });
  const masters = new Map(), exc = [];
  comp.getAllSubcomponents("vevent").forEach(v => {
    const e = new ICAL.Event(v);
    if (e.isRecurrenceException()) exc.push(e); else masters.set(e.uid, e);
  });
  exc.forEach(x => { const m = masters.get(x.uid); if (m) m.relateException(x); });
  const skipBefore = new Date(+from - 2*864e5);
  for (const e of masters.values()){
    const titre = e.summary || "Sans titre";
    if (e.isRecurring()){
      const it = e.iterator(); let next, n = 0;
      while ((next = it.next()) && n++ < 20000){
        const sd = next.toJSDate();
        if (sd > to) break;
        if (sd < skipBefore) continue;
        const d = e.getOccurrenceDetails(next);
        const s = d.startDate.toJSDate(), en = d.endDate.toJSDate();
        if (en >= from && s <= to) out.push({n: d.item.summary || titre, s, e: en});
      }
    } else {
      const s = e.startDate.toJSDate(), en = e.endDate ? e.endDate.toJSDate() : s;
      if (en >= from && s <= to) out.push({n: titre, s, e: en});
    }
  }
  return out;
}
async function loadCal(){
  const from = new Date(Date.now() - 864e5), to = new Date(Date.now() + 60*864e5);
  if (!CONFIG.icsWorker){ events = demoEvents(); }
  else {
    try {
      const res = await fetch(CONFIG.icsWorker);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const cals = await res.json(), merged = [];
      cals.forEach(txt => { try { merged.push(...expandICS(txt, from, to)); } catch(e){ console.warn("Calendrier ignoré :", e); } });
      const seen = new Set();
      events = merged.filter(e => { const k = e.n + "|" + e.s.getTime(); if (seen.has(k)) return false; seen.add(k); return true; });
      calErr = false;
    } catch(e){ console.warn("Calendrier indisponible :", e); calErr = true; }
  }
  events.sort((a, b) => a.s - b.s);
  renderCal();
}
function renderCal(){
  const now = new Date(), sod = new Date(now.getFullYear(), now.getMonth(), now.getDate()), eod = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const hm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
  const duJour = (a, b) => events.filter(e => e.s < b && e.e > a);
  const horaire = e => (e.e - e.s >= 864e5 - 36e5 && e.s.getHours() === 0 && e.s.getMinutes() === 0) ? "Toute la journée" : hm(e.s) + " – " + hm(e.e);
  const ligne = (e, past, orange) => `<div class="ev ${past ? "past" : ""}"><div class="bar"${orange ? ' style="background:var(--orange)"' : ""}></div><div><div class="t">${horaire(e)}</div><div class="n">${esc(e.n)}</div></div></div>`;
  const today = duJour(sod, eod);
  let liste = [], html = "";
  if (today.some(e => e.e > now)){
    // Il reste des événements aujourd'hui : on affiche toute la journée
    liste = today;
    html = today.map(e => ligne(e, e.e <= now, false)).join("");
  } else {
    // Rien (ou journée finie) : tous les événements du prochain jour qui en a
    const nx = events.find(e => e.s >= eod);
    if (nx){
      const d0 = new Date(nx.s.getFullYear(), nx.s.getMonth(), nx.s.getDate()), d1 = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + 1);
      const demain = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      let label = d0.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"});
      label = label.charAt(0).toUpperCase() + label.slice(1);
      if (+d0 === +demain) label = "Demain · " + label;
      liste = duJour(d0, d1);
      html = `<div class="next-label">${label}</div>` + liste.map(e => ligne(e, false, true)).join("");
    } else {
      html = `<div class="empty">${calErr ? "Calendrier indisponible, nouvelle tentative…" : "Rien de prévu prochainement."}</div>`;
    }
  }
  $("calBody").classList.toggle("dense", liste.length > 6);
  $("calBody").innerHTML = html;
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
loadCal(); setInterval(loadCal, CONFIG.intervalle.calendrier*1000); setInterval(renderCal, 60000);

/* ── Rappels (synchronisés depuis l’app Rappels : Raccourci iPad → Worker) ── */
let rappels = null, remErr = false;
function renderRem(){
  if (rappels === null){ $("remBody").innerHTML = `<div class="empty">${remErr ? "Rappels non connectés" : "Chargement…"}</div>`; return; }
  $("remBody").innerHTML = rappels.length
    ? rappels.map(r => `<div class="rm"><div class="dot"></div><div class="l">${esc(r)}</div></div>`).join("")
    : `<div class="empty">Tout est fait.</div>`;
}
async function loadRem(){
  if (!CONFIG.icsWorker){ rappels = ["Sortir les poubelles", "Commander du filament PLA", "Appeler le dentiste"]; return renderRem(); }
  try {
    const res = await fetch(CONFIG.icsWorker.replace(/\/?$/, "/rappels"));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const l = await res.json();
    if (!Array.isArray(l) || l.some(x => typeof x !== "string" || x.startsWith("BEGIN:VCALENDAR"))) throw new Error("Le Worker n’a pas encore la route /rappels");
    remErr = false;
    if (JSON.stringify(l) !== JSON.stringify(rappels)){ rappels = l; renderRem(); }
  } catch(e){ console.warn("Rappels indisponibles :", e); remErr = true; if (rappels === null) renderRem(); }
}
renderRem(); loadRem(); setInterval(loadRem, 60000);

/* ── Skincare (routine envoyée par le Raccourci NFC → Worker) ── */
function renderSkin(s){
  if (!s){ $("skin").innerHTML = ""; return; }
  const n = s.jours.length;
  const dots = s.jours.map((v, i) => `<i class="${v === 1 ? "on" : i === n - 1 ? "now" : v === 0 ? "miss" : ""}"></i>`).join("");
  let txt, cls = s.fait ? "ok" : "";
  if (s.fait) txt = s.streak > 1 ? `${s.streak} jours d’affilée` : "Routine faite";
  else if (s.sans === null) { txt = "Aucune routine enregistrée"; cls = "warn"; }
  else if (s.sans >= 2) { txt = `${s.sans} jours sans routine`; cls = "warn"; }
  else txt = "À faire aujourd’hui" + (s.streak > 0 ? ` · série ${s.streak}` : "");
  $("skin").innerHTML = `<span class="st">Skincare</span><div class="sdots">${dots}</div><span class="sx ${cls}">${txt}</span>`;
}
async function loadSkin(){
  if (!CONFIG.icsWorker) return renderSkin(null);
  try {
    const s = await (await fetch(CONFIG.icsWorker.replace(/\/?$/, "/skincare"))).json();
    renderSkin(s && Array.isArray(s.jours) && typeof s.streak === "number" ? s : null);
  } catch(e){ console.warn("Skincare indisponible :", e); }
}
loadSkin(); setInterval(loadSkin, 60000);

/* ── Salle (séances envoyées par le Raccourci iPhone → Worker) ── */
function renderGym(g){
  if (!g){ $("gymBody").innerHTML = `<span class="gt">Salle</span><span class="gm">Salle non connectée</span>`; return; }
  const reste = g.objectif - g.count, dispo = 6 - g.today + (g.jours[g.today] ? 0 : 1);
  const s = n => n > 1 ? "s" : "";
  const msg = reste <= 0 ? "Objectif atteint"
    : dispo < reste ? "Objectif difficile cette semaine"
    : dispo === reste ? "Chaque jour compte : il faut y aller !"
    : `Plus que ${reste} séance${s(reste)} cette semaine`;
  let der = "aucune séance enregistrée";
  if (g.derniere){
    const j = Math.round((new Date(new Date().toLocaleDateString("fr-CA")) - new Date(g.derniere)) / 864e5);
    der = "dernière séance " + (j <= 0 ? "aujourd’hui" : j === 1 ? "hier" : "il y a " + j + " jours");
  }
  const segs = Array.from({length: g.objectif}, (_, i) => `<i class="${i < g.count ? "on" : ""}"></i>`).join("");
  $("gymBody").innerHTML =
    `<span class="gt">Salle</span><div class="gbar">${segs}</div><span class="gn">${g.count}/${g.objectif}</span>` +
    `<span class="gm">${msg}</span>` +
    `<span class="gs">${g.streak > 0 ? `${g.streak} semaine${s(g.streak)} d’affilée · ` : ""}${der}</span>`;
}
async function loadGym(){
  if (!CONFIG.icsWorker) return renderGym(null);
  try {
    const g = await (await fetch(CONFIG.icsWorker.replace(/\/?$/, "/salle"))).json();
    renderGym(g && typeof g.objectif === "number" && Array.isArray(g.jours) ? g : null);
  } catch(e){ console.warn("Salle indisponible :", e); }
}
renderGym(null); loadGym(); setInterval(loadGym, 60000);

/* ── Météo ── */

  51:["🌦️","Bruine"],53:["🌦️","Bruine"],55:["🌦️","Bruine"],61:["🌧️","Pluie"],63:["🌧️","Pluie"],65:["🌧️","Forte pluie"],
  71:["🌨️","Neige"],73:["🌨️","Neige"],75:["❄️","Forte neige"],80:["🌦️","Averses"],81:["🌦️","Averses"],82:["⛈️","Fortes averses"],95:["⛈️","Orage"],96:["⛈️","Orage"],99:["⛈️","Orage"]};

async function loadWx(){
  try {
    const {lat,lon} = CONFIG.meteo;

loadWx(); setInterval(loadWx, CONFIG.intervalle.meteo*1000);

/* ── Zone dynamique : Bambu & Spotify ── */
const show = (id,on) => $(id).classList.toggle("show", on);
function renderBambu(d){
  const on = d && /run|print/i.test(d.state||"");
  show("bb", !!on); if (!on) return;
  $("bbRing").style.setProperty("--p", d.progress);
  $("bbPct").textContent = Math.round(d.progress) + "%";
  $("bbName").textContent = d.name || "Impression en cours";
  const m = d.remaining_min, h = Math.floor(m/60);
  $("bbEta").textContent = "Reste " + (h ? h+" h "+pad(m%60)+" min" : m+" min");
  $("bbNozzle").textContent = Math.round(d.nozzle) + "°";
  $("bbBed").textContent = Math.round(d.bed) + "°";
}
async function loadBambu(){
  if (DEMO) return renderBambu({state:"RUNNING",progress:64,remaining_min:87,nozzle:220,bed:60,name:"Support_casque_v3.3mf"});
  const u = CONFIG.bambuUrl || (CONFIG.icsWorker && CONFIG.icsWorker.replace(/\/?$/, "/bambu"));
  if (!u) return renderBambu(null);
  try { renderBambu(await (await fetch(u)).json()); } catch(e){ renderBambu(null); }
}
function renderSpotify(d){
  const ok = d && d.is_playing && d.item;
  show("sp", !!ok); if (!ok) return;
  $("spTitle").textContent = d.item.name;
  $("spArtist").textContent = d.item.artists.map(a => a.name).join(", ");
  const img = d.item.album && d.item.album.images && d.item.album.images[0];
  $("spArt").style.backgroundImage = img ? `url(${img.url})` : "";
  $("spBar").style.width = (d.progress_ms / d.item.duration_ms * 100) + "%";
}
async function loadSpotify(){
  if (DEMO) return renderSpotify({is_playing:true,progress_ms:95000,item:{name:"Midnight City",artists:[{name:"M83"}],duration_ms:243000,album:{images:[]}}});
  const u = CONFIG.spotifyUrl || (CONFIG.icsWorker && CONFIG.icsWorker.replace(/\/?$/, "/spotify"));
  if (!u) return renderSpotify(null);
  try { renderSpotify(await (await fetch(u)).json()); } catch(e){ renderSpotify(null); }
}
loadBambu(); loadSpotify();
setInterval(loadBambu, CONFIG.intervalle.bambu*1000);
setInterval(loadSpotify, CONFIG.intervalle.spotify*1000);
addEventListener("hashchange", () => { loadBambu(); loadSpotify(); });
