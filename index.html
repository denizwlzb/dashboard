<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#E3D3B8">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Dashboard Deniz</title>
<style>
/* Palette 60 / 30 / 10 : crème (fond), bleu foncé (cartes), rouge (accents) */
:root{
  --cream:#E3D3B8; --navy:#112240; --red:#D7263D; --redt:#FF6B7B;
  --t1:#F6EEDC; --t2:rgba(246,238,220,.74); --t3:rgba(246,238,220,.48); --line:rgba(246,238,220,.16);
  --orange:var(--redt); --green:#F6EEDC;
  --ease:cubic-bezier(.32,.72,0,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#E3D3B8}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  font-weight:500;font-size:16px;letter-spacing:-.011em;color:var(--t1);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  background:linear-gradient(160deg,#EBDDC4 0%,#E3D3B8 55%,#D8C5A5 100%)}

/* Disposition : 3 colonnes, chaque carte ne prend que la place de son contenu */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:36px 44px;align-items:start}
.col{display:flex;flex-direction:column;min-height:0;max-height:100%}
.col>.widget{flex:0 1 auto;margin-bottom:22px}
.col>.widget:last-child{margin-bottom:0}

/* Verre liquide bleu foncé */
.widget{position:relative;
  background:radial-gradient(130% 90% at 0% 0%,rgba(255,255,255,.20),rgba(255,255,255,0) 50%),linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02)),rgba(17,34,64,.90);
  -webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);
  border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:20px 24px;min-height:0;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 12px 30px rgba(17,34,64,.22)}
h2{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:12px}

/* Heure, salutation, skincare */
#clock{display:flex;align-items:baseline;font-size:84px;font-weight:200;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
#clock .dg{display:inline-block;min-width:.58em;text-align:center}
#clock .sep{color:var(--redt);margin:0 .03em;transform:translateY(-.05em)}
#clock .chg{animation:dgIn .7s var(--ease) both}
#clock .chgH{animation:dgHour 1s var(--ease) both}
#date{font-size:15px;font-weight:500;color:var(--t2);margin-top:6px;text-transform:capitalize}
#hi{font-size:22px;font-weight:600;letter-spacing:-.02em}
#wx{font-size:14px;font-weight:500;color:var(--t2);margin-top:4px}
#skin{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px 12px;padding:16px 24px;font-size:13px}
#skin:empty{display:none}
#skin .st{grid-column:1;grid-row:1;font-weight:600;color:var(--t2)}
#skin .sx{grid-column:2;grid-row:1;color:var(--t1);white-space:nowrap;font-weight:600}
#skin .sx.warn{background:var(--red);color:#fff;padding:3px 10px;border-radius:99px}
#skin .sdots{grid-column:1/-1;grid-row:2;display:flex;gap:4px}
#skin .sdots i{flex:1;height:14px;border-radius:3px;background:rgba(246,238,220,.18);transition:background .6s var(--ease)}
#skin .sdots i.on{background:var(--t1)}
#skin .sdots i.miss{background:var(--red)}
#skin .sdots i.now{background:transparent;box-shadow:inset 0 0 0 1.5px var(--t1)}

/* Hydratation */
#eau{display:flex;flex-direction:column;gap:12px;padding:20px 24px}
#eau:empty{display:none}
#eau .eh{display:flex;justify-content:space-between;align-items:baseline}
#eau .et{font-size:13px;font-weight:600;color:var(--t2)}
#eau .en{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
#eau .en small{font-size:13px;font-weight:500;color:var(--t2)}
#eau .ebar{position:relative;height:10px;border-radius:5px;background:rgba(246,238,220,.18)}
#eau .ebar b{display:block;height:100%;border-radius:5px;background:var(--red);transition:width .9s var(--ease)}
#eau .ebar b.ok{background:var(--t1)}
#eau .ebar u{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--t1);text-decoration:none}
#eau .chip{align-self:flex-start;font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;background:rgba(246,238,220,.14)}
#eau .chip.ok{background:var(--t1);color:var(--navy)}
#eau .chip.late{background:var(--red);color:#fff}
#eau .er{font-size:15px;font-weight:600}
#eau .ew{display:flex;align-items:flex-end;gap:7px;height:52px;border-top:1px dashed rgba(246,238,220,.4)}
#eau .ew i{flex:1;border-radius:3px 3px 0 0;background:rgba(246,238,220,.32);transition:height .8s var(--ease)}
#eau .ew i.ok{background:var(--red)}
#eau .ew i.t:not(.ok){background:var(--t1)}
#eau .el{display:flex;gap:7px;margin-top:-6px}
#eau .el span{flex:1;text-align:center;font-size:11px;color:var(--t2)}
#eau .el span.t{color:var(--t1);font-weight:700}
#eau .es{font-size:13px;color:var(--t2)}

/* Calendrier */
#cal{min-height:0}
#calBody{flex:0 1 auto;min-height:0;overflow-y:auto}
.ev{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line);animation:in .6s var(--ease) both}
.ev:first-child{border-top:0;padding-top:0}
.ev .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--t1);flex:none}
.ev .t{font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums}
.ev .n{font-size:16px;font-weight:600;margin-top:1px;line-height:1.2;letter-spacing:-.02em}
.ev.past{opacity:.45}
.dense .ev{padding:8px 0}.dense .ev .n{font-size:15px}.dense .ev .t{font-size:11px}
.next-label{font-size:13px;font-weight:600;color:var(--redt);margin-bottom:12px}
.empty{color:var(--t3);font-size:15px}

/* Rappels */
.rm{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rm:first-child{border-top:0;padding-top:0}
.dot{width:17px;height:17px;border-radius:50%;border:1.5px solid rgba(246,238,220,.8);flex:none}
.rm .l{font-size:16px;font-weight:500;letter-spacing:-.02em}

/* Salle */
#gym{padding:18px 24px}
#gymBody{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px 12px}
#gym .gt{grid-column:1;grid-row:1;font-size:13px;font-weight:600;color:var(--t2)}
#gym .gn{grid-column:2;grid-row:1;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
#gym .gbar{grid-column:1/-1;grid-row:2;display:flex;gap:6px}
#gym .gbar i{flex:1;height:8px;border-radius:4px;background:rgba(246,238,220,.2);transition:background .7s var(--ease)}
#gym .gbar i.on{background:var(--red)}
#gym .gm{grid-column:1/-1;grid-row:3;font-size:14px}
#gym .gs{grid-column:1/-1;grid-row:4;font-size:12px;color:var(--t2)}

/* Cartes qui apparaissent seulement quand il y a quelque chose (Bambu, Spotify) */
.dynw{opacity:0;transform:scale(.94) translateY(20px);max-height:0;margin-bottom:0!important;padding-top:0;padding-bottom:0;border-width:0;
  pointer-events:none;transition:opacity .6s var(--ease),transform .7s var(--ease),max-height .7s var(--ease),padding .7s var(--ease),margin .7s var(--ease)}
.dynw.show{opacity:1;transform:none;max-height:300px;margin-bottom:22px!important;padding:18px 24px;border-width:1px;pointer-events:auto}
.col>.dynw.show:last-child{margin-bottom:0!important}
#bb{gap:14px}
.ring{position:relative;width:100%;display:flex;flex-direction:column;transition:--p 1s linear}
.ring span{order:1;font-size:34px;font-weight:600;line-height:1;margin-bottom:10px;font-variant-numeric:tabular-nums}
.ring::before,.ring::after{content:"";height:6px;border-radius:3px}
.ring::before{order:2;background:rgba(246,238,220,.2)}
.ring::after{position:absolute;left:0;bottom:0;width:calc(var(--p,0)*1%);background:var(--red)}
#bb h2{margin-bottom:4px}
#bb .tt{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bb .sub{font-size:13px;color:var(--t2);margin-top:2px}
.temps{display:flex;gap:8px;margin-top:10px}
.temps div{flex:1;background:rgba(246,238,220,.10);border-radius:12px;padding:6px 12px;font-size:12px;color:var(--t2)}
.temps b{display:block;font-size:16px;color:var(--t1);font-weight:600}
#sp{flex-direction:row;align-items:center;gap:16px}
#sp .art{width:60px;height:60px;border-radius:14px;flex:none;background:rgba(246,238,220,.15) center/cover;box-shadow:0 6px 16px rgba(0,0,0,.3)}
#sp .info{flex:1;min-width:0}
#sp .tt{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sp .ar{font-size:13px;color:var(--t2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:4px;border-radius:2px;margin-top:10px;background:rgba(246,238,220,.2);overflow:hidden}
.prog b{display:block;height:100%;width:0;border-radius:2px;background:var(--red);transition:width 1s linear}
.eq{display:flex;gap:3px;align-items:flex-end;height:20px}
.eq span{width:3px;background:var(--red);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:.2s}.eq span:nth-child(3){animation-delay:.4s}.eq span:nth-child(4){animation-delay:.1s}

/* Fond et effets occasionnels */
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(110,80,40,.14) 100%)}
#sweep{position:fixed;top:0;bottom:0;left:0;width:34vw;z-index:2;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
body.fx-sweep #sweep{animation:sweep 2.8s var(--ease)}
body.fx-lift .widget{animation:lift 1.6s var(--ease)}
@keyframes sweep{0%{opacity:0;transform:translateX(-40vw)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(110vw)}}
@keyframes lift{0%,100%{transform:none}40%{transform:translateY(-6px)}}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes eq{0%,100%{height:4px}50%{height:19px}}
@keyframes dgIn{0%{opacity:0;transform:translateY(.32em);filter:blur(6px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes dgHour{0%{opacity:0;transform:translateY(.5em) scale(.9);filter:blur(10px)}100%{opacity:1;transform:none;filter:blur(0)}}
@property --p{syntax:"<number>";inherits:true;initial-value:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="glow"></div><div id="sweep"></div>
<div class="app">
  <div class="col">
    <div class="widget" id="clockw"><div id="clock"></div><div id="date"></div></div>
    <div class="widget" id="hello"><div id="hi">Bonjour Deniz</div><div id="wx"></div></div>
    <div class="widget" id="skin"></div>
    <div class="widget" id="eau"></div>
  </div>
  <div class="col">
    <section class="widget" id="cal"><h2>Calendrier</h2><div id="calBody"></div></section>
    <section class="widget" id="rem"><h2>Rappels</h2><div id="remBody"></div></section>
  </div>
  <div class="col">
    <section class="widget" id="gym"><div id="gymBody"></div></section>
    <section class="widget" id="bb">
      <div class="ring" id="bbRing"><span id="bbPct">0%</span></div>
      <div class="info">
        <h2 style="margin-bottom:6px">Bambu Lab A1</h2>
        <div class="tt" id="bbName">—</div>
        <div class="sub" id="bbEta">—</div>
        <div class="temps"><div><b id="bbNozzle">—</b>Buse</div><div><b id="bbBed">—</b>Plateau</div></div>
      </div>
    </section>
    <section class="widget dynw" id="sp">
      <div class="art" id="spArt"></div>
      <div class="info">
        <div class="tt" id="spTitle">—</div><div class="ar" id="spArtist">—</div>
        <div class="prog"><b id="spBar"></b></div>
      </div>
      <div class="eq"><span></span><span></span><span></span><span></span></div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
<script>
/* ═══════════════ CONFIGURATION ═══════════════
   Les intégrations externes (réseau) fonctionnent quand ce fichier est ouvert
   depuis votre propre serveur / appareil. Sans configuration, le mode démo s’affiche.
   Ajoutez #demo à l’adresse pour forcer l’affichage des widgets Bambu et Spotify. */
const CONFIG = {
  prenom: "Deniz",
  meteo: { lat: 45.19, lon: 5.72, ville: "Grenoble" },             // coordonnées (Open-Meteo, sans clé)
  icsWorker: "https://cal-k7x92mqp4v.deniz-walzberg.workers.dev/", // Worker Cloudflare qui lit tes calendriers iCloud
  bambuUrl: "",     // JSON local : {state,progress,remaining_min,nozzle,bed,name} (pont MQTT → HTTP)
  spotifyToken: "", // jeton OAuth Spotify (scope user-read-currently-playing)
  intervalle: { meteo: 600, calendrier: 300, bambu: 10, spotify: 5 } // secondes
};
const DEMO = location.hash.replace("#","") === "demo";
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

/* ── Horloge ── */
/* ── Horloge : chaque chiffre s’anime quand il change ── */
function tick(){
  const d = new Date(), t = pad(d.getHours()) + ":" + pad(d.getMinutes()), el = $("clock");
  if (!el.querySelector(".sep")) el.innerHTML = [...t].map(c => c === ":" ? '<span class="sep">:</span>' : '<span class="dg"></span>').join("");
  [...el.children].forEach((s, i) => {
    if (s.className === "sep" || s.textContent === t[i]) return;
    const premier = s.textContent === "";
    s.textContent = t[i];
    if (!premier){ s.classList.remove("chg", "chgH"); void s.offsetWidth; s.classList.add(i < 2 ? "chgH" : "chg"); }
  });
  $("date").textContent = d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}
tick(); setInterval(tick, 1000);

/* Petits effets occasionnels */
const EFFETS = [["sweep", 2800], ["lift", 1700]];
function effetAuHasard(){
  const [nom, ms] = EFFETS[Math.floor(Math.random() * EFFETS.length)];
  document.body.classList.add("fx-" + nom);
  setTimeout(() => document.body.classList.remove("fx-" + nom), ms);
  setTimeout(effetAuHasard, 25000 + Math.random() * 35000);
}
setTimeout(effetAuHasard, 12000);

/* ── Salutation (texte uniquement) ── */
function majSalut(){
  const h = new Date().getHours();
  $("hi").textContent = (h >= 5 && h < 18 ? "Bonjour" : h >= 18 && h < 22 ? "Bonsoir" : "Bonne nuit") + " " + CONFIG.prenom;
}
majSalut(); setInterval(majSalut, 60000);

/* ── Calendrier ── */
let events = [];
function demoEvents(){
  const n = new Date(), at = (dd,h,m) => { const d = new Date(n); d.setDate(d.getDate()+dd); d.setHours(h,m,0,0); return d; };
  return [
    {n:"Point équipe", s:at(0,9,30),  e:at(0,10,15)},
    {n:"Déjeuner avec Léa", s:at(0,12,30), e:at(0,14,0)},
    {n:"Impression pièce V2", s:at(0,17,0), e:at(0,17,30)},
    {n:"Cinéma", s:at(1,20,45), e:at(1,23,0)}
  ];
}
let calErr = false;
function expandICS(txt, from, to){
  const out = [], comp = new ICAL.Component(ICAL.parse(txt));
  comp.getAllSubcomponents("vtimezone").forEach(tz => { try { ICAL.TimezoneService.register(tz); } catch(_){} });
  const masters = new Map(), exc = [];
  comp.getAllSubcomponents("vevent").forEach(v => {
    const e = new ICAL.Event(v);
    if (e.isRecurrenceException()) exc.push(e); else masters.set(e.uid, e);
  });
  exc.forEach(x => { const m = masters.get(x.uid); if (m) m.relateException(x); });
  const skipBefore = new Date(+from - 2*864e5);
  for (const e of masters.values()){
    const titre = e.summary || "Sans titre";
    if (e.isRecurring()){
      const it = e.iterator(); let next, n = 0;
      while ((next = it.next()) && n++ < 20000){
        const sd = next.toJSDate();
        if (sd > to) break;
        if (sd < skipBefore) continue;
        const d = e.getOccurrenceDetails(next);
        const s = d.startDate.toJSDate(), en = d.endDate.toJSDate();
        if (en >= from && s <= to) out.push({n: d.item.summary || titre, s, e: en});
      }
    } else {
      const s = e.startDate.toJSDate(), en = e.endDate ? e.endDate.toJSDate() : s;
      if (en >= from && s <= to) out.push({n: titre, s, e: en});
    }
  }
  return out;
}
async function loadCal(){
  const from = new Date(Date.now() - 864e5), to = new Date(Date.now() + 60*864e5);
  if (!CONFIG.icsWorker){ events = demoEvents(); }
  else {
    try {
      const res = await fetch(CONFIG.icsWorker);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const cals = await res.json(), merged = [];
      cals.forEach(txt => { try { merged.push(...expandICS(txt, from, to)); } catch(e){ console.warn("Calendrier ignoré :", e); } });
      const seen = new Set();
      events = merged.filter(e => { const k = e.n + "|" + e.s.getTime(); if (seen.has(k)) return false; seen.add(k); return true; });
      calErr = false;
    } catch(e){ console.warn("Calendrier indisponible :", e); calErr = true; }
  }
  events.sort((a, b) => a.s - b.s);
  renderCal();
}
function renderCal(){
  const now = new Date(), sod = new Date(now.getFullYear(), now.getMonth(), now.getDate()), eod = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const hm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
  const duJour = (a, b) => events.filter(e => e.s < b && e.e > a);
  const horaire = e => (e.e - e.s >= 864e5 - 36e5 && e.s.getHours() === 0 && e.s.getMinutes() === 0) ? "Toute la journée" : hm(e.s) + " – " + hm(e.e);
  const ligne = (e, past, orange) => `<div class="ev ${past ? "past" : ""}"><div class="bar"${orange ? ' style="background:var(--orange)"' : ""}></div><div><div class="t">${horaire(e)}</div><div class="n">${esc(e.n)}</div></div></div>`;
  const today = duJour(sod, eod);
  let liste = [], html = "";
  if (today.some(e => e.e > now)){
    // Il reste des événements aujourd'hui : on affiche toute la journée
    liste = today;
    html = today.map(e => ligne(e, e.e <= now, false)).join("");
  } else {
    // Rien (ou journée finie) : tous les événements du prochain jour qui en a
    const nx = events.find(e => e.s >= eod);
    if (nx){
      const d0 = new Date(nx.s.getFullYear(), nx.s.getMonth(), nx.s.getDate()), d1 = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + 1);
      const demain = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      let label = d0.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"});
      label = label.charAt(0).toUpperCase() + label.slice(1);
      if (+d0 === +demain) label = "Demain · " + label;
      liste = duJour(d0, d1);
      html = `<div class="next-label">${label}</div>` + liste.map(e => ligne(e, false, true)).join("");
    } else {
      html = `<div class="empty">${calErr ? "Calendrier indisponible, nouvelle tentative…" : "Rien de prévu prochainement."}</div>`;
    }
  }
  $("calBody").classList.toggle("dense", liste.length > 6);
  $("calBody").innerHTML = html;
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
loadCal(); setInterval(loadCal, CONFIG.intervalle.calendrier*1000); setInterval(renderCal, 60000);

/* ── Rappels (synchronisés depuis l’app Rappels : Raccourci iPad → Worker) ── */
let rappels = null, remErr = false;
function renderRem(){
  if (rappels === null){ $("remBody").innerHTML = `<div class="empty">${remErr ? "Rappels non connectés" : "Chargement…"}</div>`; return; }
  $("remBody").innerHTML = rappels.length
    ? rappels.map(r => `<div class="rm"><div class="dot"></div><div class="l">${esc(r)}</div></div>`).join("")
    : `<div class="empty">Tout est fait.</div>`;
}
async function loadRem(){
  if (!CONFIG.icsWorker){ rappels = ["Sortir les poubelles", "Commander du filament PLA", "Appeler le dentiste"]; return renderRem(); }
  try {
    const res = await fetch(CONFIG.icsWorker.replace(/\/?$/, "/rappels"));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const l = await res.json();
    if (!Array.isArray(l) || l.some(x => typeof x !== "string" || x.startsWith("BEGIN:VCALENDAR"))) throw new Error("Le Worker n’a pas encore la route /rappels");
    remErr = false;
    if (JSON.stringify(l) !== JSON.stringify(rappels)){ rappels = l; renderRem(); }
  } catch(e){ console.warn("Rappels indisponibles :", e); remErr = true; if (rappels === null) renderRem(); }
}
renderRem(); loadRem(); setInterval(loadRem, 60000);

/* ── Skincare (routine envoyée par le Raccourci NFC → Worker) ── */
function renderSkin(s){
  if (!s){ $("skin").innerHTML = ""; return; }
  const n = s.jours.length;
  const dots = s.jours.map((v, i) => `<i class="${v === 1 ? "on" : i === n - 1 ? "now" : v === 0 ? "miss" : ""}"></i>`).join("");
  let txt, cls = s.fait ? "ok" : "";
  if (s.fait) txt = s.streak > 1 ? `${s.streak} jours d’affilée` : "Routine faite";
  else if (s.sans === null) { txt = "Aucune routine enregistrée"; cls = "warn"; }
  else if (s.sans >= 2) { txt = `${s.sans} jours sans routine`; cls = "warn"; }
  else txt = "À faire aujourd’hui" + (s.streak > 0 ? ` · série ${s.streak}` : "");
  $("skin").innerHTML = `<span class="st">Skincare</span><div class="sdots">${dots}</div><span class="sx ${cls}">${txt}</span>`;
}
async function loadSkin(){
  if (!CONFIG.icsWorker) return renderSkin(null);
  try {
    const s = await (await fetch(CONFIG.icsWorker.replace(/\/?$/, "/skincare"))).json();
    renderSkin(s && Array.isArray(s.jours) && typeof s.streak === "number" ? s : null);
  } catch(e){ console.warn("Skincare indisponible :", e); }
}
loadSkin(); setInterval(loadSkin, 60000);

/* ── Hydratation (Raccourci iPhone / Apple Watch / Siri → Worker) ── */
function renderEau(e){
  if (!e){ $("eau").innerHTML = ""; return; }
  const L = ml => (ml / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 2 });
  const s = n => n > 1 ? "s" : "";
  const obj = e.objectif, reste = obj - e.total, n = e.jours.length;
  const maintenant = new Date(), h = maintenant.getHours() + maintenant.getMinutes() / 60;
  const attendu = Math.round(obj * Math.min(1, Math.max(0, (h - 8) / 14)));   // rythme : de 8 h à 22 h
  let statut, cls;
  if (reste <= 0){ statut = "Objectif atteint"; cls = "ok"; }
  else if (h >= 22){ statut = "Objectif non atteint aujourd’hui"; cls = "late"; }
  else if (e.total >= attendu - 125){ statut = "Dans les temps"; cls = "ok"; }
  else { statut = `En retard de ${Math.round((attendu - e.total) / 50) * 50} ml`; cls = "late"; }
  const verres = Math.ceil(reste / 250);
  const restant = reste <= 0 ? `+${L(-reste)} L au-dessus de l’objectif` : `Encore ${verres} verre${s(verres)} de 250 ml`;
  const pct = Math.min(100, Math.round(e.total / obj * 100));
  const repere = reste > 0 && attendu > 0 ? `<u style="left:${Math.round(attendu / obj * 100)}%"></u>` : "";
  const bars = e.jours.map((v, i) => `<i class="${v >= obj ? "ok" : ""} ${i === n - 1 ? "t" : ""}" style="height:${Math.max(6, Math.min(100, Math.round(v / obj * 100)))}%"></i>`).join("");
  const jours = e.jours.map((v, i) => `<span class="${i === n - 1 ? "t" : ""}">${new Date(Date.now() - (n - 1 - i) * 864e5).toLocaleDateString("fr-FR", { weekday: "narrow" }).toUpperCase()}</span>`).join("");
  const atteints = e.jours.filter(v => v >= obj).length, moy = e.jours.reduce((a, b) => a + b, 0) / n;
  $("eau").innerHTML =
    `<div class="eh"><span class="et">Hydratation</span><span class="en">${L(e.total)} <small>/ ${L(obj)} L</small></span></div>` +
    `<div class="ebar"><b class="${reste <= 0 ? "ok" : ""}" style="width:${pct}%"></b>${repere}</div>` +
    `<span class="chip ${cls}">${statut}</span><div class="er">${restant}</div>` +
    `<div class="ew">${bars}</div><div class="el">${jours}</div>` +
    `<div class="es">Semaine : ${atteints} jour${s(atteints)} sur ${n} à l’objectif · moyenne ${L(moy)} L</div>`;
}
async function loadEau(){
  if (!CONFIG.icsWorker) return renderEau(null);
  try {
    const e = await (await fetch(CONFIG.icsWorker.replace(/\/?$/, "/eau"))).json();
    renderEau(e && typeof e.objectif === "number" && Array.isArray(e.jours) ? e : null);
  } catch(err){ console.warn("Eau indisponible :", err); }
}
loadEau(); setInterval(loadEau, 60000);

/* ── Salle (séances envoyées par le Raccourci iPhone → Worker) ── */
function renderGym(g){
  if (!g){ $("gymBody").innerHTML = `<span class="gt">Salle</span><span class="gm">Salle non connectée</span>`; return; }
  const reste = g.objectif - g.count, dispo = 6 - g.today + (g.jours[g.today] ? 0 : 1);
  const s = n => n > 1 ? "s" : "";
  const msg = reste <= 0 ? "Objectif atteint"
    : dispo < reste ? "Objectif difficile cette semaine"
    : dispo === reste ? "Chaque jour compte : il faut y aller !"
    : `Plus que ${reste} séance${s(reste)} cette semaine`;
  let der = "aucune séance enregistrée";
  if (g.derniere){
    const j = Math.round((new Date(new Date().toLocaleDateString("fr-CA")) - new Date(g.derniere)) / 864e5);
    der = "dernière séance " + (j <= 0 ? "aujourd’hui" : j === 1 ? "hier" : "il y a " + j + " jours");
  }
  const segs = Array.from({length: g.objectif}, (_, i) => `<i class="${i < g.count ? "on" : ""}"></i>`).join("");
  $("gymBody").innerHTML =
    `<span class="gt">Salle</span><div class="gbar">${segs}</div><span class="gn">${g.count}/${g.objectif}</span>` +
    `<span class="gm">${msg}</span>` +
    `<span class="gs">${g.streak > 0 ? `${g.streak} semaine${s(g.streak)} d’affilée · ` : ""}${der}</span>`;
}
async function loadGym(){
  if (!CONFIG.icsWorker) return renderGym(null);
  try {
    const g = await (await fetch(CONFIG.icsWorker.replace(/\/?$/, "/salle"))).json();
    renderGym(g && typeof g.objectif === "number" && Array.isArray(g.jours) ? g : null);
  } catch(e){ console.warn("Salle indisponible :", e); }
}
renderGym(null); loadGym(); setInterval(loadGym, 60000);

/* ── Météo ── */
const WX = {0:["☀️","Ensoleillé"],1:["🌤️","Plutôt dégagé"],2:["⛅","Partiellement nuageux"],3:["☁️","Couvert"],45:["🌫️","Brouillard"],48:["🌫️","Brouillard"],
  51:["🌦️","Bruine"],53:["🌦️","Bruine"],55:["🌦️","Bruine"],61:["🌧️","Pluie"],63:["🌧️","Pluie"],65:["🌧️","Forte pluie"],
  71:["🌨️","Neige"],73:["🌨️","Neige"],75:["❄️","Forte neige"],80:["🌦️","Averses"],81:["🌦️","Averses"],82:["⛈️","Fortes averses"],95:["⛈️","Orage"],96:["⛈️","Orage"],99:["⛈️","Orage"]};
function renderWx(t, code){
  const [ic, txt] = WX[code] || ["🌡️", "—"];
  $("wx").textContent = Math.round(t) + "° · " + txt + " · " + CONFIG.meteo.ville;
}
async function loadWx(){
  try {
    const {lat,lon} = CONFIG.meteo;
    const r = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`)).json();
    renderWx(r.current.temperature_2m, r.current.weather_code);
  } catch(e){ console.warn("Météo indisponible :", e); }
}
loadWx(); setInterval(loadWx, CONFIG.intervalle.meteo*1000);

/* ── Zone dynamique : Bambu & Spotify ── */
const show = (id,on) => $(id).classList.toggle("show", on);
function renderBambu(d){
  const st = d && d.state ? String(d.state).toUpperCase() : "";
  const libelles = { RUNNING: "En cours", PREPARE: "Préparation", SLICING: "Préparation", PAUSE: "En pause", FINISH: "Terminée", FAILED: "Échec", IDLE: "Au repos" };
  const joignable = !!d && st !== "" && !["OFFLINE", "ERROR", "AUTH_ERROR"].includes(st);
  const actif = joignable && ["RUNNING", "PREPARE", "PAUSE"].includes(st) && typeof d.progress === "number";
  const prog = actif ? Math.min(100, Math.max(0, d.progress)) : (joignable && st === "FINISH" ? 100 : 0);
  $("bbRing").style.setProperty("--p", prog);
  $("bbPct").textContent = actif ? Math.round(prog) + "%" : (joignable ? (libelles[st] || "Au repos") : "Hors ligne");
  $("bbName").textContent = joignable && d.name ? d.name : "—";
  const m = d && d.remaining_min;
  const reste = m > 0 ? "Reste " + (m >= 60 ? Math.floor(m / 60) + " h " + pad(m % 60) + " min" : m + " min") : "Presque fini";
  $("bbEta").textContent = !joignable ? "Imprimante injoignable"
    : actif ? (st === "PAUSE" ? "En pause · " : "") + reste
    : st === "FINISH" ? "Dernière impression terminée"
    : st === "FAILED" ? "Dernière impression échouée" : "Prête à imprimer";
  $("bbNozzle").textContent = joignable && typeof d.nozzle === "number" ? Math.round(d.nozzle) + "°" : "—";
  $("bbBed").textContent = joignable && typeof d.bed === "number" ? Math.round(d.bed) + "°" : "—";
}
async function loadBambu(){
  if (DEMO) return renderBambu({state:"RUNNING",progress:64,remaining_min:87,nozzle:220,bed:60,name:"Support_casque_v3.3mf"});
  const u = CONFIG.bambuUrl || (CONFIG.icsWorker && CONFIG.icsWorker.replace(/\/?$/, "/bambu"));
  if (!u) return renderBambu(null);
  try { renderBambu(await (await fetch(u)).json()); } catch(e){ renderBambu(null); }
}
function renderSpotify(d){
  const ok = d && d.is_playing && d.item;
  show("sp", !!ok); if (!ok) return;
  $("spTitle").textContent = d.item.name;
  $("spArtist").textContent = d.item.artists.map(a => a.name).join(", ");
  const img = d.item.album && d.item.album.images && d.item.album.images[0];
  $("spArt").style.backgroundImage = img ? `url(${img.url})` : "";
  $("spBar").style.width = (d.progress_ms / d.item.duration_ms * 100) + "%";
}
async function loadSpotify(){
  if (DEMO) return renderSpotify({is_playing:true,progress_ms:95000,item:{name:"Midnight City",artists:[{name:"M83"}],duration_ms:243000,album:{images:[]}}});
  const u = CONFIG.spotifyUrl || (CONFIG.icsWorker && CONFIG.icsWorker.replace(/\/?$/, "/spotify"));
  if (!u) return renderSpotify(null);
  try { renderSpotify(await (await fetch(u)).json()); } catch(e){ renderSpotify(null); }
}
loadBambu(); loadSpotify();
setInterval(loadBambu, CONFIG.intervalle.bambu*1000);
setInterval(loadSpotify, CONFIG.intervalle.spotify*1000);
addEventListener("hashchange", () => { loadBambu(); loadSpotify(); });

/* Plein écran : au premier toucher dans Safari (inutile une fois ajouté à l’écran d’accueil) */
document.addEventListener("pointerdown", () => {
  try {
    const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f && !navigator.standalone && !document.fullscreenElement && !document.webkitFullscreenElement){ const p = f.call(el); if (p && p.catch) p.catch(() => {}); }
  } catch(_){}
}, { once: true });

/* Garde l’écran allumé quand c’est possible */
try { navigator.wakeLock && navigator.wakeLock.request("screen"); } catch(_){}
