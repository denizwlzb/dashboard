<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#1c1c1e">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dashboard Deniz</title>
<style>
:root{--t1:#fff;--t2:rgba(255,255,255,.68);--t3:rgba(255,255,255,.42);--line:rgba(255,255,255,.12);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--ease:cubic-bezier(.32,.72,0,1)}
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;font-weight:400;font-size:17px;letter-spacing:-.022em;color:var(--t1);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(60% 50% at 10% 6%,rgba(10,132,255,.30),transparent 70%),radial-gradient(50% 45% at 94% 10%,rgba(191,90,242,.24),transparent 70%),radial-gradient(60% 50% at 82% 100%,rgba(48,209,88,.14),transparent 70%),linear-gradient(180deg,#0b0c12,#050507)}

/* En-tête permanent : l'heure est visible sur toutes les pages */
#top{position:fixed;top:0;left:0;right:0;z-index:5;height:88px;display:flex;align-items:center;justify-content:space-between;padding:12px 30px 0}
#clock{display:flex;align-items:baseline;font-size:54px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
#clock .dg{display:inline-block;min-width:.58em;text-align:center}
#clock .sep{opacity:.5;margin:0 .03em;transform:translateY(-.05em)}
#clock .chg{animation:dgIn .7s var(--ease) both}
#clock .chgH{animation:dgHour 1s var(--ease) both}
#date{font-size:15px;font-weight:500;color:var(--t2);margin-top:2px;letter-spacing:-.01em;text-transform:capitalize}
#hi{font-size:17px;font-weight:600;color:var(--t2)}

/* Pages */
#pager{position:absolute;z-index:2;top:88px;left:0;right:0;bottom:0;overflow:hidden;touch-action:pan-y}
#track{display:flex;height:100%;width:100%;will-change:transform}
.page{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;padding:10px 30px 112px;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.page::-webkit-scrollbar{display:none}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .25s cubic-bezier(.32,.72,0,1)}
.tap:active{transform:scale(.97)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:stretch}

/* Liquid glass */
.g{position:relative;background:rgba(255,255,255,.075);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:1px solid rgba(255,255,255,.13);border-radius:26px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.05),0 8px 28px rgba(0,0,0,.35);padding:16px 18px;overflow:hidden}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 72%,rgba(255,255,255,.05));pointer-events:none}
.g>*{position:relative}
.gl{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:8px}
.big{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.sub{font-size:14px;color:var(--t2);margin-top:4px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--green);transition:width .8s var(--ease)}

/* Accueil */
#weekw{grid-column:span 5} #mw{grid-column:span 4} #gym{grid-column:span 3}
#spw{grid-column:span 7} #bb{grid-column:span 5}
#week{display:flex;gap:8px}
#week .wd{flex:1;max-width:46px;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;align-content:center;line-height:1}
#week .wd small{font-size:10px;color:var(--t2)}
#week .wd b{font-size:16px;font-weight:600}
#week .wd.now{background:var(--blue)}
#gymBody{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 10px}
#gym .gt{grid-column:1;grid-row:1;font-size:13px;font-weight:600;color:var(--t2)}
#gym .gn{grid-column:2;grid-row:1;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
#gym .gbar{grid-column:1/-1;grid-row:2;display:flex;gap:6px}
#gym .gbar i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.16);transition:background .7s var(--ease)}
#gym .gbar i.on{background:var(--orange)}
#gym .gm{grid-column:1/-1;grid-row:3;font-size:14px}
#gym .gs{display:none}
#spw{cursor:pointer;display:flex;flex-direction:column;gap:8px}
.sprow{display:flex;align-items:center;gap:12px}
#sArt{width:54px;height:54px;border-radius:12px;flex:none;background:rgba(255,255,255,.12) center/cover}
.stx{flex:1;min-width:0}
#sTitle{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sArtist{display:block;font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vizMic{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;display:grid;place-items:center;cursor:pointer;-webkit-appearance:none;appearance:none}
#vizMic svg{width:16px;height:16px;fill:var(--t2)}
#vizMic.on{border-color:var(--green)}
#vizMic.on svg{fill:var(--green)}
#viz{width:100%;height:56px;display:block}
#vizHint{font-size:11px;color:var(--t3);min-height:13px;text-align:center}
#spw.paused .stx{opacity:.6}

/* Météo */
#mnow{grid-column:span 5} #mhour{grid-column:span 7} #fcw{grid-column:span 7} #sky{grid-column:span 5}
.huge{font-size:84px;font-weight:300;letter-spacing:-.04em;line-height:1}
.cond{font-size:20px;font-weight:500;margin-top:6px}
#wxh{display:flex;gap:8px}
.hr{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.08);border-radius:16px;padding:10px 0}
.hr span{font-size:12px;color:var(--t2)}
.hr i{font-style:normal;font-size:24px;line-height:1.2}
.hr b{font-size:17px;font-weight:600}
#fc{display:flex;gap:10px}
.fd{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.08);border-radius:18px;padding:12px 0}
.fd span{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--t2)}
.fd.now span{color:var(--blue)}
.fd i{font-style:normal;font-size:28px;line-height:1.1}
.fd b{font-size:20px;font-weight:600}
.fd small{font-size:14px;color:var(--t2)}
.fog{display:inline-block;width:1em;height:1em;vertical-align:-.12em}
.skyb{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;align-content:center}
.sk{display:flex;flex-direction:column;gap:2px}
.sk small{font-size:13px;color:var(--t2)}
.sk b{font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.mn{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.mn svg{width:52px;height:52px;flex:none}
.mn svg circle{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.5)}
.mn b{display:block;font-size:18px;font-weight:600}
.mn small{font-size:13px;color:var(--t2)}

/* Musique : clip ou pochette + paroles */
#player{position:relative;height:100%}
#pbg{position:fixed;inset:-60px;z-index:0;background:center/cover;filter:blur(70px) brightness(.38) saturate(1.3)}
#pgMusique:not(.on) #pbg{display:none}
#pgMusique{--dispo:calc(100vh - 520px)}
.pmain{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;height:100%}
.pcol{min-width:0;display:flex;flex-direction:column;min-height:0}
.pmedia{position:relative;aspect-ratio:1;width:min(100%,max(130px,var(--dispo)));margin:0 auto 12px;padding:0;flex:none;transition:width .4s var(--ease)}
#player.vid .pmedia{aspect-ratio:16/9;width:min(100%,max(220px,calc(var(--dispo)*1.7778)))}
#pcover{position:absolute;inset:0;background:center/cover}
#player.vid #pcover{display:none}
#pvideo{position:absolute;inset:0;display:none}
#player.vid #pvideo{display:block}
#pvideo iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#pmsg{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:14px;color:var(--t2)}
.pdev{font-size:14px;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.pdev:empty{display:none}
.pdev::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
#pTitle{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.03em}
#pArtist{font-size:18px;color:var(--t2);margin-top:4px}
.pprog{margin-top:18px}
.pbar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;cursor:pointer}
.pbar b{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.ptimes{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-top:6px;font-variant-numeric:tabular-nums}
.pctl{display:flex;align-items:center;justify-content:center;gap:30px;margin-top:12px}
.pctl button{border:0;background:transparent;color:#fff;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.pctl button svg{width:30px;height:30px;fill:currentColor}
#pPlay{background:#fff!important;color:#000!important;width:76px!important;height:76px!important}
#pPlay svg{width:36px;height:36px}
#pPlay .i-pause{display:none}#pPlay.on .i-play{display:none}#pPlay.on .i-pause{display:block}
.pseg{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:99px;padding:4px;width:max-content;margin:14px auto 0}
.pseg button{border:0;background:transparent;color:var(--t2);font:inherit;font-size:14px;font-weight:600;padding:7px 20px;border-radius:99px;cursor:pointer}
.pseg button.on{background:#fff;color:#000}
#lyrw{padding:0;height:100%;min-height:0}
#lyr{height:100%;overflow-y:auto;padding:22px 24px;scrollbar-width:none}
#lyr::-webkit-scrollbar{display:none}
.ll{font-size:26px;font-weight:700;line-height:1.25;letter-spacing:-.02em;color:rgba(255,255,255,.3);margin:0 0 14px;transition:color .3s}
.ll.cur{color:#fff}
.ll.past{color:rgba(255,255,255,.48)}
.ll.pl{font-size:21px;font-weight:600;color:rgba(255,255,255,.8)}
.lmsg{color:var(--t3);font-size:18px}

/* Imprimante : caméra (seulement quand cette page est ouverte) + état */
.ring{position:relative;display:flex;flex-direction:column;transition:--p 1s linear;margin:4px 0 12px}
.ring span{order:1;font-size:34px;font-weight:600;line-height:1;margin-bottom:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring::before,.ring::after{content:"";height:6px;border-radius:3px}
.ring::before{order:2;background:rgba(255,255,255,.16)}
.ring::after{position:absolute;left:0;bottom:0;width:calc(var(--p,0)*1%);background:var(--green)}
#bb .tt{font-size:17px;font-weight:600}
#bb .sub{font-size:14px;color:var(--t2);margin-top:2px}
.temps{display:flex;gap:8px;margin-top:12px}
.temps div{flex:1;background:rgba(255,255,255,.1);border-radius:14px;padding:8px 12px;font-size:12px;color:var(--t2)}
.temps b{display:block;font-size:18px;color:#fff;font-weight:600}
#bbTimer{margin-top:14px;width:100%;font:inherit;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:10px 14px;text-align:center;cursor:pointer;-webkit-appearance:none;appearance:none;line-height:1.2}
#bbTimer[hidden]{display:none}
#bbTimer small{display:block;font-size:11px;color:var(--t2)}
#bbTimer b{display:block;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
#bbTimer.on{border-color:var(--orange)}
#alarme{position:fixed;inset:0;z-index:200;background:#000;display:none;align-items:center;justify-content:center;text-align:center;cursor:pointer}
#alarme.on{display:flex;animation:alarme 1.2s ease-in-out infinite}
#alarme b{display:block;font-size:clamp(34px,8vw,56px);font-weight:300;letter-spacing:-.02em}
#alarme span{display:block;margin-top:14px;font-size:18px;color:var(--t2)}
@keyframes alarme{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,159,10,0)}50%{box-shadow:inset 0 0 140px 10px rgba(255,159,10,.35)}}

/* Barre d'onglets façon Raccourcis, en verre */
#tabbar{--tbw:112px;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:flex;gap:4px;padding:6px;border-radius:36px;background:rgba(44,44,48,.5);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 30px rgba(0,0,0,.5)}
.tb{position:relative;width:var(--tbw);height:58px;border:0;border-radius:30px;background:transparent;color:var(--t2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:11px;font-weight:600;letter-spacing:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .3s var(--ease),color .3s var(--ease)}
.tb svg{width:24px;height:24px;fill:currentColor}
#tabhl{position:absolute;top:6px;left:6px;width:var(--tbw);height:58px;border-radius:30px;background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);pointer-events:none;will-change:transform}
.tb.on{color:var(--blue)}
.tb:active{transform:scale(.94)}

@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes dgIn{0%{opacity:0;transform:translateY(.32em);filter:blur(6px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes dgHour{0%{opacity:0;transform:translateY(.5em) scale(.9);filter:blur(10px)}100%{opacity:1;transform:none;filter:blur(0)}}
@property --p{syntax:"<number>";inherits:true;initial-value:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

/* Largeur moyenne ou petite (écran partagé) */
@media (max-width:1000px){
  #pages{padding:8px 18px 118px}
  #top{padding:12px 18px 0}
  #weekw{grid-column:span 7} #mw{grid-column:span 5} #gym{grid-column:span 5} #spw{grid-column:span 7} #bb{grid-column:span 5}
  #mnow{grid-column:span 12} #mhour{grid-column:span 12} #fcw{grid-column:span 12} #sky{grid-column:span 12}
  .pmain{grid-template-columns:1fr}
  .page#pgMusique .pmain{height:auto}
  #lyrw{height:380px}
  #tabbar{--tbw:96px}
}
@media (max-width:640px){
  .grid>*{grid-column:span 12!important}
  #tabbar{--tbw:80px}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="alarme"><div><b>Pièce refroidie</b><span>Appuie pour arrêter</span></div></div>
<header id="top">
  <div class="tl"><div id="clock"></div><div id="date"></div></div>
  <div id="hi">Bonjour Deniz</div>
</header>
<main id="pager"><div id="track">
  <section class="page on" id="pgHome"><div class="grid">
    <div class="g" id="weekw"><div class="gl">Cette semaine</div><div id="week"></div></div>
    <div class="g tap" id="mw"><div class="gl">Météo</div><div id="wxT" class="big">--°</div><div id="wx" class="sub"></div></div>
    <div class="g" id="gym"><div id="gymBody"></div></div>
    <div class="g tap" id="spw">
      <div class="sprow"><div id="sArt"></div><div class="stx"><b id="sTitle">Spotify</b><span id="sArtist">Rien en lecture</span></div>
        <button id="vizMic" aria-label="Activer le visualiseur (micro)"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12z"/></svg></button></div>
      <canvas id="viz"></canvas><div id="vizHint"></div>
    </div>
    <div class="g" id="bb"><div class="gl">Bambu Lab A1</div>
      <div class="ring" id="bbRing"><span id="bbPct">0%</span></div>
      <div class="tt" id="bbName">—</div><div class="sub" id="bbEta">—</div>
      <div class="temps"><div><b id="bbNozzle">—</b>Buse</div><div><b id="bbBed">—</b>Plateau</div></div>
      <button id="bbTimer" hidden></button></div>
  </div></section>
  <section class="page" id="pgMeteo"><div class="grid">
    <div class="g" id="mnow"><div class="gl">Maintenant</div><div id="wxBigT" class="huge">--°</div><div id="wxBigC" class="cond"></div><div id="wxBigV" class="sub"></div></div>
    <div class="g" id="mhour"><div class="gl">Heure par heure</div><div id="wxh"></div></div>
    <div class="g" id="fcw"><div class="gl">Prévisions</div><div id="fc"></div></div>
    <div class="g" id="sky"><div class="gl">Ciel</div><div class="skyb">
      <div class="sk"><small>Lever</small><b id="sunr">--:--</b></div>
      <div class="sk"><small>Coucher</small><b id="suns">--:--</b></div>
      <div class="mn"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36" stroke-width="1.5"/><path id="moonlit" fill="#fff"/></svg><div><b id="moonname"></b><small id="moonpct"></small></div></div>
    </div></div>
  </div></section>
  <section class="page" id="pgMusique"><div id="player"><div id="pbg"></div>
    <div class="pmain">
      <div class="pcol">
        <div class="pmedia g"><div id="pcover"></div><div id="pvideo"><div id="ytp"></div></div><div id="pmsg"></div></div>
        <div class="pinfo">
          <div class="pdev" id="pdev"></div>
          <div id="pTitle">Rien en lecture</div><div id="pArtist"></div>
          <div class="pprog"><div class="pbar" id="pbar"><b id="pFill"></b></div><div class="ptimes"><span id="pCur">0:00</span><span id="pTot">0:00</span></div></div>
          <div class="pctl">
            <button id="pPrev" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M18 6l-9 6 9 6zM5 6h2v12H5z"/></svg></button>
            <button id="pPlay" aria-label="Lecture / pause"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
            <button id="pNext" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zM17 6h2v12h-2z"/></svg></button>
          </div>
          <div class="pseg"><button id="segCover" class="on">Pochette</button><button id="segVideo">Clip</button></div>
        </div>
      </div>
      <div class="g" id="lyrw"><div id="lyr"><div class="lmsg">Les paroles apparaîtront ici</div></div></div>
    </div>
  </div></section>
</div></main>
<nav id="tabbar"><i id="tabhl"></i>
  <button class="tb on" data-page="accueil"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Accueil</button>
  <button class="tb" data-page="meteo"><svg viewBox="0 0 24 24"><path d="M19.36 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.64-4.96z"/></svg>Météo</button>
  <button class="tb" data-page="musique"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>Musique</button>
</nav>
<script>
/* ═══════════════ CONFIGURATION ═══════════════
   Les intégrations externes (réseau) fonctionnent quand ce fichier est ouvert
   depuis votre propre serveur / appareil. Sans configuration, le mode démo s’affiche.
   Ajoutez #demo à l’adresse pour forcer l’affichage des widgets Bambu et Spotify. */
const CONFIG = {
  prenom: "Deniz",
  meteo: { lat: 45.19, lon: 5.72, ville: "Grenoble" },             // coordonnées (Open-Meteo, sans clé)
  icsWorker: "https://cal-k7x92mqp4v.deniz-walzberg.workers.dev/", // Worker Cloudflare qui lit tes calendriers iCloud
  bambuUrl: "",     // JSON local : {state,progress,remaining_min,nozzle,bed,name} (pont MQTT → HTTP)
  spotifyToken: "", // jeton OAuth Spotify (scope user-read-currently-playing)

/* ── Lune ── */
function lune(t){
  const ref = Date.UTC(2000, 0, 6, 18, 14), cycle = 29.530588853 * 864e5;
  const p = (((t - ref) / cycle) % 1 + 1) % 1, illum = (1 - Math.cos(2 * Math.PI * p)) / 2;
  const noms = ["Nouvelle lune", "Premier croissant", "Premier quartier", "Gibbeuse croissante", "Pleine lune", "Gibbeuse décroissante", "Dernier quartier", "Dernier croissant"];
  return { p, illum, nom: noms[Math.floor(p * 8 + .5) % 8] };
}
function majLune(){
  const L = lune(Date.now()), r = 36, c = 40, rx = Math.abs(Math.cos(2 * Math.PI * L.p)) * r;
  const croit = L.p < .5, limbe = croit ? 1 : 0, term = croit ? (L.p < .25 ? 0 : 1) : (L.p < .75 ? 0 : 1);
  $("moonlit").setAttribute("d", `M ${c} ${c - r} A ${r} ${r} 0 0 ${limbe} ${c} ${c + r} A ${rx.toFixed(2)} ${r} 0 0 ${term} ${c} ${c - r} Z`);
  $("moonname").textContent = L.nom; $("moonpct").textContent = Math.round(L.illum * 100) + " % éclairée";
}

/* ── Visualiseur : le micro de l’iPad écoute la pièce, les basses font monter la gauche de la barre ── */
const viz = (() => {
  const N = 32, FMIN = 40, FMAX = 12000, lisse = new Float32Array(N);
  let ac = null, an = null, data = null, flux = null, raf = 0, actif = false, joue = false, pic = .25, dernier = 0, ctx2 = null, W = 0, H = 0;
  function bandes(d, fe, fft){
    const out = new Float32Array(N), bin = fe / fft;
    for (let i = 0; i < N; i++){
      const lo = Math.max(1, Math.floor(FMIN * Math.pow(FMAX / FMIN, i / N) / bin)), hi = Math.max(lo + 1, Math.ceil(FMIN * Math.pow(FMAX / FMIN, (i + 1) / N) / bin));
      let m = 0; for (let k = lo; k < hi && k < d.length; k++) if (d[k] > m) m = d[k];
      out[i] = m / 255;
    }
    return out;
  }
  function adoucir(v){
    let max = 0; for (let i = 0; i < N; i++) if (v[i] > max) max = v[i];
    pic = Math.max(pic * .995, max, .25);
    for (let i = 0; i < N; i++){ const x = Math.min(1, v[i] / pic); lisse[i] = x > lisse[i] ? lisse[i] + (x - lisse[i]) * .6 : lisse[i] * .86; }
  }
  function taille(){
    const c = $("viz"), r = c.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height; c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    ctx2 = c.getContext("2d"); ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function dessiner(repos){
    if (!ctx2) taille();
    ctx2.clearRect(0, 0, W, H);
    const gap = 3, w = (W - gap * (N - 1)) / N;
    for (let i = 0; i < N; i++){
      const h = repos ? 3 : Math.max(3, lisse[i] * H);
      ctx2.fillStyle = repos ? "rgba(255,255,255,.35)" : (i < 8 ? "#fff" : "rgba(255,255,255,.62)");
      ctx2.fillRect(i * (w + gap), H - h, w, h);
    }
  }
  function boucle(t){
    raf = 0; if (!actif || !joue) return;
    raf = requestAnimationFrame(boucle);
    if (t - dernier < 33) return; dernier = t;
    an.getByteFrequencyData(data); adoucir(bandes(data, ac.sampleRate, an.fftSize)); dessiner(false);
  }
  function maj(){
    $("vizMic").classList.toggle("on", actif);
    $("vizHint").textContent = joue && !actif ? "Touche le micro pour animer" : "";
    if (actif && joue){ if (!raf) raf = requestAnimationFrame(boucle); }
    else { lisse.fill(0); dessiner(true); }
  }
  async function activer(){
    try {
      flux = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") await ac.resume();
      an = ac.createAnalyser(); an.fftSize = 2048; an.minDecibels = -90; an.maxDecibels = -20; an.smoothingTimeConstant = .5;
      ac.createMediaStreamSource(flux).connect(an); data = new Uint8Array(an.frequencyBinCount); actif = true;
      try { localStorage.setItem("vizMicro", "1"); } catch(_){}
    } catch(e){ $("vizHint").textContent = "Micro refusé ou indisponible"; actif = false; return; }
    maj();
  }
  function desactiver(){
    try { flux && flux.getTracks().forEach(t => t.stop()); ac && ac.close(); } catch(_){}
    flux = ac = an = null; actif = false; try { localStorage.removeItem("vizMicro"); } catch(_){} maj();
  }
  $("vizMic").onclick = e => { e.stopPropagation(); actif ? desactiver() : activer(); };
  addEventListener("resize", () => { taille(); if (!(actif && joue)) dessiner(true); });
  return { jouer(v){ joue = !!v; maj(); }, bandes, adoucir, lisse, N };
})();

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let lyr = { cle: "", lignes: [], sync: false, idx: -1 };
function parseLrc(s){
  return s.split("\n").map(l => { const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/); return m ? { t: (+m[1]) * 60 + parseFloat(m[2]), texte: m[3] } : null; }).filter(x => x && x.texte.trim() !== "");
}
function dessinerParoles(){
  $("lyr").innerHTML = lyr.lignes.map((l, i) => `<div class="ll${lyr.sync ? "" : " pl"}">${esc(l.texte)}</div>`).join("");
  lyr.idx = -1; majParoles();
}
async function chargerParoles(){
  const it = sp && sp.item; if (!it || !WK) return;

  $("lyr").innerHTML = '<div class="lmsg">Recherche des paroles…</div>';
  try {
    const q = new URLSearchParams({ artist: it.artists[0].name, track: it.name, dur: Math.round(it.duration_ms / 1000) });
    const r = await (await fetch(WK + "/paroles?" + q)).json();
    if (lyr.cle !== it.id) return;
    if (r.synced){ lyr.sync = true; lyr.lignes = parseLrc(r.synced); dessinerParoles(); }
    else if (r.plain){ lyr.lignes = r.plain.split("\n").filter(t => t.trim()).map(t => ({ t: -1, texte: t })); dessinerParoles(); }
    else $("lyr").innerHTML = '<div class="lmsg">' + (r.instrumental ? "Morceau instrumental" : "Pas de paroles trouvées pour ce titre") + '</div>';
  } catch(e){ $("lyr").innerHTML = '<div class="lmsg">Paroles indisponibles</div>'; }
}
function majParoles(){

function renderBambu(d){
  const st = d && d.state ? String(d.state).toUpperCase() : "";
  const libelles = { RUNNING: "En cours", PREPARE: "Préparation", SLICING: "Préparation", PAUSE: "En pause", FINISH: "Terminée", FAILED: "Échec", IDLE: "Au repos" };
  const joignable = !!d && st !== "" && !["OFFLINE", "ERROR", "AUTH_ERROR"].includes(st);
  const actif = joignable && ["RUNNING", "PREPARE", "PAUSE"].includes(st) && typeof d.progress === "number";
  const prog = actif ? Math.min(100, Math.max(0, d.progress)) : (joignable && st === "FINISH" ? 100 : 0);
  $("bbRing").style.setProperty("--p", prog);
  $("bbPct").textContent = actif ? Math.round(prog) + "%" : (joignable ? (libelles[st] || "Au repos") : "Hors ligne");
  $("bbName").textContent = joignable && d.name ? d.name : "—";
  const m = d && d.remaining_min;
  const reste = m > 0 ? "Reste " + (m >= 60 ? Math.floor(m / 60) + " h " + pad(m % 60) + " min" : m + " min") : "Presque fini";
  $("bbEta").textContent = !joignable ? "Imprimante injoignable"
    : actif ? (st === "PAUSE" ? "En pause · " : "") + reste
    : st === "FINISH" ? "Dernière impression terminée"
    : st === "FAILED" ? "Dernière impression échouée" : "Prête à imprimer";
  $("bbNozzle").textContent = joignable && typeof d.nozzle === "number" ? Math.round(d.nozzle) + "°" : "—";
  $("bbBed").textContent = joignable && typeof d.bed === "number" ? Math.round(d.bed) + "°" : "—";
  majMinuteur(d);
}
async function loadBambu(){
  if (DEMO) return renderBambu({state:"RUNNING",progress:64,remaining_min:87,nozzle:220,bed:60,name:"Support_casque_v3.3mf"});
  const u = CONFIG.bambuUrl || (CONFIG.icsWorker && CONFIG.icsWorker.replace(/\/?$/, "/bambu"));
  if (!u) return renderBambu(null);
  try { renderBambu(await (await fetch(u)).json()); } catch(e){ renderBambu(null); }
}
loadBambu(); loadSpotify();
setInterval(loadBambu, CONFIG.intervalle.bambu*1000);

addEventListener("hashchange", () => { loadBambu(); loadSpotify(); });

/* ── Minuteur de refroidissement : fin d’impression + 15 min, avec sonnerie ── */
const REFROID = 15;
var bbDernier = null, minuteur = null, audioCtx = null, alarmeTimer = 0, armeAnnul = 0;
try { minuteur = JSON.parse(localStorage.getItem("minuteurBambu") || "null"); } catch(_){}
const sauveMinuteur = () => { try { minuteur ? localStorage.setItem("minuteurBambu", JSON.stringify(minuteur)) : localStorage.removeItem("minuteurBambu"); } catch(_){} };
const fmtReste = ms => { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + " h " + pad(m) + " min" : m + ":" + pad(s % 60); };
function etatBambu(d){ const st = d && d.state ? String(d.state).toUpperCase() : ""; return { st, actif: ["RUNNING", "PREPARE", "PAUSE"].includes(st) && typeof d.progress === "number", fini: st === "FINISH" }; }
function boutonMinuteur(){
  const b = $("bbTimer"), { actif, fini } = etatBambu(bbDernier);
  if (minuteur){
    b.hidden = false; b.classList.add("on");
    b.innerHTML = armeAnnul ? "<small>Annuler ?</small><b>Appuie encore</b>" : "<small>Sonne dans</small><b>" + fmtReste(minuteur.fin - Date.now()) + "</b>";
    return;
  }
  b.classList.remove("on");
  if (actif){ b.hidden = false; b.innerHTML = "<small>Minuteur</small><b>Fin + " + REFROID + " min</b>"; }
  else if (fini){ b.hidden = false; b.innerHTML = "<small>Minuteur</small><b>" + REFROID + " min</b>"; }
  else b.hidden = true;
}
function majMinuteur(d){
  bbDernier = d; const { st, actif } = etatBambu(d);
  if (minuteur && minuteur.suivi){
    if (actif){ minuteur.fin = Date.now() + ((d.remaining_min || 0) + REFROID) * 60000; sauveMinuteur(); }
    else if (["FINISH", "FAILED", "IDLE"].includes(st)){ minuteur.termine = Date.now(); minuteur.fin = Date.now() + REFROID * 60000; minuteur.suivi = false; sauveMinuteur(); }
  }
  boutonMinuteur();
}
function deverrouillerSon(){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch(_){} }
function bip(n){
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  for (let i = 0; i < n; i++){
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + i * .3;
    o.type = "sine"; o.frequency.value = 880; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.4, t + .02); g.gain.linearRampToValueAtTime(0, t + .22);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + .25);
  }
}
function sonner(){
  $("alarme").classList.add("on"); deverrouillerSon(); bip(3);
  let n = 0; alarmeTimer = setInterval(() => { bip(3); if (++n > 50) arreterAlarme(); }, 1500);
}
function arreterAlarme(){ clearInterval(alarmeTimer); $("alarme").classList.remove("on"); minuteur = null; sauveMinuteur(); boutonMinuteur(); }
$("alarme").onclick = arreterAlarme;
$("bbTimer").onclick = () => {
  if (minuteur){
    if (armeAnnul){ clearTimeout(armeAnnul); armeAnnul = 0; minuteur = null; sauveMinuteur(); }
    else armeAnnul = setTimeout(() => { armeAnnul = 0; boutonMinuteur(); }, 3000);
    boutonMinuteur(); return;
  }
  const { actif, fini } = etatBambu(bbDernier); if (!actif && !fini) return;
  deverrouillerSon();
  minuteur = { fin: Date.now() + ((actif ? (bbDernier.remaining_min || 0) : 0) + REFROID) * 60000, suivi: actif, termine: fini ? Date.now() : 0 };
  sauveMinuteur(); bip(1); boutonMinuteur();
};
setInterval(() => { if (!minuteur) return; if (Date.now() >= minuteur.fin && !$("alarme").classList.contains("on")) sonner(); else boutonMinuteur(); }, 1000);
boutonMinuteur();

/* ── Pages : on les fait glisser de gauche à droite, comme sur iOS ── */
const ORDRE = ["accueil", "meteo", "musique"];
const PAGES = { accueil: "pgHome", meteo: "pgMeteo", musique: "pgMusique" };
const TB = [...document.querySelectorAll(".tb")];
var pageCourante = "accueil", dernierToucher = Date.now(), idx = 0, drag = null, clicBloque = false;
const largeur = () => $("pager").clientWidth || window.innerWidth || 1;
function surbrillance(p){
  const pas = TB[1] ? (TB[1].offsetLeft - TB[0].offsetLeft) || (TB[0].offsetWidth + 4) : 0;
  $("tabhl").style.transform = "translate3d(" + (p * pas) + "px,0,0)";
}
function poser(x, animer){
  const t = $("track");
  t.style.transition = animer ? "transform .5s cubic-bezier(.32,.72,0,1)" : "none";
  t.style.transform = "translate3d(" + x + "px,0,0)";
  const tl = $("tabhl"); tl.style.transition = animer ? "transform .5s cubic-bezier(.32,.72,0,1)" : "none";
  surbrillance(-x / largeur());
}
function allerPage(nom){
  const i = ORDRE.indexOf(nom); if (i < 0) return;
  const avant = pageCourante; pageCourante = nom; idx = i;
  poser(-i * largeur(), true);
  TB.forEach(b => b.classList.toggle("on", b.dataset.page === nom));
  spOuvert = nom === "musique";
  if (spOuvert){ majPlayer(); loadSpotify(); } else if (avant === "musique"){ try { ytp && ytp.pauseVideo(); } catch(_){} }
}
TB.forEach(b => { b.onclick = () => allerPage(b.dataset.page); });
const pager = $("pager");
pager.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, id: e.pointerId, actif: false, vx: 0, lx: e.clientX, lt: e.timeStamp };
});
pager.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const ddx = e.clientX - drag.x, ddy = e.clientY - drag.y;
  if (!drag.actif){
    if (Math.abs(ddx) > 12 && Math.abs(ddx) > Math.abs(ddy) * 1.2){ drag.actif = true; try { pager.setPointerCapture(e.pointerId); } catch(_){} }
    else { if (Math.abs(ddy) > 12) drag = null; return; }
  }
  const W = largeur(), min = -(ORDRE.length - 1) * W;
  let x = -idx * W + ddx;
  if (x > 0) x = x * .35; else if (x < min) x = min + (x - min) * .35;   // résistance en bout de course
  poser(x, false);
  drag.vx = (e.clientX - drag.lx) / Math.max(1, e.timeStamp - drag.lt); drag.lx = e.clientX; drag.lt = e.timeStamp;
  TB.forEach((b, k) => b.classList.toggle("on", k === Math.max(0, Math.min(ORDRE.length - 1, Math.round(-x / W)))));
});
const finDrag = e => {
  if (!drag) return; const d = drag; drag = null;
  if (!d.actif) return;
  clicBloque = true; setTimeout(() => { clicBloque = false; }, 60);
  const ddx = e.clientX - d.x, W = largeur();
  const sens = Math.abs(d.vx) > .45 ? (d.vx < 0 ? 1 : -1) : (Math.abs(ddx) > W * .22 ? (ddx < 0 ? 1 : -1) : 0);
  allerPage(ORDRE[Math.max(0, Math.min(ORDRE.length - 1, idx + sens))]);
};
["pointerup", "pointercancel"].forEach(n => pager.addEventListener(n, finDrag));
document.addEventListener("click", e => { if (clicBloque){ e.stopPropagation(); e.preventDefault(); } }, true);
addEventListener("resize", () => poser(-idx * largeur(), false));
["pointerdown", "keydown"].forEach(e => addEventListener(e, () => { dernierToucher = Date.now(); }));
setInterval(() => { if (pageCourante !== "accueil" && Date.now() - dernierToucher > 180000) allerPage("accueil"); }, 15000);
poser(0, false);

/* Plein écran : au premier toucher dans Safari (inutile une fois ajouté à l’écran d’accueil) */
document.addEventListener("pointerdown", () => {
  try {
    const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f && !navigator.standalone && !document.fullscreenElement && !document.webkitFullscreenElement){ const p = f.call(el); if (p && p.catch) p.catch(() => {}); }
  } catch(_){}
}, { once: true });

/* Garde l’écran allumé quand c’est possible */
try { navigator.wakeLock && navigator.wakeLock.request("screen"); } catch(_){}
</script>
